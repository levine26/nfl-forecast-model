<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Sunday Signal</title>
    <script>
      (function redirectSundaySignalRoute(){
        var base='/nfl-forecast-model'
        var path=window.location.pathname.startsWith(base)?window.location.pathname.slice(base.length):window.location.pathname
        var route=path+(window.location.search||'')+(window.location.hash||'')
        window.location.replace(base+'/?__route='+encodeURIComponent(route))
      })()
    </script>
  </head>
  <body></body>
</html>
