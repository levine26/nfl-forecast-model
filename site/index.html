    <script>
      (function restoreSundaySignalRoute(){
        var params=new URLSearchParams(window.location.search)
        var route=params.get('__route')
        if(!route)return
        var safe=route.charAt(0)==='/'?route:'/'+route
        window.history.replaceState(null,'','/nfl-forecast-model'+safe)
      })()
