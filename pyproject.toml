[project]
name = "nfl-forecast-engine"
version = "0.1.0"
description = "Free, automated Sujar-inspired NFL forecasting ensemble"
requires-python = ">=3.11"
dependencies = [
  "nflreadpy>=0.1.3",
  "polars>=1.25",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "catboost>=1.2",
  "pyarrow>=17",
  "duckdb>=1.1",
  "pyyaml>=6.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
