[project]
name = "nfl-forecast-engine"
version = "0.1.0"
description = "LevLine NFL forecasting engine and Sunday Signal publication stack"
requires-python = ">=3.11,<3.12"
dependencies = [
  "nflreadpy==0.1.5",
  "polars==1.44.2",
  "pandas==3.0.5",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "scikit-learn==1.9.0",
  "xgboost==3.2.0",
  "catboost==1.2.10",
  "pyarrow==25.0.1",
  "duckdb==1.5.5",
  "joblib==1.6.0",
  "threadpoolctl==3.6.0",
  "pyyaml>=6.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "json-repair>=0.63,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.package-data]
nfl_forecast = ["artifacts/*.json", "artifacts/*.csv", "artifacts/*.part*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100