name: ATS NextGen Q3 Stage C

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/challenger_ats_nextgen_q3.py'
      - 'src/nfl_forecast/challenger_ats_nextgen_q3_reporting.py'
      - 'scripts/run_challenger_ats_nextgen_q3.py'
      - 'tests/test_challenger_ats_nextgen_q3.py'
      - 'tests/test_challenger_ats_nextgen_q3_reporting.py'
      - 'research/ats-nextgen/**'
      - '.github/workflows/research_ats_nextgen_q3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ats-nextgen-q3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROTECTED_SURFACES: >-
    outputs/ site/ src/nfl_forecast/pipeline.py src/nfl_forecast/models.py
    src/nfl_forecast/features.py src/nfl_forecast/data.py src/nfl_forecast/publish.py
    src/nfl_forecast/market.py src/nfl_forecast/market_t120.py src/nfl_forecast/lock_verify.py
    scripts/run_week.py scripts/refresh_market.py scripts/pregame_due.py scripts/verify_pregame_lock.py

jobs:
  contract:
    name: Q3 frozen contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Prove frozen gate, Q3 hurdle, and reporting contracts
        run: |
          pytest -q \
            tests/test_challenger_ats_nextgen_phase2_gate.py \
            tests/test_challenger_ats_nextgen_q3.py \
            tests/test_challenger_ats_nextgen_q3_reporting.py
      - name: Verify frozen scientific blobs remain unchanged
        run: |
          test "$(git rev-parse HEAD:src/nfl_forecast/challenger_ats_nextgen_q3.py)" = "c707ec8994fa27038ec9e14c757f5a67e99b6e86"
          test "$(git rev-parse HEAD:src/nfl_forecast/challenger_ats_nextgen_q3_reporting.py)" = "89660aaefeb14624bc16434cf91dd2f08feef067"
          test "$(git rev-parse HEAD:scripts/run_challenger_ats_nextgen_q3.py)" = "733a5cac7cbcc9efa6d378fb92edc4eea1585893"
          test "$(git rev-parse HEAD:tests/test_challenger_ats_nextgen_q3.py)" = "2456c5a70c4a74c5672d38e5adcd74f8b954e519"
          test "$(git rev-parse HEAD:tests/test_challenger_ats_nextgen_q3_reporting.py)" = "0d914311f7572f7e7a3e1964900fb24759014f69"
      - name: Prove contract tests did not modify production surfaces
        run: git diff --exit-code -- $PROTECTED_SURFACES

  closeout:
    name: Q3 negative-result closeout
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable Q3 result registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          q2 = json.loads(Path('research/ats-nextgen/phase2_q2_result_registry.json').read_text())
          q3 = json.loads(Path('research/ats-nextgen/phase2_q3_result_registry.json').read_text())

          assert q2['classification'] == 'STRUCTURALLY_INVALID_FROZEN_SUPPORT_CONTRACT'
          assert q2['accepted_q2_outer_oof_artifact'] is None
          assert q2['accepted_q2_primary_performance'] is None

          assert q3['classification'] == 'NOT_INCREMENTAL_VS_Q3_M2'
          assert q3['accepted_result_head'] == '891d921c24bc045dd58de3b2dd05871f12d09183'
          assert q3['workflow']['run_id'] == 35931071604
          assert q3['workflow']['contract_job_id'] == 107417390267
          assert q3['workflow']['historical_job_id'] == 107418004469
          assert q3['artifact']['id'] == 10781521222
          assert q3['artifact']['digest'] == 'sha256:6062472dce30fddfcc6ad16d1d5c29203491f6e77d893aa673cc20bbb29a1bfa'
          assert q3['artifact']['outer_oof_rows'] == 1087
          assert q3['artifact']['files_sha256']['q3_outer_oof_2022_2025.csv'] == '18610dfcfa9ffe71ed30259f9fef85a5655cefa68301f46fa1bb1950593dee04'
          assert q3['primary_metric']['q3_m2'] == 0.7716887205239867
          assert q3['primary_metric']['q3'] == 0.7730044623812287
          assert q3['primary_metric']['q3_minus_q3_m2'] == 0.0013157418572419255
          assert q3['primary_metric']['q3_minus_q3_m2'] > 0.0
          assert q3['q2_complementarity_available'] is False
          assert q3['q2_q3_blend_available'] is False
          assert q3['candidate_repair_or_rescue_performed'] is False
          assert q3['posthoc_calibration_applied'] is False
          assert q3['class_weighting_used'] is False
          assert q3['completed_2026_outcomes_used'] == 0
          assert q3['production_changed'] is False
          PY
      - name: Prove closeout did not modify production surfaces
        run: git diff --exit-code -- $PROTECTED_SURFACES
