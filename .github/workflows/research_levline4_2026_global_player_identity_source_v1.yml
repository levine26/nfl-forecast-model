name: LevLine 4 2026 global player identity source V1

on:
  pull_request:
    paths:
      - 'research/levline4_2026_global_player_identity_source_v1_contract.json'
      - 'research/levline4_2026_global_player_identity_source_v1_receipt.json'
      - 'research/levline4_2026_global_player_identity_source_v1.py'
      - 'research/test_levline4_2026_global_player_identity_source_v1.py'
      - '.github/workflows/research_levline4_2026_global_player_identity_source_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline4-2026-global-player-identity-source-v1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install pytest 'polars==1.44.2' 'requests>=2.32'
      - name: Test identity-only projection
        run: pytest -q research/test_levline4_2026_global_player_identity_source_v1.py
      - name: Validate frozen contract and empirical receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/levline4_2026_global_player_identity_source_v1_contract.json').read_text())
          r = json.loads(Path('research/levline4_2026_global_player_identity_source_v1_receipt.json').read_text())
          assert c['contract_id'] == 'LEVLINE-4-2026-GLOBAL-PLAYER-IDENTITY-SOURCE-V1'
          assert c['source']['asset_id'] == 567981040
          assert c['source']['asset_created_at_utc'] == '2026-09-16T13:00:58Z'
          assert c['source']['asset_size_bytes'] == 3386516
          assert c['source']['expected_sha256'] == 'a6874a809c67a4a0b8749206fe1820fe25f440e460d78394d2ff762b94a3d32b'
          assert c['identity_projection']['team_membership_fields_selected'] is False
          assert c['identity_projection']['roster_status_fields_selected'] is False
          assert c['resolver_boundary']['player_identity_resolution_performed_by_this_contract'] is False
          assert c['authority']['player_identity_to_gsis_qualified'] is False
          assert c['authority']['team_membership_authorized'] is False
          assert c['authority']['production_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used_for_design_or_selection'] == 0
          assert r['contract_id'] == c['contract_id']
          assert r['status'] == 'EMPIRICAL_SOURCE_CAPTURE_COMPLETE_SOURCE_QUALIFIED'
          assert r['workflow_evidence']['first_frozen_run_id'] == 35114150880
          assert r['source_result']['raw_source_sha256'] == c['source']['expected_sha256']
          assert r['projection_result']['source_rows_selected'] == 24824
          assert r['projection_result']['canonical_00_gsis_rows'] == 18746
          assert r['projection_result']['duplicate_gsis_identity_conflicts'] == 0
          assert r['projection_result']['exact_display_name_collision_count'] == 820
          assert r['scientific_disposition']['source_capture_qualified'] is True
          assert r['scientific_disposition']['player_identity_to_gsis_qualified'] is False
          assert r['scientific_disposition']['exact_display_name_alone_is_identity_authority'] is False
          assert r['scientific_disposition']['team_membership_authorized'] is False
          assert r['scientific_disposition']['production_authorized'] is False
          assert r['governance']['completed_2026_outcomes_used_for_design_or_selection'] == 0
          assert r['governance']['f_st_01_frozen_2026_unchanged'] is True
          PY

  capture-exact-source:
    needs: unit-and-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture dependencies
        run: python -m pip install 'polars==1.44.2' 'requests>=2.32'
      - name: Capture exact global player source
        run: python -m research.levline4_2026_global_player_identity_source_v1
      - name: Reproduce deterministic frozen empirical evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          observed = json.loads(Path('research_outputs/levline4_2026_global_player_identity_source_v1/receipt.json').read_text())
          frozen = json.loads(Path('research/levline4_2026_global_player_identity_source_v1_receipt.json').read_text())
          assert observed['status'] == 'PASS'
          assert observed['raw_source_sha256'] == frozen['source_result']['raw_source_sha256']
          assert observed['raw_source_bytes'] == frozen['source_result']['raw_source_bytes']
          assert observed['projection_sha256'] == frozen['projection_result']['projection_sha256']
          assert observed['projection_bytes'] == frozen['projection_result']['projection_bytes']
          assert observed['projection_fields'] == frozen['projection_result']['projection_fields']
          assert observed['source_rows_selected'] == frozen['projection_result']['source_rows_selected']
          assert observed['blank_gsis_rows'] == frozen['projection_result']['blank_gsis_rows']
          assert observed['canonical_00_gsis_rows'] == frozen['projection_result']['canonical_00_gsis_rows']
          assert observed['noncanonical_or_blank_gsis_rows'] == frozen['projection_result']['noncanonical_or_blank_gsis_rows']
          assert observed['blank_display_name_rows'] == frozen['projection_result']['blank_display_name_rows']
          assert observed['duplicate_gsis_identity_conflicts'] == frozen['projection_result']['duplicate_gsis_identity_conflicts']
          assert observed['exact_display_name_collision_count'] == frozen['projection_result']['exact_display_name_collision_count']
          assert observed['projection_contains_forbidden_team_or_status_fields'] is False
          assert observed['source_capture_qualified_by_this_receipt'] is True
          assert observed['player_identity_to_gsis_qualified'] is False
          assert observed['team_membership_authorized'] is False
          assert observed['availability_state_authorized'] is False
          assert observed['player_value_join_authorized'] is False
          assert observed['forecast_probability_effect_authorized'] is False
          assert observed['production_authorized'] is False
          assert observed['completed_2026_outcomes_used_for_design_or_selection'] == 0
          assert observed['f_st_01_frozen_2026_unchanged'] is True
          print(json.dumps({
              'raw_source_sha256': observed['raw_source_sha256'],
              'projection_sha256': observed['projection_sha256'],
              'source_rows_selected': observed['source_rows_selected'],
              'canonical_00_gsis_rows': observed['canonical_00_gsis_rows'],
              'duplicate_gsis_identity_conflicts': observed['duplicate_gsis_identity_conflicts'],
              'exact_display_name_collision_count': observed['exact_display_name_collision_count'],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline4-2026-global-player-identity-source-v1-${{ github.run_id }}
          path: research_outputs/levline4_2026_global_player_identity_source_v1/
          if-no-files-found: error
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch is research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
