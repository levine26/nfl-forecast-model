name: LevLine Props live refresh

# Prospective collectors download this run's audit artifact with an explicit repository binding
# before checking out the generation SHA; changing this workflow triggers a fresh direct source run.

on:
  workflow_dispatch:
    inputs:
      season:
        description: Optional explicit season; omit to use outputs/this_week.csv
        required: false
        type: string
      week:
        description: Optional explicit week; omit to use outputs/this_week.csv
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/run_levline_markets_live.py'
      - 'tests/test_levline_markets_live.py'
      - '.github/workflows/levline_markets_live.yml'
      - 'config/levline_markets_priors_v1.json'
      - 'scripts/build_props_upstream_snapshot.py'
      - 'scripts/build_props_market_snapshot.py'
      - 'scripts/build_props_integration_manifest.py'
      - 'scripts/run_props_research_beta.py'
      - 'src/nfl_forecast/props_*.py'
      - 'src/nfl_forecast/props21_*.py'
      - 'scripts/build_props21_challenger.py'
      - 'tests/test_props_*.py'
  pull_request:
    paths:
      - 'scripts/run_levline_markets_live.py'
      - 'tests/test_levline_markets_live.py'
      - '.github/workflows/levline_markets_live.yml'
      - 'config/levline_markets_priors_v1.json'
      - 'scripts/build_props_upstream_snapshot.py'
      - 'scripts/build_props_market_snapshot.py'
      - 'scripts/build_props_integration_manifest.py'
      - 'scripts/run_props_research_beta.py'
      - 'src/nfl_forecast/props_*.py'
      - 'src/nfl_forecast/props21_*.py'
      - 'scripts/build_props21_challenger.py'
      - 'tests/test_props_*.py'
  schedule:
    # Regular snapshots Thursday-Saturday and Monday.
    - cron: '20 15,22 * * 4,5,6,1'
    # Denser Sunday snapshots as the main slate approaches and rolls through kickoff.
    - cron: '20 13,16,19,22 * * 0'
  workflow_run:
    workflows: ['Sunday Signal Groq media writer']
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  # Keep direct refreshes and qualifying media-trigger refreshes from cancelling one another.
  # Nonqualifying workflow_run events instantiate this workflow before job-level if guards can
  # skip them, so isolate each ignored event as well.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('levline-props-live-pr-{0}', github.event.pull_request.number)
        || (github.event_name == 'workflow_run'
            && (github.event.workflow_run.conclusion != 'success'
                || github.event.workflow_run.head_branch != 'main'))
           && format('levline-props-live-ignored-{0}', github.event.workflow_run.id)
        || github.event_name == 'workflow_run'
           && 'levline-props-live-media-trigger'
        || 'levline-props-live-direct' }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
      - run: pip install '.[dev]'
      - name: Validate live Props orchestration and governed contracts
        run: >-
          python -m pytest -q
          tests/test_levline_markets_live.py
          tests/test_props_runner.py
          tests/test_props_publication.py
          tests/test_props_market_live.py
          tests/test_props_upstream.py
          tests/test_props_contextual_intelligence.py

  publish:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    needs: validate
    runs-on: ubuntu-latest
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
      PROPS_BOOKMAKERS: ${{ vars.PROPS_BOOKMAKERS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
      - name: Fail closed unless live sportsbook credential exists
        run: |
          set -euo pipefail
          if [ -z "${THE_ODDS_API_KEY:-}" ] && \
             [ -z "${PROPLINE_API_KEY:-}" ] && \
             [ -z "${SPORTSGAMEODDS_API_KEY:-}" ]; then
            echo "::error::No supported live Props sportsbook credential is configured."
            exit 1
          fi
          python scripts/run_levline_markets_live.py \
            --validate-priors-only \
            --priors config/levline_markets_priors_v1.json
      - run: pip install '.[dev]'
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: props-live-nflreadpy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            props-live-nflreadpy-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Generate, freeze, and publish current Props artifact
        run: |
          set -euo pipefail
          git config user.name "levline-props-bot"
          git config user.email "actions@users.noreply.github.com"

          SEASON="${{ inputs.season }}"
          WEEK="${{ inputs.week }}"
          EXTRA_ARGS=()
          if [ -n "$SEASON" ] || [ -n "$WEEK" ]; then
            if [ -z "$SEASON" ] || [ -z "$WEEK" ]; then
              echo "::error::Manual override requires both season and week."
              exit 1
            fi
            EXTRA_ARGS=(--season "$SEASON" --week "$WEEK")
          fi
          BOOK_ARGS=()
          if [ -n "${PROPS_BOOKMAKERS:-}" ]; then
            BOOK_ARGS=(--bookmakers "$PROPS_BOOKMAKERS")
          fi

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "main advanced during Props refresh; regenerating from current main (attempt $attempt/3)"
              git fetch origin main
              git reset --hard origin/main
              git clean -fd outputs/props/
            fi

            # The audit artifact must describe exactly one generation attempt. A retry may use a
            # newer main SHA, so clear any superseded attempt before regenerating.
            rm -rf .artifacts/props-live
            GENERATION_BASE_SHA=$(git rev-parse HEAD)
            TRIGGER_HEAD_SHA=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.head_sha')
            test -n "$GENERATION_BASE_SHA"
            test -n "$TRIGGER_HEAD_SHA"

            PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
              python scripts/run_levline_markets_live.py \
                --priors config/levline_markets_priors_v1.json \
                --work-root .artifacts/props-live \
                "${EXTRA_ARGS[@]}" \
                "${BOOK_ARGS[@]}"

            mapfile -t RUN_ROOTS < <(find .artifacts/props-live -mindepth 1 -maxdepth 1 -type d | sort)
            if [ "${#RUN_ROOTS[@]}" -ne 1 ]; then
              echo "::error::expected exactly one surviving live Props audit run-root; found ${#RUN_ROOTS[@]}"
              exit 1
            fi
            RUN_ROOT="${RUN_ROOTS[0]}"
            MARKET="$RUN_ROOT/market.json"
            RAW_MARKET="$RUN_ROOT/market.raw.json"
            FORECASTS="$RUN_ROOT/forecasts.json"
            MANIFEST_SLATE="$RUN_ROOT/manifests/manifest_slate.json"
            for path in "$MARKET" "$RAW_MARKET" "$FORECASTS" "$MANIFEST_SLATE"; do
              test -f "$path" || { echo "::error::missing live Props audit file: $path"; exit 1; }
            done

            MARKET_PROVIDER=$(jq -r '.provider // empty' "$MARKET")
            CREDENTIAL_MODE=$(jq -r '.credential_mode // "configured"' "$RAW_MARKET")
            CAPTURE_MODE=$(jq -r '.capture_mode // empty' "$RAW_MARKET")
            PROVIDER_ATTEMPTS=$(jq -c '.provider_attempts // []' "$RAW_MARKET")
            test -n "$MARKET_PROVIDER"
            test -n "$CREDENTIAL_MODE"
            LIVE_RUN_ID=$(basename "$RUN_ROOT")
            CREATED_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            MARKET_SHA=$(sha256sum "$MARKET" | awk '{print $1}')
            RAW_MARKET_SHA=$(sha256sum "$RAW_MARKET" | awk '{print $1}')
            FORECASTS_SHA=$(sha256sum "$FORECASTS" | awk '{print $1}')
            MANIFEST_SHA=$(sha256sum "$MANIFEST_SLATE" | awk '{print $1}')

            jq -n \
              --arg contract_version "levline-props-live-source-provenance-v0.1.0" \
              --arg source_workflow_run "${{ github.run_id }}" \
              --arg trigger_head_sha "$TRIGGER_HEAD_SHA" \
              --arg generation_base_sha "$GENERATION_BASE_SHA" \
              --arg live_run_id "$LIVE_RUN_ID" \
              --arg created_utc "$CREATED_UTC" \
              --arg market_provider "$MARKET_PROVIDER" \
              --arg market_credential_mode "$CREDENTIAL_MODE" \
              --arg market_capture_mode "$CAPTURE_MODE" \
              --arg market_snapshot_sha256 "$MARKET_SHA" \
              --arg raw_market_sha256 "$RAW_MARKET_SHA" \
              --arg forecasts_sha256 "$FORECASTS_SHA" \
              --arg manifest_slate_sha256 "$MANIFEST_SHA" \
              --argjson provider_attempts "$PROVIDER_ATTEMPTS" \
              '{
                contract_version:$contract_version,
                source_workflow_run:$source_workflow_run,
                trigger_head_sha:$trigger_head_sha,
                generation_base_sha:$generation_base_sha,
                live_run_id:$live_run_id,
                created_utc:$created_utc,
                market_provider:$market_provider,
                market_credential_mode:$market_credential_mode,
                market_capture_mode:$market_capture_mode,
                provider_attempts:$provider_attempts,
                market_snapshot_sha256:$market_snapshot_sha256,
                raw_market_sha256:$raw_market_sha256,
                forecasts_sha256:$forecasts_sha256,
                manifest_slate_sha256:$manifest_slate_sha256,
                research_only:true,
                production_authorized:false
              }' > "$RUN_ROOT/source_provenance.json"

            # Props 2.1 is a distinct research challenger. A failed/partial/started-slate
            # build exits before publication, leaving the prior valid challenger intact.
            python scripts/build_props21_challenger.py \
              --input outputs/props/forecasts.json \
              --previews outputs/game_previews.json \
              --manifest-slate "$MANIFEST_SLATE" \
              --credential-mode "$CREDENTIAL_MODE" \
              --output challenger_outputs/props21/public_challenger.json \
              --receipts challenger_outputs/props21/forecast_originals.jsonl \
              --report challenger_outputs/props21/live_slate_audit.md

            # History originals may rotate into immutable sub-100 MiB shards.
            # Stage the complete history tree so rotations preserve every row and stage the
            # tracked monolith deletion plus new shard files atomically with current outputs.
            git add -A \
              outputs/props/forecasts.json \
              outputs/props/public_props.json \
              outputs/props/status.json \
              outputs/props/history \
              challenger_outputs/props21

            if git diff --cached --quiet; then
              echo "No Props publication changes to publish."
              exit 0
            fi

            git commit -m "Refresh LevLine Props research beta"
            base_sha=$(git rev-parse HEAD^)
            if git push origin HEAD:main; then
              echo "Published Props outputs to main; dispatching Sunday Signal deployment."
              gh workflow run dashboard.yml --ref main
              exit 0
            fi

            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$base_sha" ]; then
              echo "Push failed even though main did not advance; refusing to mask a non-race publish error."
              exit 1
            fi

            # A challenger evaluator writes only challenger_outputs/** to main. Those files
            # cannot alter this already-generated Props artifact, so do not throw away a
            # valid pregame capture solely because that independent evidence writer landed
            # during publication. Any other incoming path still forces full regeneration.
            for safe_rebase_attempt in 1 2 3 4 5; do
              mapfile -t incoming_paths < <(git diff --name-only "$base_sha" origin/main)
              challenger_only=true
              if [ "${#incoming_paths[@]}" -eq 0 ]; then
                challenger_only=false
              fi
              for incoming_path in "${incoming_paths[@]}"; do
                case "$incoming_path" in
                  challenger_outputs/*) ;;
                  *) challenger_only=false ;;
                esac
              done
              if [ "$challenger_only" != true ]; then
                break
              fi

              echo "main advanced only in challenger_outputs/**; rebasing unchanged Props publication (safe attempt $safe_rebase_attempt/5)."
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Unexpected conflict while rebasing an output-only challenger race."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Published Props outputs after safe challenger-output rebase; dispatching Sunday Signal deployment."
                gh workflow run dashboard.yml --ref main
                exit 0
              fi
              git fetch origin main
            done
          done

          echo "main changed materially during all three Props refresh attempts; leaving existing published Props outputs untouched."
          exit 1
      - name: Preserve full live capture for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levline-props-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/props-live
          if-no-files-found: ignore
          retention-days: 30
