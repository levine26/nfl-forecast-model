name: ATS NextGen Phase 2 opening gate

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/challenger_ats_nextgen_gate.py'
      - 'scripts/run_challenger_ats_nextgen_phase2_gate.py'
      - 'tests/test_challenger_ats_nextgen_phase2_gate.py'
      - 'research/ats-nextgen/**'
      - '.github/workflows/research_ats_nextgen_phase2_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ats-nextgen-phase2-opening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROTECTED_SURFACES: >-
    outputs/ site/ src/nfl_forecast/pipeline.py src/nfl_forecast/models.py
    src/nfl_forecast/features.py src/nfl_forecast/data.py src/nfl_forecast/publish.py
    src/nfl_forecast/market.py src/nfl_forecast/market_t120.py src/nfl_forecast/lock_verify.py
    scripts/run_week.py scripts/refresh_market.py scripts/pregame_due.py scripts/verify_pregame_lock.py

jobs:
  opening-gate:
    name: pre-fit historical gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Run invariant tests
        run: pytest -q tests/test_challenger_ats_nextgen_phase2_gate.py
      - name: Materialize 2015-2025 pre-fit gate
        run: |
          rm -rf research_outputs/ats_nextgen/phase2_opening_gate
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
            python scripts/run_challenger_ats_nextgen_phase2_gate.py
          test -s research_outputs/ats_nextgen/phase2_opening_gate/phase2_gate_frame.csv
          test -s research_outputs/ats_nextgen/phase2_opening_gate/phase2_gate_manifest.json
          test -s research_outputs/ats_nextgen/phase2_opening_gate/phase2_opening_gate_summary.json
      - name: Prove no production surface mutation
        run: git diff --exit-code -- $PROTECTED_SURFACES
      - name: Upload immutable opening evidence
        uses: actions/upload-artifact@v4
        with:
          name: ats-nextgen-phase2-opening-${{ github.sha }}
          path: research_outputs/ats_nextgen/phase2_opening_gate/
          retention-days: 90
