name: LevLine V09B NFL transaction pagination diagnostic V2

on:
  pull_request:
    paths:
      - 'research/availability/v09b_nfl_transaction_pagination_diagnostic_v2_contract.json'
      - 'research/v09b_nfl_transaction_pagination_diagnostic_v2.py'
      - 'research/test_v09b_nfl_transaction_pagination_diagnostic_v2.py'
      - '.github/workflows/research_v09b_nfl_transaction_pagination_diagnostic_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - run: pytest -q research/test_v09b_nfl_transaction_pagination_diagnostic_v2.py
      - name: Validate diagnostic-only authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/availability/v09b_nfl_transaction_pagination_diagnostic_v2_contract.json').read_text())
          assert c['status'] == 'POST_V1_PAGINATION_DIAGNOSTIC_ONLY_NO_SOURCE_OR_CHRONOLOGY_AUTHORITY'
          assert len(c['fixed_endpoints']) == 2
          assert len(c['transport_variants']) == 4
          assert c['diagnostic_requirements']['content_advancement_is_observation_not_gate'] is True
          assert c['authority']['diagnostic_has_source_qualification_authority'] is False
          assert c['authority']['full_paginated_source_class_qualified'] is False
          assert c['authority']['v09b_model_fit_authorized'] is False
          PY

  diagnose-pagination:
    needs: unit-and-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Run frozen transport diagnostic
        run: |
          OUT=research_outputs/v09b_nfl_transaction_pagination_diagnostic_v2/result.json
          mkdir -p "$(dirname "$OUT")"
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_nfl_transaction_pagination_diagnostic_v2.py \
              --contract research/availability/v09b_nfl_transaction_pagination_diagnostic_v2_contract.json \
              --output "$OUT"
      - name: Assert diagnostic firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('research_outputs/v09b_nfl_transaction_pagination_diagnostic_v2/result.json').read_text())
          assert r['diagnostic_complete'] is True
          assert r['endpoints_expected'] == 2
          assert r['endpoints_completed'] == 2
          assert r['errors'] == []
          assert all(len(x['variants']) == 4 for x in r['endpoints'])
          assert all(x['initial_rows_parsed'] >= 25 for x in r['endpoints'])
          assert r['content_advancement_is_observation_not_gate'] is True
          assert r['diagnostic_has_source_qualification_authority'] is False
          assert r['diagnostic_has_chronology_authority'] is False
          assert r['full_paginated_source_class_qualified'] is False
          assert r['transaction_state_machine_defined'] is False
          assert r['modern_game_day_roster_universe_qualified'] is False
          assert r['training_source_chronology_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['completed_2026_outcomes_used'] == 0
          assert r['model_fit_performed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v09b-nfl-transaction-pagination-diagnostic-v2-${{ github.run_id }}
          path: research_outputs/v09b_nfl_transaction_pagination_diagnostic_v2/result.json
          if-no-files-found: error
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
