name: LevLine V09B legacy Game Book identity audit V1

on:
  pull_request:
    paths:
      - 'research/availability/v09b_legacy_gamebook_identity_contract_v1.json'
      - 'research/v09b_legacy_gamebook_identity_audit_v1.py'
      - 'research/test_v09b_legacy_gamebook_identity_audit_v1.py'
      - '.github/workflows/research_v09b_legacy_gamebook_identity_audit_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test exact identity semantics
        run: pytest -q research/test_v09b_legacy_gamebook_identity_audit_v1.py
      - name: Validate exact-match contract and authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/availability/v09b_legacy_gamebook_identity_contract_v1.json').read_text())
          assert c['status'] == 'EXACT_MATCH_FIRST_EXECUTION'
          assert c['membership_authority']['weekly_roster_defines_membership'] is False
          assert c['membership_authority']['weekly_roster_status_used'] is False
          assert c['identity_source']['forbidden_for_resolution'] == [
              'status', 'status_description_abbr', 'status_short_description'
          ]
          assert c['exact_match_rule']['required_result'] == 'exactly one distinct non-null gsis_id'
          assert c['exact_match_rule']['nickname_or_fuzzy_matching_allowed'] is False
          assert c['exact_match_rule']['adjacent_week_fallback_allowed'] is False
          assert c['exact_match_rule']['season_wide_fallback_allowed'] is False
          assert c['exact_match_rule']['manual_player_overrides_allowed'] is False
          assert c['frozen_audit_gates']['gamebook_identity_resolution_rate_required'] == 1.0
          assert c['frozen_audit_gates']['ambiguous_gamebook_identities_allowed'] == 0
          assert c['frozen_audit_gates']['unresolved_gamebook_identities_allowed'] == 0
          assert c['authorization']['v09b_model_fit_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used'] == 0
          PY

  identity-audit:
    needs: unit-and-contract
    strategy:
      fail-fast: false
      matrix:
        season: [2012, 2013, 2014, 2015, 2016]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install '.[dev]'
      - name: Resolve exact Game Book identities to GSIS IDs
        run: |
          ROOT=research_outputs/v09b_legacy_gamebook_identity_v1/${{ matrix.season }}
          mkdir -p "$ROOT"
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_legacy_gamebook_identity_audit_v1.py \
              --season ${{ matrix.season }} \
              --archive-root "$ROOT/archive" \
              --output "$ROOT/receipt.json"
      - name: Assert identity-only authority and no leakage
        if: always()
        run: |
          p=research_outputs/v09b_legacy_gamebook_identity_v1/${{ matrix.season }}/receipt.json
          if test -s "$p"; then
            python - <<'PY'
          import json
          from pathlib import Path
          season = '${{ matrix.season }}'
          r = json.loads(Path(f'research_outputs/v09b_legacy_gamebook_identity_v1/{season}/receipt.json').read_text())
          assert r['weekly_roster_status_used'] is False
          assert 'status' not in r['weekly_identity_source_allowed_fields_only']
          assert 'status_description_abbr' not in r['weekly_identity_source_allowed_fields_only']
          assert 'status_short_description' not in r['weekly_identity_source_allowed_fields_only']
          assert r['training_label_semantics_qualified'] is False
          assert r['training_source_chronology_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['model_fit_performed'] is False
          assert r['game_outcomes_used'] == 0
          assert r['completed_2026_outcomes_used'] == 0
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v09b-legacy-gamebook-identity-v1-${{ matrix.season }}-${{ github.run_id }}
          path: research_outputs/v09b_legacy_gamebook_identity_v1/${{ matrix.season }}/receipt.json
          if-no-files-found: warn
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove identity audit remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
