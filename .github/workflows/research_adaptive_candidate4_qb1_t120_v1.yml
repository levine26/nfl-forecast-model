name: Adaptive Candidate 4 T-120 QB1 snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/adaptive_candidate4_qb1_snapshot_v1.py'
      - 'research/run_adaptive_candidate4_qb1_snapshot_v1.py'
      - 'research/test_adaptive_candidate4_qb1_snapshot_v1.py'
      - 'research/qb1_t120_ledger_publish_v1.py'
      - 'research/test_qb1_t120_ledger_publish_v1.py'
      - '.github/workflows/research_adaptive_candidate4_qb1_t120_v1.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install T-120 snapshot test dependencies
        run: >-
          python -m pip install
          pytest
          'pandas==3.0.5'
          'beautifulsoup4>=4.12'
      - name: Validate immutable T-120 QB1 capture
        run: >-
          PYTHONPATH="$PWD/src:$PWD"
          python -m pytest -q
          research/test_adaptive_candidate4_qb1_snapshot_v1.py
          research/test_qb1_t120_ledger_publish_v1.py

  capture:
    concurrency:
      # T-120 has a narrow one-sided window and occurs before inactive capture starts.
      group: adaptive-candidate4-qb1-t120-v1
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore existing Candidate 4 source ledger
        run: |
          set -euo pipefail
          git fetch origin research-data/inactive-snapshots-v1:refs/remotes/origin/research-data/inactive-snapshots-v1 || true
          if git show-ref --verify --quiet refs/remotes/origin/research-data/inactive-snapshots-v1; then
            mkdir -p research_outputs
            if git ls-tree -d --name-only origin/research-data/inactive-snapshots-v1               research_outputs/adaptive_candidate4 |               grep -q '^research_outputs/adaptive_candidate4$'; then
              git archive origin/research-data/inactive-snapshots-v1                 research_outputs/adaptive_candidate4 | tar -xf -
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned T-120 source dependency
        run: >-
          python -m pip install
          'pandas==3.0.5'
          'nflreadpy==0.1.5'
          'beautifulsoup4>=4.12'

      - name: Capture immutable T-120 QB1 identities
        id: snapshot
        continue-on-error: true
        run: >-
          PYTHONPATH="$PWD/src:$PWD"
          python -m research.run_adaptive_candidate4_qb1_snapshot_v1

      - name: Persist T-120 QB1 evidence away from main
        if: always()
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/adaptive_candidate4
          if [ ! -s "$DATA_DIR/qb1_t120_snapshots.csv" ]; then
            echo 'No Candidate 4 T-120 QB1 snapshot rows are ready.'
            exit 0
          fi

          # Freeze the captured bytes BEFORE changing Git trees or retrying pushes.
          # Do not regenerate a T-120 observation after its original cutoff.
          PENDING="$RUNNER_TEMP/candidate4-qb1-pending.csv"
          cp "$DATA_DIR/qb1_t120_snapshots.csv" "$PENDING"
          DATA_BRANCH=research-data/inactive-snapshots-v1
          WORKTREE="$RUNNER_TEMP/candidate4-qb1-publish"
          git fetch origin "refs/heads/${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}"
          # Isolated checkout: research_outputs/ in the source worktree may be
          # untracked. Never checkout a data branch over those captured files.
          git worktree add --detach "$WORKTREE" "refs/remotes/origin/${DATA_BRANCH}"
          git -C "$WORKTREE" config user.name 'levline-research-bot'
          git -C "$WORKTREE" config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git -C "$WORKTREE" reset --hard "refs/remotes/origin/${DATA_BRANCH}"
            fi
            DEST="$WORKTREE/research_outputs/adaptive_candidate4/qb1_t120_snapshots.csv"
            # Reconcile immutable original game records against the most recent
            # shared research-data parent; preserve all unrelated branch paths.
            PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" \
              python - "$DEST" "$PENDING" <<'PY'
          from pathlib import Path
          import json
          import sys
          from research.qb1_t120_ledger_publish_v1 import reconcile_qb1_ledger
          print(json.dumps(reconcile_qb1_ledger(Path(sys.argv[1]), Path(sys.argv[2])), sort_keys=True))
          PY

            git -C "$WORKTREE" add -- research_outputs/adaptive_candidate4/qb1_t120_snapshots.csv
            if git -C "$WORKTREE" diff --cached --quiet; then
              echo 'Candidate 4 QB1 ledger already present, no rewrite.'
              exit 0
            fi
            git -C "$WORKTREE" commit -m 'Append original Candidate 4 T-120 QB1 capture'
            base_sha=$(git -C "$WORKTREE" rev-parse HEAD^)
            if git -C "$WORKTREE" push origin "HEAD:refs/heads/${DATA_BRANCH}"; then
              echo 'Candidate 4 QB1 ledger published to research-data branch.'
              exit 0
            fi

            git -C "$WORKTREE" fetch origin "refs/heads/${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}"
            if [ "$(git -C "$WORKTREE" rev-parse "refs/remotes/origin/${DATA_BRANCH}")" = "$base_sha" ]; then
              echo 'Push failed without branch advancement; refusing to mask remote failure.' >&2
              exit 1
            fi
            echo "Research-data branch advanced, reconcile without changing observed bytes (attempt $attempt/3)."
          done

          echo 'QB1 capture could not be durably published after bounded retries.' >&2
          exit 1

      - name: Surface snapshot failure after evidence preservation
        if: always()
        run: |
          if [ "${{ steps.snapshot.outcome }}" != 'success' ]; then
            echo 'Candidate 4 T-120 QB1 capture failed; any evidence produced was preserved.' >&2
            exit 1
          fi
