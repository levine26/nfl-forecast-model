name: LevLine Phase 4B integrity research QA
on:
  pull_request:
    paths:
      - 'research/post_week4_phase4/phase4b_integrity_audit.py'
      - 'research/post_week4_phase4/test_phase4b_integrity_audit.py'
      - 'research/post_week4_phase4/test_phase4b_actual_git_lock.py'
      - 'research/post_week4_phase4/PHASE4B_INTEGRATION_READINESS.md'
      - 'research/LEVLINE_POST_WEEK4_MODEL_IMPROVEMENT_PLAN.md'
      - '.github/workflows/research_phase4b_integrity.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      PYTHONHASHSEED: '26'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and isolate research dependencies
        run: |
          python -m compileall -q research/post_week4_phase4
          python -m pip install 'pytest>=8' 'numpy==2.4.6' 'scipy==1.17.1'
      - name: Exact C, two-stage and adapter-level E2E adversarial QA
        run: |
          python -m pytest -q research/post_week4_phase4/test_c_shadow.py research/post_week4_phase4/test_two_stage_gateway.py research/post_week4_phase4/test_nflverse_epa_adapter.py research/post_week4_phase4/test_original_lock_audit.py research/post_week4_phase4/test_phase4b_integrity_audit.py research/post_week4_phase4/test_phase4b_actual_git_lock.py
          python - <<'PY'
          import json
          from pathlib import Path
          from research.post_week4_phase4.c_shadow import canonical_hash, validate_model
          obj=json.loads(Path("research/post_week4_phase4/artifacts/C_SHADOW_FROZEN_2026.json").read_text())
          validate_model(obj)
          assert canonical_hash(obj) == "6af9358922321c3a03f9285df384e96cbe2d59f6d9780d2cd1ddf7d39c1ccdd5"
          print("Frozen Candidate C identity preserved")
          PY
      - name: No production modifications
        run: |
          git fetch origin main --quiet
          base=$(git merge-base HEAD origin/main)
          if git diff --name-only "$base" HEAD | grep -E '^(outputs/|site/|src/nfl_forecast/|scripts/|\.github/workflows/(pregame|market_refresh|weekly)\.yml)'; then
             echo 'Research firewall violated'; exit 1
          fi
