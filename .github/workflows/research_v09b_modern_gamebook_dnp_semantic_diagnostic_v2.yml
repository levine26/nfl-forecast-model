name: LevLine V09B modern Game Book DNP semantic diagnostic V2

on:
  pull_request:
    paths:
      - 'research/availability/v09b_modern_gamebook_dnp_semantic_diagnostic_v2_contract.json'
      - 'research/v09b_modern_gamebook_dnp_semantic_diagnostic_v2.py'
      - 'research/test_v09b_modern_gamebook_dnp_semantic_diagnostic_v2.py'
      - '.github/workflows/research_v09b_modern_gamebook_dnp_semantic_diagnostic_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-v09b-modern-dnp-semantic-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test frozen contradiction logic
        run: pytest -q research/test_v09b_modern_gamebook_dnp_semantic_diagnostic_v2.py
      - name: Validate diagnostic-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/availability/v09b_modern_gamebook_dnp_semantic_diagnostic_v2_contract.json').read_text())
          assert c['status'] == 'POST_FAILURE_DIAGNOSTIC_ONLY_NO_QUALIFICATION_AUTHORITY'
          assert c['canonical_universe']['expected_games_total'] == 1296
          assert c['canonical_universe']['expected_team_partitions_total'] == 2592
          assert len(c['frozen_v1_failure_replay']['expected_failed_game_team_partitions']) == 7
          assert c['frozen_v1_failure_replay']['expected_active_count_contradiction_partitions'] == 6
          assert c['frozen_v1_failure_replay']['expected_total_roster_count_contradiction_partitions'] == 3
          assert c['frozen_v1_failure_replay']['v1_thresholds_relaxed'] is False
          assert c['frozen_v1_failure_replay']['v1_membership_semantics_changed'] is False
          assert c['contradiction_logic']['diagnostic_contradictions_authorize_replacement_membership'] is False
          assert c['forbidden_inferences']['did_not_play_identity_classified_active'] is False
          assert c['forbidden_inferences']['did_not_play_identity_classified_inactive'] is False
          assert c['forbidden_inferences']['lineups_or_substitutions_used_as_training_positive_labels'] is False
          assert c['forbidden_inferences']['weekly_roster_status_used'] is False
          assert c['authority']['diagnostic_has_qualification_authority'] is False
          assert c['authority']['modern_game_day_roster_universe_qualified'] is False
          assert c['authority']['v09b_model_fit_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used'] == 0
          PY

  diagnose-season:
    needs: unit-and-contract
    strategy:
      fail-fast: false
      matrix:
        season: [2017, 2018, 2019, 2020, 2021]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install '.[dev]'
      - name: Materialize exact qualified modern V2 archive
        run: |
          set -euo pipefail
          DATA_BRANCH=research-data/v09b-gamebooks-modern-v2
          EXPECTED_COMMIT=aab55bf97aa62cae446b358b9739f4c62604cc8e
          git fetch origin "$DATA_BRANCH"
          git cat-file -e "$EXPECTED_COMMIT^{commit}"
          git worktree add --detach /tmp/v09b-modern-v2-data "$EXPECTED_COMMIT"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/v09b-modern-v2-data/research_outputs/v09b_modern_gamebook_raw_archive_v2/aggregate_qualification.json')
          r = json.loads(p.read_text())
          assert r['qualification_id'] == 'V09B-MODERN-GAMEBOOK-RAW-ARCHIVE-V2-QUALIFICATION'
          assert r['canonical_games'] == 1296
          assert r['qualified_source_rows'] == 1296
          assert r['modern_raw_source_bytes_qualified'] is True
          assert r['modern_gamebook_structure_qualified'] is True
          assert r['modern_game_day_roster_universe_qualified'] is False
          assert r['completed_2026_outcomes_used'] == 0
          PY
      - name: Diagnose DNP semantics from immutable Game Books
        run: |
          ROOT=/tmp/v09b-modern-v2-data/research_outputs/v09b_modern_gamebook_raw_archive_v2
          OUT=research_outputs/v09b_modern_gamebook_dnp_semantic_diagnostic_v2/${{ matrix.season }}.json
          mkdir -p "$(dirname "$OUT")"
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_modern_gamebook_dnp_semantic_diagnostic_v2.py \
              --season ${{ matrix.season }} \
              --archive-root "$ROOT" \
              --output "$OUT"
      - name: Assert diagnostic firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          season = '${{ matrix.season }}'
          r = json.loads(Path(f'research_outputs/v09b_modern_gamebook_dnp_semantic_diagnostic_v2/{season}.json').read_text())
          assert r['diagnostic_gate_pass'] is True
          assert r['v1_failure_replay_exact'] is True
          assert r['source_error_count'] == 0
          assert r['diagnostic_has_qualification_authority'] is False
          assert r['did_not_play_identity_classification_performed'] is False
          assert r['lineups_or_substitutions_used_as_training_positive_labels'] is False
          assert r['absence_from_not_active_used_as_positive_label'] is False
          assert r['weekly_roster_status_used'] is False
          assert r['weekly_roster_membership_used'] is False
          assert r['player_identity_crosswalk_used'] is False
          assert r['modern_game_day_roster_universe_qualified'] is False
          assert r['modern_player_team_game_identity_qualified'] is False
          assert r['training_label_semantics_qualified'] is False
          assert r['training_source_chronology_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['model_fit_performed'] is False
          assert r['completed_2026_outcomes_used'] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v09b-modern-dnp-semantic-v2-${{ matrix.season }}-${{ github.run_id }}
          path: research_outputs/v09b_modern_gamebook_dnp_semantic_diagnostic_v2/${{ matrix.season }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate-diagnostic:
    needs: diagnose-season
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v09b-modern-dnp-semantic-v2-*-${{ github.run_id }}
          path: /tmp/v09b_modern_dnp_semantic_v2
          merge-multiple: true
      - name: Apply frozen aggregate diagnostic checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/v09b_modern_dnp_semantic_v2')
          receipts = [json.loads((root / f'{season}.json').read_text()) for season in [2017, 2018, 2019, 2020, 2021]]
          assert all(r['diagnostic_gate_pass'] is True for r in receipts)
          assert sum(r['canonical_games'] for r in receipts) == 1296
          assert sum(r['team_partitions_diagnosed'] for r in receipts) == 2592
          assert sum(r['exact_marker_games'] for r in receipts) == 1296
          assert sum(r['source_error_count'] for r in receipts) == 0
          failed = sorted(key for r in receipts for key in r['v1_failed_partition_keys'])
          expected = sorted([
              '2018_16_DEN_OAK|OAK',
              '2020_11_PIT_JAX|JAX',
              '2020_13_NO_ATL|NO',
              '2020_15_JAX_BAL|JAX',
              '2021_10_KC_LV|KC',
              '2021_10_TB_WAS|TB',
              '2021_16_PIT_KC|PIT',
          ])
          assert failed == expected
          active_contradictions = sum(r['active_max_contradiction_partitions'] for r in receipts)
          total_contradictions = sum(r['total_roster_max_contradiction_partitions'] for r in receipts)
          assert active_contradictions == 6
          assert total_contradictions == 3
          assert all(r['diagnostic_has_qualification_authority'] is False for r in receipts)
          assert all(r['modern_game_day_roster_universe_qualified'] is False for r in receipts)
          assert all(r['v09b_model_fit_authorized'] is False for r in receipts)

          result = {
              'diagnostic_version': 2,
              'diagnostic_id': 'V09B-MODERN-GAMEBOOK-DNP-SEMANTIC-DIAGNOSTIC-V2-COMPLETE',
              'canonical_games': 1296,
              'team_partitions_diagnosed': 2592,
              'exact_marker_games': 1296,
              'source_errors': 0,
              'v1_failed_partition_keys': failed,
              'active_max_contradiction_partitions': active_contradictions,
              'total_roster_max_contradiction_partitions': total_contradictions,
              'minimum_dnp_non_active_required_total': sum(r['minimum_dnp_non_active_required_total'] for r in receipts),
              'partitions_with_dnp_only_identities': sum(r['partitions_with_dnp_only_identities'] for r in receipts),
              'dnp_only_identity_count_total': sum(r['dnp_only_identity_count_total'] for r in receipts),
              'uniform_did_not_play_as_active_membership_is_contradicted': active_contradictions > 0,
              'replacement_membership_rule_authorized': False,
              'diagnostic_has_qualification_authority': False,
              'modern_game_day_roster_universe_qualified': False,
              'modern_player_team_game_identity_qualified': False,
              'training_label_semantics_qualified': False,
              'training_source_chronology_qualified': False,
              'v09b_model_fit_authorized': False,
              'model_fit_performed': False,
              'game_outcomes_used': 0,
              'completed_2026_outcomes_used': 0,
          }
          (root / 'aggregate_diagnostic.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v09b-modern-dnp-semantic-v2-aggregate-${{ github.run_id }}
          path: /tmp/v09b_modern_dnp_semantic_v2/aggregate_diagnostic.json
          if-no-files-found: error
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
