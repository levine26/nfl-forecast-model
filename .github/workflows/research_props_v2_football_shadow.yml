name: LevLine Props 2.0 football shadow capture

on:
  pull_request:
    paths:
      - 'research/props/v2/record_prospective_football_shadow.py'
      - 'research/props/v2/test_prospective_football_shadow.py'
      - 'research/props/v2/DEFENSIVE_EFFICIENCY_SHADOW_FROZEN.json'
      - 'research/props/v2/PROSPECTIVE_FOOTBALL_SHADOW_A_CONTRACT.md'
      - '.github/workflows/research_props_v2_football_shadow.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main-branch LevLine Props live refresh run ID
        required: true
        type: string
  workflow_run:
    workflows:
      - 'LevLine Props live refresh'
    types:
      - completed

permissions:
  contents: read

env:
  LIVE_SOURCE_PROVENANCE_REQUIRED_VERSION: levline-props-live-source-provenance-v0.1.0

  POSTKICKOFF_NOOP_REQUIRED_VERSION: levline-props-postkickoff-noop-v0.1
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile and test prospective football shadow
        run: |
          python -m py_compile research/props/v2/record_prospective_football_shadow.py
          python -m pytest -q research/props/v2/test_prospective_football_shadow.py

  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    concurrency:
      group: levline-props-v2-football-shadow-capture
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve source live workflow run
        id: source
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID="${{ inputs.source_run_id }}"
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          test -n "$RUN_ID"
          META=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID")
          NAME=$(printf '%s' "$META" | jq -r '.name')
          BRANCH=$(printf '%s' "$META" | jq -r '.head_branch')
          TRIGGER_SHA=$(printf '%s' "$META" | jq -r '.head_sha')
          CONCLUSION=$(printf '%s' "$META" | jq -r '.conclusion')
          if [ "$NAME" != "LevLine Props live refresh" ]; then
            echo "::error::source run is not LevLine Props live refresh: $NAME"
            exit 1
          fi
          if [ "$BRANCH" != "main" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::source run must be successful on main; branch=$BRANCH conclusion=$CONCLUSION"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "trigger_head_sha=$TRIGGER_SHA" >> "$GITHUB_OUTPUT"

      - name: Download and validate exact live source provenance
        id: artifact
        run: |
          set -euo pipefail
          rm -rf /tmp/props-live-artifacts
          mkdir -p /tmp/props-live-artifacts
          gh run download "${{ steps.source.outputs.run_id }}" --repo "${{ github.repository }}" --dir /tmp/props-live-artifacts
          mapfile -t NOOPS < <(find /tmp/props-live-artifacts -name postkickoff_noop.json -type f | sort)
          if [ "${#NOOPS[@]}" -gt 0 ]; then
            mapfile -t NON_NOOP_FILES < <(find /tmp/props-live-artifacts -type f ! -name postkickoff_noop.json | sort)
            if [ "${#NOOPS[@]}" -ne 1 ] || [ "${#NON_NOOP_FILES[@]}" -ne 0 ]; then
              echo "::error::post-kickoff no-op artifact must be the only file in the exact source capture"
              exit 1
            fi
            NOOP="${NOOPS[0]}"
            NOOP_CONTRACT=$(jq -r '.contract_version // empty' "$NOOP")
            PREGAME_COUNT=$(jq '.pregame_game_ids | length' "$NOOP")
            STARTED_COUNT=$(jq '.started_game_ids | length' "$NOOP")
            NOOP_SEASON=$(jq -r '.season // empty' "$NOOP")
            NOOP_WEEK=$(jq -r '.week // empty' "$NOOP")
            [ "$NOOP_CONTRACT" = "$POSTKICKOFF_NOOP_REQUIRED_VERSION" ] || { echo "::error::unexpected post-kickoff no-op contract"; exit 1; }
            [ "$PREGAME_COUNT" -eq 0 ] && [ "$STARTED_COUNT" -gt 0 ] || { echo "::error::invalid post-kickoff no-op game counts"; exit 1; }
            [[ "$NOOP_SEASON" =~ ^[0-9]{4}$ ]] && [[ "$NOOP_WEEK" =~ ^[0-9]{1,2}$ ]] || { echo "::error::invalid post-kickoff no-op season/week"; exit 1; }
            echo "noop=true" >> "$GITHUB_OUTPUT"
            echo "governed post-kickoff no-op; no research capture required"
            exit 0
          fi
          echo "noop=false" >> "$GITHUB_OUTPUT"
          mapfile -t PROVENANCE < <(find /tmp/props-live-artifacts -name source_provenance.json -type f | sort)
          mapfile -t FORECASTS < <(find /tmp/props-live-artifacts -name forecasts.json -type f | sort)
          mapfile -t MANIFESTS < <(find /tmp/props-live-artifacts -name manifest_slate.json -type f | sort)
          mapfile -t MARKETS < <(find /tmp/props-live-artifacts -name market.json -type f | sort)
          if [ "${#PROVENANCE[@]}" -ne 1 ] || [ "${#FORECASTS[@]}" -ne 1 ] || [ "${#MANIFESTS[@]}" -ne 1 ] || [ "${#MARKETS[@]}" -ne 1 ]; then
            echo "::error::Shadow A source artifact must contain one provenance, forecast, manifest-slate, and market file"
            exit 1
          fi
          test -n "$(find /tmp/props-live-artifacts -name upstream_slate.json -print -quit)"

          PROV="${PROVENANCE[0]}"
          CONTRACT=$(jq -r '.contract_version // empty' "$PROV")
          PROV_RUN=$(jq -r '.source_workflow_run // empty' "$PROV")
          PROV_TRIGGER=$(jq -r '.trigger_head_sha // empty' "$PROV")
          GENERATION_SHA=$(jq -r '.generation_base_sha // empty' "$PROV")
          PROVIDER=$(jq -r '.market_provider // empty' "$PROV")
          CREDENTIAL_MODE=$(jq -r '.market_credential_mode // empty' "$PROV")
          EXPECTED_FORECAST_SHA=$(jq -r '.forecasts_sha256 // empty' "$PROV")
          EXPECTED_MANIFEST_SHA=$(jq -r '.manifest_slate_sha256 // empty' "$PROV")
          EXPECTED_MARKET_SHA=$(jq -r '.market_snapshot_sha256 // empty' "$PROV")
          ACTUAL_FORECAST_SHA=$(sha256sum "${FORECASTS[0]}" | awk '{print $1}')
          ACTUAL_MANIFEST_SHA=$(sha256sum "${MANIFESTS[0]}" | awk '{print $1}')
          ACTUAL_MARKET_SHA=$(sha256sum "${MARKETS[0]}" | awk '{print $1}')
          SNAPSHOT_PROVIDER=$(jq -r '.provider // empty' "${MARKETS[0]}")
          PROVENANCE_SHA=$(sha256sum "$PROV" | awk '{print $1}')

          [ "$CONTRACT" = "$LIVE_SOURCE_PROVENANCE_REQUIRED_VERSION" ] || { echo "::error::unexpected live source provenance contract"; exit 1; }
          [ "$PROV_RUN" = "${{ steps.source.outputs.run_id }}" ] || { echo "::error::Shadow A source run provenance mismatch"; exit 1; }
          [ "$PROV_TRIGGER" = "${{ steps.source.outputs.trigger_head_sha }}" ] || { echo "::error::Shadow A trigger SHA provenance mismatch"; exit 1; }
          [[ "$GENERATION_SHA" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]] || { echo "::error::invalid Shadow A generation SHA"; exit 1; }
          [ -n "$PROVIDER" ] && [ -n "$CREDENTIAL_MODE" ] || { echo "::error::Shadow A source missing market provider/mode"; exit 1; }
          [ "$EXPECTED_FORECAST_SHA" = "$ACTUAL_FORECAST_SHA" ] || { echo "::error::Shadow A forecast artifact SHA mismatch"; exit 1; }
          [ "$EXPECTED_MANIFEST_SHA" = "$ACTUAL_MANIFEST_SHA" ] || { echo "::error::Shadow A manifest-slate SHA mismatch"; exit 1; }
          [ "$EXPECTED_MARKET_SHA" = "$ACTUAL_MARKET_SHA" ] || { echo "::error::Shadow A market snapshot SHA mismatch"; exit 1; }
          [ "$SNAPSHOT_PROVIDER" = "$PROVIDER" ] || { echo "::error::Shadow A market provider provenance mismatch"; exit 1; }

          for SHA in "${{ steps.source.outputs.trigger_head_sha }}" "$GENERATION_SHA"; do
            WORKFLOW_B64=$(gh api "repos/${{ github.repository }}/contents/.github/workflows/research_props_v2_football_shadow.yml?ref=$SHA" | jq -r '.content // empty')
            if [ -z "$WORKFLOW_B64" ] || ! printf '%s' "$WORKFLOW_B64" | base64 -d | grep -Fq 'LIVE_SOURCE_PROVENANCE_REQUIRED_VERSION: levline-props-live-source-provenance-v0.1.0'; then
              echo "::error::source SHA predates the live-source-provenance Shadow A listener: $SHA"
              exit 1
            fi
          done
          for required in \
            research/props/v2/record_prospective_football_shadow.py \
            research/props/v2/DEFENSIVE_EFFICIENCY_SHADOW_FROZEN.json; do
            gh api "repos/${{ github.repository }}/contents/$required?ref=$GENERATION_SHA" >/dev/null
          done

          echo "generation_sha=$GENERATION_SHA" >> "$GITHUB_OUTPUT"
          echo "market_provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "market_credential_mode=$CREDENTIAL_MODE" >> "$GITHUB_OUTPUT"
          echo "provenance_sha256=$PROVENANCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.artifact.outputs.noop != 'true'
        with:
          ref: ${{ steps.artifact.outputs.generation_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.artifact.outputs.noop != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/cache@v4
        if: steps.artifact.outputs.noop != 'true'
        with:
          path: .cache/nflreadpy
          key: props-football-shadow-nflreadpy-${{ runner.os }}-${{ steps.source.outputs.run_id }}
          restore-keys: |
            props-live-nflreadpy-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-

      - name: Install project
        if: steps.artifact.outputs.noop != 'true'
        run: |
          python -m pip install -e .
          python -m pip install pyarrow

      - name: Restore immutable football shadow ledger
        if: steps.artifact.outputs.noop != 'true'
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/props_v2/football_shadow
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          git fetch origin research-data/props-v2-football-shadow:refs/remotes/origin/research-data/props-v2-football-shadow || true
          if git show-ref --verify --quiet refs/remotes/origin/research-data/props-v2-football-shadow; then
            git archive --format=tar origin/research-data/props-v2-football-shadow "$DATA_DIR" 2>/dev/null | tar -xf - || true
          fi
          mkdir -p "$DATA_DIR"

      - name: Record immutable prospective Shadow A receipts
        if: steps.artifact.outputs.noop != 'true'
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/props_v2/football_shadow
          python research/props/v2/record_prospective_football_shadow.py \
            --artifact-root /tmp/props-live-artifacts \
            --frozen-coefficients research/props/v2/DEFENSIVE_EFFICIENCY_SHADOW_FROZEN.json \
            --ledger "$DATA_DIR/shadow_a_originals.jsonl" \
            --source-workflow-run "${{ steps.source.outputs.run_id }}" \
            --source-head-sha "${{ steps.artifact.outputs.generation_sha }}" \
            --source-trigger-head-sha "${{ steps.source.outputs.trigger_head_sha }}" \
            --source-market-provider "${{ steps.artifact.outputs.market_provider }}" \
            --source-market-credential-mode "${{ steps.artifact.outputs.market_credential_mode }}" \
            --source-provenance-sha256 "${{ steps.artifact.outputs.provenance_sha256 }}" \
            | tee "$DATA_DIR/last_record_status.json"

      - name: Enforce research-only capture status
        if: steps.artifact.outputs.noop != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_outputs/props_v2/football_shadow/last_record_status.json")
          d=json.loads(p.read_text())
          assert d["contract_version"]=="levline-props-v2-football-shadow-a-v0.1.0"
          assert d["shadow_version"]=="P2-SHADOW-A-DEFENSE-v0.1.0"
          assert d["production_authorized"] is False
          assert d["winner_model_mutated"] is False
          assert d["published_v1_props_mutated"] is False
          assert d["outcomes_read"]==0
          assert len(d["source_head_sha"]) in {40,64}
          assert len(d["source_trigger_head_sha"]) in {40,64}
          assert d["source_market_provider"]
          assert d["source_market_credential_mode"]
          assert len(d["source_provenance_sha256"])==64
          ledger=Path("research_outputs/props_v2/football_shadow/shadow_a_originals.jsonl")
          rows=[]
          if ledger.exists():
              rows=[json.loads(line) for line in ledger.read_text().splitlines() if line.strip()]
          if d["new_receipts"]>0:
              assert rows, "capture reported new receipts but ledger is empty"
          amendment_fields=(
              "source_trigger_head_sha",
              "source_market_provider",
              "source_market_credential_mode",
              "source_provenance_sha256",
          )
          current=[
              row for row in rows
              if str(row.get("source_workflow_run"))==str(d["source_workflow_run"])
          ]
          if d["new_receipts"]>0:
              assert len(current)>=int(d["new_receipts"])
          for row in rows:
              assert row["contract_version"]=="levline-props-v2-football-shadow-a-v0.1.0"
              assert row["shadow_version"]=="P2-SHADOW-A-DEFENSE-v0.1.0"
              assert int(row["source_season"])>=2026
              assert 1<=int(row["source_week"])<=18
              assert len(str(row["source_head_sha"])) in {40,64}
              present=[bool(str(row.get(field) or "").strip()) for field in amendment_fields]
              if any(present):
                  assert all(present), "partial live-source provenance is invalid"
                  assert len(str(row["source_trigger_head_sha"])) in {40,64}
                  assert row["source_market_provider"]
                  assert row["source_market_credential_mode"]
                  assert len(str(row["source_provenance_sha256"]))==64
              assert "actual_result" not in row
              assert "grading_result" not in row
              for model_key in ("v1","shadow_a"):
                  dist=row[model_key]["empirical_distribution"]
                  assert int(dist["sample_count"])>0
                  assert sum(int(x) for x in dist["counts"])==int(dist["sample_count"])
                  assert len(dist["support"])==len(dist["counts"])
                  assert len(str(dist["sha256"]))==64
          for row in current:
              assert all(bool(str(row.get(field) or "").strip()) for field in amendment_fields)
              assert row["source_head_sha"]==d["source_head_sha"]
              assert row["source_trigger_head_sha"]==d["source_trigger_head_sha"]
              assert row["source_market_provider"]==d["source_market_provider"]
              assert row["source_market_credential_mode"]==d["source_market_credential_mode"]
              assert row["source_provenance_sha256"]==d["source_provenance_sha256"]
          print(json.dumps({
              "source_workflow_run":d["source_workflow_run"],
              "source_season":d["source_season"],
              "source_week":d["source_week"],
              "new_receipts":d["new_receipts"],
              "skipped_started_games":d["skipped_started_games"],
              "ledger_receipts":len(rows),
          },indent=2))
          PY

      - name: Persist prospective football shadow evidence off main
        if: steps.artifact.outputs.noop != 'true'
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/props_v2/football_shadow
          rm -rf /tmp/props-v2-football-shadow-new
          mkdir -p /tmp/props-v2-football-shadow-new
          cp -R "$DATA_DIR"/. /tmp/props-v2-football-shadow-new/
          rm -rf "$DATA_DIR"
          git config user.name 'levline-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/research-data/props-v2-football-shadow; then
            git checkout -B props-v2-football-shadow-data origin/research-data/props-v2-football-shadow
          else
            git checkout -B props-v2-football-shadow-data
          fi
          mkdir -p "$DATA_DIR"
          cp -R /tmp/props-v2-football-shadow-new/. "$DATA_DIR"/
          git add "$DATA_DIR"/
          if git diff --cached --quiet; then
            echo 'Prospective football shadow ledger unchanged.'
            exit 0
          fi
          git commit -m 'Record immutable Props 2.0 football Shadow A receipts'
          git push origin HEAD:research-data/props-v2-football-shadow
