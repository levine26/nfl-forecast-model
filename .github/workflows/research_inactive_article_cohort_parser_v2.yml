name: LevLine inactive article cohort parser V2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/inactive_article_cohort_parser_v2_contract.json'
      - 'research/qualify_inactive_article_cohort_parser_v2.py'
      - 'research/test_inactive_article_cohort_parser_v2.py'
      - '.github/workflows/research_inactive_article_cohort_parser_v2.yml'

permissions:
  contents: read

jobs:
  validate-heldout-cohort-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install parser dependencies
        run: python -m pip install pytest 'beautifulsoup4>=4.12'
      - name: Validate frozen V2 contract
        run: python -m json.tool research/inactive_article_cohort_parser_v2_contract.json >/dev/null
      - name: Unit-test cohort semantics
        run: pytest -q research/test_inactive_article_cohort_parser_v2.py research/test_inactive_article_player_parser_v1.py
      - name: Restore held-out late-afternoon source artifact
        run: |
          set -euo pipefail
          git fetch origin research-data/inactive-snapshots-v1:refs/remotes/origin/research-data/inactive-snapshots-v1
          ARCHIVE='research_outputs/inactive_article_source_archive_v1/raw/8d5cd6531f0ecea74c2fe25c9bd38b0849129849adc3797e8cee118605b25605.html.gz'
          git show "origin/research-data/inactive-snapshots-v1:${ARCHIVE}" > /tmp/week1-late-cohort-inactives.html.gz
          test -s /tmp/week1-late-cohort-inactives.html.gz
      - name: First and only frozen V2 held-out qualification
        run: |
          python -m research.qualify_inactive_article_cohort_parser_v2 \
            --contract research/inactive_article_cohort_parser_v2_contract.json \
            --archive-gzip /tmp/week1-late-cohort-inactives.html.gz \
            --receipt /tmp/inactive_article_cohort_parser_v2_receipt.json \
            --rows /tmp/inactive_article_cohort_parser_v2_rows.jsonl
      - name: Verify narrow authority firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('/tmp/inactive_article_cohort_parser_v2_receipt.json').read_text())
          assert receipt['qualification_passed'] is True
          assert receipt['authority']['player_level_parser_qualified_for_due_cohort_filtering'] is True
          assert receipt['authority']['full_day_article_completeness_assumed'] is False
          assert receipt['authority']['absence_of_team_section_means_active_or_healthy'] is False
          assert receipt['authority']['player_identity_to_gsis_qualified'] is False
          assert receipt['authority']['availability_probability_feature_authorized'] is False
          assert receipt['authority']['player_value_join_authorized'] is False
          assert receipt['authority']['forecast_probability_effect_authorized'] is False
          assert receipt['authority']['production_authorized'] is False
          assert receipt['completed_2026_outcomes_used'] == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inactive-article-cohort-parser-v2-validation
          path: |
            /tmp/inactive_article_cohort_parser_v2_receipt.json
            /tmp/inactive_article_cohort_parser_v2_rows.jsonl
          if-no-files-found: warn
          retention-days: 90
      - name: Prove research-only diff
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [p for p in changed if not (p.startswith('research/') or p.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
