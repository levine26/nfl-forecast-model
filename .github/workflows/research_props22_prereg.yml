name: LevLine Props 2.2 preregistration

on:
  pull_request:
    paths:
      - 'research/props/v22/**'
      - '.github/workflows/research_props22_prereg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preregistration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Validate frozen challenger grid
        run: python -m pytest -q research/props/v22/test_preregistration.py
      - name: Enforce research firewall
        run: |
          git fetch origin main
          python scripts/check_research_firewall.py --base origin/main --head-ref "${{ github.head_ref || github.ref_name }}"