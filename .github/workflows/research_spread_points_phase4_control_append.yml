name: Append Phase 4 control-log entries

on:
  push:
    branches: [research/spread-points-nextgen-phase4]
    paths:
      - '.github/workflows/research_spread_points_phase4_control_append.yml'

permissions:
  contents: write

jobs:
  append-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/spread-points-nextgen-phase4
      - name: Append Phase 4 decision and index entries once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          decision = Path('research/spread-points-nextgen/DECISION_LOG.md')
          text = decision.read_text(encoding='utf-8')
          marker = 'Phase 4 one-time 2025 holdout establishes NO_HISTORICAL_STANDALONE_FINALIST'
          if marker not in text:
              with decision.open('a', encoding='utf-8') as f:
                  f.write("\n| 2026-09-22 | Phase 4 one-time 2025 holdout establishes `NO_HISTORICAL_STANDALONE_FINALIST`. | A0 and B0 remain methodologically valid but lose to the market on the central continuous targets; C0 M3 remains statistically indistinguishable from M0 and does not establish incremental football information; D remains ineligible. The exact 272-game first-run evidence is preserved under `phase4/`. | Binding historical disposition for A0/B0/C0 under these identities. Any redesigned successor requires a new preregistered identity; 2025 is spent for these underlying models. |\n")
                  f.write("| 2026-09-22 | Preserve A0 and B0 as valid underlying representations/negative references despite no standalone finalist. | Negative standalone performance does not invalidate a correctly executed frozen representation. Phase 5 may consume only the already-approved chronology-clean component surfaces under its separate Candidate 5 charter; Phase 4 does not train or select the stack. | Binding Phase 4-to-5 handoff. Do not reinterpret this as standalone promotion authority. |\n")
                  f.write("| 2026-09-22 | Keep C0 as a market-aware diagnostic only after the 2025 holdout. | M3-M0 margin MAE = +0.0246 and total MAE = -0.0179; both week-block 95% intervals cross zero, consistent with development `NO_INCREMENTAL_FOOTBALL_EDGE`. | Binding for C0 V1. No M4/nonlinear rescue may reuse 2025 as untouched evidence. |\n")
                  f.write("| 2026-09-22 | Treat the one-time 2025 A0/B0/C0 holdout as spent after workflow run `35818332253`. | The full frozen package completed and passed evidence/firewall checks before interpretation; artifact `10732945725` was subsequently preserved byte-for-byte after provenance/hash verification. | Permanent evidence-boundary fact. Subsequent executions are reproducibility checks, not new pristine holdouts. |\n")
                  f.write("| 2026-09-22 | Candidate 5 remains NOT STARTED and may not call 2025 a pristine Candidate 5 holdout. | A0/B0/C0 2025 outputs are now observed; the preserved 2022-2024 OOF component surface remains the clean historical component surface for the separately approved Phase 5 design. | Binding Phase 5 entry boundary; do not solve or weaken it in Phase 4. |\n")

          index = Path('research/spread-points-nextgen/RESEARCH_INDEX.md')
          text = index.read_text(encoding='utf-8')
          marker = '### Phase 4 — scientific package complete; merge closeout pending'
          if marker not in text:
              with index.open('a', encoding='utf-8') as f:
                  f.write("\n### Phase 4 — scientific package complete; merge closeout pending\n\n")
                  f.write("- pre-result opening receipt — `research/spread-points-nextgen/phase4/HOLDOUT_OPENING_RECEIPT.json` (commit `362af7af7db43a715b9ab9537a52d2749c37e7a6`)\n")
                  f.write("- exact first completed holdout run — `35818332253`, generator head `f0b92217488a1a000bee74a903a9437931a53230`\n")
                  f.write("- exact first-run artifact — `10732945725`, metadata digest `sha256:7e231406237dc0f27681cc974d07ba34a6fe3bb976bea42531bedc8166557671`\n")
                  f.write("- exact artifact preservation workflow — `35819413238` SUCCESS; verified provenance and all evidence SHA-256 values before commit\n")
                  f.write("- raw holdout predictions — `phase4/A0_HOLDOUT_2025.csv`, `B0_HOLDOUT_2025.csv`, `C0_HOLDOUT_2025.csv`\n")
                  f.write("- reference baselines — `phase4/BASELINES_HOLDOUT_2025.csv`\n")
                  f.write("- fixed diagnostic slices — `phase4/DIAGNOSTIC_SLICES_2025.csv`\n")
                  f.write("- machine summary / run manifest — `phase4/HOLDOUT_SUMMARY.json`, `phase4/HOLDOUT_RUN_MANIFEST.json`\n")
                  f.write("- execution failure/boundary log — `phase4/HOLDOUT_FAILURE_LOG.md`\n")
                  f.write("- historical validation — `phase4/HISTORICAL_VALIDATION_REPORT.md`\n")
                  f.write("- preregistered ablation analysis — `phase4/ABLATION_REPORT.md`\n")
                  f.write("- uncertainty — `phase4/STATISTICAL_UNCERTAINTY_REPORT.md`\n")
                  f.write("- robustness / fixed slices — `phase4/ROBUSTNESS_REPORT.md`\n")
                  f.write("- red-team audit — `phase4/RED_TEAM_AUDIT.md`\n")
                  f.write("- synthesis — `phase4/PHASE4_SYNTHESIS.md`\n")
                  f.write("- Phase 5 handoff — `phase4/PHASE5_HANDOFF.md`\n")
                  f.write("- scientific disposition — `NO_HISTORICAL_STANDALONE_FINALIST`; A0/B0 valid underlying representations but not standalone finalists; C0 market-aware diagnostic only; D remains ineligible\n")
                  f.write("- Candidate 5 — NOT STARTED / untrained; completed 2026 outcomes unused; production `F-ST-01-FROZEN-2026` unchanged\n")
          PY
      - name: Commit control-file append
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/spread-points-nextgen/DECISION_LOG.md research/spread-points-nextgen/RESEARCH_INDEX.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record Phase 4 decisions and research index [skip ci]'
            git pull --rebase origin research/spread-points-nextgen-phase4
            git push origin HEAD:research/spread-points-nextgen-phase4
          fi
