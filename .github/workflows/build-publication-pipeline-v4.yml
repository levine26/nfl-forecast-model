name: Build publication pipeline v4
on:
  push:
    branches: [editorial/publication-pipeline-v4]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/publication-pipeline-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply both validated parallel diffs
        run: |
          git fetch origin editorial/raw-evidence-compositor editorial/story-desk-preservation
          git diff c5669e1dc47c9f3daaa0abf39333e50abf0bd000..origin/editorial/raw-evidence-compositor -- src/nfl_forecast/editorial_voice.py scripts/run_context.py tests/test_editorial_evidence_compositor.py | git apply
          git diff c5669e1dc47c9f3daaa0abf39333e50abf0bd000..origin/editorial/story-desk-preservation -- scripts/polish_publication.py tests/test_publication_polish.py | git apply
      - run: pip install '.[dev]'
      - name: Full test suite
        run: pytest -q
      - name: Full production publication path
        run: |
          python scripts/run_context.py --season 2026
          python scripts/polish_publication.py --season 2026 --probe-advanced
          python scripts/add_advanced_player_context.py --season 2026
          python scripts/add_career_qb_context.py --season 2026
          python scripts/finalize_editorial.py
      - name: Post-downstream editorial gates
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from scripts.run_context import _editorial_audit, _require_editorial_quality
          predictions = pd.read_csv('outputs/this_week.csv')
          evidence = json.load(open('outputs/contextual_evidence.json'))
          previews = json.load(open('outputs/game_previews.json'))
          audit = _editorial_audit(previews, predictions, evidence)
          _require_editorial_quality(audit, len(previews))
          assert audit['headline_count'] == 16
          assert audit['unique_headlines'] == 16
          assert audit['read_count'] == 16
          assert audit['unique_read_leads'] == 16
          assert audit['high_similarity_read_pair_count'] == 0
          assert audit['read_evidence_overlap_count'] == 0
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY
          pytest -q tests/test_editorial_uniqueness.py
      - name: Production dashboard build
        run: |
          mkdir -p site/public/data
          for f in this_week.csv run_history.csv prediction_history.csv power_ratings.csv model_leaderboard.csv calibration.csv confidence_diagnostics.csv movement_attribution.csv team_profiles.csv status.json contextual_evidence.json game_previews.json context_source_status.json weekly_brief.json postgame_autopsies.json power_editorial.json history_scoreboard.json; do
            if [ -f "outputs/$f" ]; then cp "outputs/$f" "site/public/data/$f"; fi
          done
          cd site
          npm install
          npm run build
      - name: Commit clean validated candidate
        run: |
          git config user.name "sunday-signal-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/build-publication-pipeline-v4.yml
          git add src/nfl_forecast/editorial_voice.py scripts/run_context.py scripts/polish_publication.py tests/test_editorial_evidence_compositor.py tests/test_publication_polish.py
          git commit -m "Harden the full editorial publication pipeline"
          git push origin HEAD:editorial/publication-pipeline-v4
