name: Apply Sunday Signal frontend polish

on:
  push:
    branches: [ui/weekday-forecast-axis]
    paths:
      - 'tools/apply_frontend_polish_patch.py'
      - '.github/workflows/frontend-polish-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/weekday-forecast-axis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply frontend source patch
        run: python tools/apply_frontend_polish_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package.json
      - name: Build production site
        working-directory: site
        run: |
          npm install
          npm run build
      - name: Commit patched frontend
        run: |
          set -euo pipefail
          git config user.name 'sunday-signal-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/src/AppPublicationVNext.jsx site/src/publication-vnext.css
          if git diff --cached --quiet; then
            echo 'No frontend change required.'
            exit 0
          fi
          git commit -m 'Polish Sunday Signal game files and league pages'
          git push origin HEAD:ui/weekday-forecast-axis
