name: LevLine 4 prospective inactive identity qualification V1

on:
  pull_request:
    paths:
      - 'research/levline4_prospective_inactive_identity_qualification_v1_contract.json'
      - 'research/levline4_prospective_inactive_identity_qualification_v1.py'
      - 'research/test_levline4_prospective_inactive_identity_qualification_v1.py'
      - '.github/workflows/research_levline4_prospective_inactive_identity_qualification_v1.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'LevLine research inactive article source archive v1'
    types: [completed]

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Validate frozen qualification contract and evaluator
        run: pytest -q research/test_levline4_prospective_inactive_identity_qualification_v1.py
      - name: Verify research firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/levline4_prospective_inactive_identity_qualification_v1_contract.json').read_text())
          assert c['contract_id'] == 'LEVLINE-4-2026-PROSPECTIVE-INACTIVE-IDENTITY-QUALIFICATION-V1'
          assert c['status'] == 'PREREGISTERED_BEFORE_FIRST_WEEK2_SUNDAY_IDENTITY_EXECUTION'
          assert c['scope']['week'] == 2
          assert c['scope']['first_identity_execution_only'] is True
          assert c['scope']['later_execution_substitution_authorized'] is False
          assert c['frozen_gates']['minimum_exact_unique_resolution_rate'] == 0.995
          assert c['frozen_gates']['ambiguities_allowed'] == 0
          assert c['frozen_gates']['cross_source_contradictions_allowed'] == 0
          assert c['frozen_gates']['minimum_independently_auditable_fraction_of_exact_unique_resolutions'] == 0.8
          assert c['frozen_gates']['minimum_independently_auditable_rows'] == 73
          assert c['frozen_gates']['required_independent_audit_agreement'] == 1.0
          assert c['frozen_gates']['minimum_wilson95_lower_bound_for_independent_agreement'] == 0.95
          assert c['threshold_provenance']['thresholds_may_not_be_relaxed_after_observing_week2_results'] is True
          assert c['authority_if_passed']['general_2026_player_identity_to_gsis_qualified'] is False
          assert c['authority_if_passed']['availability_probability_feature_authorized'] is False
          assert c['authority_if_passed']['production_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used_for_design_or_selection'] == 0
          assert c['governance']['f_st_01_frozen_2026_unchanged'] is True
          PY

  qualify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore immutable prospective execution evidence
        id: restore
        run: |
          set -euo pipefail
          git fetch origin research-data/inactive-snapshots-v1:refs/remotes/origin/research-data/inactive-snapshots-v1 || true
          DATA_DIR=research_outputs/levline4_prospective_inactive_execution_v1
          if ! git show-ref --verify --quiet refs/remotes/origin/research-data/inactive-snapshots-v1; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git ls-tree -d --name-only origin/research-data/inactive-snapshots-v1 "$DATA_DIR" | grep -q "^${DATA_DIR}$"; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git archive origin/research-data/inactive-snapshots-v1 "$DATA_DIR" | tar -xf -
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path('research_outputs/levline4_prospective_inactive_execution_v1/attempts.jsonl')
          exists = False
          if p.exists():
              for line in p.read_text().splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  if row.get('contract_id') == 'LEVLINE-4-2026-PROSPECTIVE-INACTIVE-EXECUTION-V1' and row.get('execution_id'):
                      exists = True
                      break
          print(f"available={'true' if exists else 'false'}")
          PY

      - name: Evaluate frozen first identity execution
        id: qualify
        if: steps.restore.outputs.available == 'true'
        continue-on-error: true
        run: |
          PYTHONPATH="$PWD/src:$PWD" python -m research.levline4_prospective_inactive_identity_qualification_v1 \
            --receipt-out research_outputs/levline4_prospective_inactive_identity_qualification_v1/receipt.json

      - name: Persist qualification receipt on research-data branch
        if: steps.restore.outputs.available == 'true'
        run: |
          set -euo pipefail
          QUAL_DIR=research_outputs/levline4_prospective_inactive_identity_qualification_v1
          test -s "$QUAL_DIR/receipt.json"
          rm -rf /tmp/levline4_prospective_inactive_identity_qualification_v1
          cp -R "$QUAL_DIR" /tmp/levline4_prospective_inactive_identity_qualification_v1
          rm -rf research_outputs/levline4_prospective_inactive_execution_v1 "$QUAL_DIR"
          git config user.name 'levline-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B research-data/inactive-snapshots-v1 origin/research-data/inactive-snapshots-v1
          mkdir -p research_outputs
          rm -rf "$QUAL_DIR"
          cp -R /tmp/levline4_prospective_inactive_identity_qualification_v1 "$QUAL_DIR"
          git add "$QUAL_DIR/"
          if git diff --cached --quiet; then
            echo 'Frozen qualification receipt unchanged.'
            exit 0
          fi
          git commit -m 'Evaluate frozen Week 2 inactive identity qualification'
          git push origin HEAD:research-data/inactive-snapshots-v1

      - name: Surface qualification failure after preserving receipt
        if: steps.restore.outputs.available == 'true'
        run: |
          if [ "${{ steps.qualify.outcome }}" != 'success' ]; then
            echo 'Week 2 prospective inactive identity qualification failed; immutable receipt was preserved.' >&2
            exit 1
          fi
