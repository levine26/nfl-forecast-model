name: LevLine V09B NFL transaction-ledger source probe V1

on:
  pull_request:
    paths:
      - 'research/availability/v09b_nfl_transaction_ledger_source_probe_v1_contract.json'
      - 'research/v09b_nfl_transaction_ledger_source_probe_v1.py'
      - 'research/test_v09b_nfl_transaction_ledger_source_probe_v1.py'
      - '.github/workflows/research_v09b_nfl_transaction_ledger_source_probe_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-v09b-nfl-transaction-ledger-source-probe-v1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test frozen transaction source semantics
        run: pytest -q research/test_v09b_nfl_transaction_ledger_source_probe_v1.py
      - name: Validate preregistered source-class contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/availability/v09b_nfl_transaction_ledger_source_probe_v1_contract.json').read_text())
          assert c['status'] == 'SOURCE_CLASS_SEMANTIC_VIABILITY_PROBE_ONLY_NO_CHRONOLOGY_OR_MEMBERSHIP_AUTHORITY'
          p = c['fixed_cross_era_probe']
          assert p['seasons'] == [2017, 2018, 2019, 2020, 2021]
          assert p['month'] == 9
          assert p['categories'] == ['trades', 'signings', 'reserve-list', 'waivers', 'terminations', 'other']
          assert p['initial_endpoint_count'] == 30
          assert c['source_requirements']['allowed_hosts'] == ['www.nfl.com']
          assert c['source_requirements']['third_party_authority_allowed'] is False
          assert c['parser_contract']['transaction_text_normalization_or_semantic_rewrite_performed'] is False
          assert len(c['known_semantic_evidence']) == 7
          assert c['explicit_non_gates']['transaction_state_machine_defined'] is False
          assert c['explicit_non_gates']['same_day_transaction_order_resolved'] is False
          assert c['authority']['probe_has_chronology_authority'] is False
          assert c['authority']['probe_has_membership_authority'] is False
          assert c['authority']['modern_game_day_roster_universe_qualified'] is False
          assert c['authority']['v09b_model_fit_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used'] == 0
          PY

  semantic-viability-probe:
    needs: unit-and-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Probe official NFL transaction ledger across 2017-2021
        run: |
          OUT=research_outputs/v09b_nfl_transaction_ledger_source_probe_v1/result.json
          STATUS=research_outputs/v09b_nfl_transaction_ledger_source_probe_v1/exit_status.txt
          mkdir -p "$(dirname "$OUT")"
          set +e
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_nfl_transaction_ledger_source_probe_v1.py \
              --contract research/availability/v09b_nfl_transaction_ledger_source_probe_v1_contract.json \
              --output "$OUT"
          rc=$?
          set -e
          echo "$rc" > "$STATUS"
          test -f "$OUT"
      - name: Assert no authority escapes the probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('research_outputs/v09b_nfl_transaction_ledger_source_probe_v1/result.json').read_text())
          assert r['initial_endpoint_count_expected'] == 30
          assert r['full_2017_2021_all_month_ledger_captured'] is False
          assert r['transaction_state_machine_defined'] is False
          assert r['same_day_transaction_order_resolved'] is False
          assert r['week_specific_roster_snapshot_coverage_proven'] is False
          assert r['game_day_roster_membership_constructed'] is False
          assert r['inactive_lists_reconciled'] is False
          assert r['probe_has_chronology_authority'] is False
          assert r['probe_has_membership_authority'] is False
          assert r['modern_game_day_roster_universe_qualified'] is False
          assert r['modern_player_team_game_identity_qualified'] is False
          assert r['training_label_semantics_qualified'] is False
          assert r['training_source_chronology_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['weekly_roster_membership_used'] is False
          assert r['weekly_roster_status_used'] is False
          assert r['postgame_participation_used_as_training_authority'] is False
          assert r['absence_from_inactive_used_as_positive'] is False
          assert r['completed_2026_outcomes_used'] == 0
          assert r['model_fit_performed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v09b-nfl-transaction-ledger-source-probe-v1-${{ github.run_id }}
          path: research_outputs/v09b_nfl_transaction_ledger_source_probe_v1/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce frozen semantic viability gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research_outputs/v09b_nfl_transaction_ledger_source_probe_v1')
          r = json.loads((root / 'result.json').read_text())
          rc = int((root / 'exit_status.txt').read_text().strip())
          assert rc == 0
          assert r['source_errors'] == []
          assert r['initial_endpoint_count_completed'] == 30
          assert all(v > 0 for v in r['season_row_totals'].values())
          assert all(v > 0 for v in r['category_row_totals'].values())
          assert all(x['found'] is True for x in r['known_semantic_evidence'])
          assert r['source_class_semantic_viability_probe_pass'] is True
          PY

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
