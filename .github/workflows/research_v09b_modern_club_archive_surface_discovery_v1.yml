name: LevLine V09B modern club archive surface discovery V1

on:
  pull_request:
    paths:
      - 'research/availability/v09b_modern_club_archive_surface_discovery_v1_contract.json'
      - 'research/v09b_modern_club_archive_surface_discovery_v1.py'
      - 'research/test_v09b_modern_club_archive_surface_discovery_v1.py'
      - '.github/workflows/research_v09b_modern_club_archive_surface_discovery_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-v09b-modern-club-archive-surface-discovery-v1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test frozen discovery mechanics
        run: pytest -q research/test_v09b_modern_club_archive_surface_discovery_v1.py
      - name: Validate discovery-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/availability/v09b_modern_club_archive_surface_discovery_v1_contract.json').read_text())
          assert c['status'] == 'PREREGISTERED_DISCOVERY_ONLY_NO_LOCATOR_COVERAGE_OR_MEMBERSHIP_AUTHORITY'
          assert c['dependency'] == 'V09B-MODERN-ROSTER-DEPTH-SOURCE-PROBE-V2-QUALIFICATION'
          assert c['seasons'] == [2017, 2018, 2019, 2020, 2021]
          assert len(c['teams']) == 32
          assert len(c['standardized_path_candidates']) == 6
          assert c['required_accounting']['team_season_pairs'] == 160
          assert c['required_accounting']['every_team_season_pair_reported'] is True
          assert c['required_accounting']['every_standardized_candidate_attempt_reported'] is True
          assert c['explicit_non_gates']['archive_surface_discovery_rate_threshold'] is None
          assert c['explicit_non_gates']['team_game_locator_coverage_qualified'] is False
          assert c['explicit_non_gates']['all_2592_team_game_partitions_tested'] is False
          assert c['authority']['diagnostic_has_locator_qualification_authority'] is False
          assert c['authority']['diagnostic_has_membership_authority'] is False
          assert c['authority']['modern_game_day_roster_universe_qualified'] is False
          assert c['authority']['v09b_model_fit_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used'] == 0
          PY

  discover-standardized-surfaces:
    needs: unit-and-contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Probe frozen standardized first-party archive candidates
        run: |
          OUT=research_outputs/v09b_modern_club_archive_surface_discovery_v1/result.json
          mkdir -p "$(dirname "$OUT")"
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_modern_club_archive_surface_discovery_v1.py \
              --contract research/availability/v09b_modern_club_archive_surface_discovery_v1_contract.json \
              --output "$OUT" \
              --timeout 12 \
              --workers 32
      - name: Assert complete accounting and authority firewall only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('research_outputs/v09b_modern_club_archive_surface_discovery_v1/result.json').read_text())
          assert r['discovery_accounting_integrity_pass'] is True
          assert r['expected_team_season_pairs'] == 160
          assert r['team_season_pairs_reported'] == 160
          assert r['candidate_attempts_reported'] == r['expected_candidate_attempts']
          assert len(r['team_season_results']) == 160
          assert len(r['attempts']) == r['expected_candidate_attempts']
          assert r['archive_surface_team_season_hits'] + r['archive_surface_team_season_missing'] == 160
          # Descriptive hit rate is intentionally not a gate.
          assert r['diagnostic_has_locator_qualification_authority'] is False
          assert r['diagnostic_has_membership_authority'] is False
          assert r['modern_roster_depth_locator_coverage_qualified'] is False
          assert r['all_2592_team_game_partitions_tested'] is False
          assert r['modern_game_day_roster_universe_qualified'] is False
          assert r['modern_player_team_game_identity_qualified'] is False
          assert r['training_label_semantics_qualified'] is False
          assert r['training_source_chronology_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['weekly_roster_membership_used'] is False
          assert r['weekly_roster_status_used'] is False
          assert r['postgame_participation_used_as_training_authority'] is False
          assert r['absence_from_inactive_used_as_positive'] is False
          assert r['completed_2026_outcomes_used'] == 0
          assert r['model_fit_performed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v09b-modern-club-archive-surface-discovery-v1-${{ github.run_id }}
          path: research_outputs/v09b_modern_club_archive_surface_discovery_v1/result.json
          if-no-files-found: error
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
