name: Sunday Signal all-game article audit shadow

on:
  pull_request:
    paths:
      - "scripts/audit_editorial_sources_shadow.py"
      - "tests/test_editorial_source_batch_shadow.py"
      - "scripts/audit_editorial_slate_shadow.py"
      - "tests/test_editorial_slate_shadow_audit.py"
      - ".github/workflows/editorial_source_batch_shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-shadow-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded article parser and test requirements
        run: python -m pip install "nflreadpy==0.1.5" "requests>=2.32" "beautifulsoup4>=4.12" "pytest>=8.0"
      - name: Assert every game is audited with no source-to-publication escalation
        env:
          PYTHONPATH: "src:."
        run: |
          python -m py_compile scripts/audit_editorial_sources_shadow.py
          pytest -q tests/test_editorial_source_batch_shadow.py tests/test_editorial_slate_shadow_audit.py
          python - <<'PY'
          from pathlib import Path
          script = Path("scripts/audit_editorial_sources_shadow.py").read_text()
          assert '"editorial_publication_authorized": False' in script
          assert '"semantic_claim_entailment_verified": False' in script
          print("Shadow source audit has no production publishing authority.")
          PY
      - name: Retrieve and inspect actual canonical-slate sources (shadow only)
        env:
          PYTHONPATH: "src:."
        run: |
          python scripts/audit_editorial_sources_shadow.py --out /tmp/week5-article-audit-shadow.json
      - name: Build independent claim review queue and full-slate editorial diagnostic
        env:
          PYTHONPATH: "src:."
        run: |
          python scripts/prepare_editorial_claim_review_shadow.py --out /tmp/week5-claim-review-queue-shadow.json
          python scripts/audit_editorial_slate_shadow.py \
            --source-receipts /tmp/week5-article-audit-shadow.json \
            --claim-queue /tmp/week5-claim-review-queue-shadow.json \
            --out /tmp/week5-full-slate-editorial-shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/week5-full-slate-editorial-shadow.json').read_text())
          assert a['games_expected'] == a['games_audited'] == 15
          assert a['source_snapshot_compatible']
          assert a['claim_queue_snapshot_compatible']
          assert a['games_with_independently_verified_human_reads'] == 0
          assert a['editorial_publication_authorized'] is False
          print('Per-game diagnostic for all 15 canonical games; no semantic fact-checking approval.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: week5-complete-editorial-diagnostic-shadow
          path: |
            /tmp/week5-full-slate-editorial-shadow.json
            /tmp/week5-claim-review-queue-shadow.json
          retention-days: 7
      - name: Upload provenance results without publisher article text
        uses: actions/upload-artifact@v4
        with:
          name: week5-source-provenance-shadow
          path: /tmp/week5-article-audit-shadow.json
          retention-days: 7
