name: LevLine Props 2.0 NGS market residual

on:
  pull_request:
    branches:
      - research/props-v2-advanced-efficiency-r2
    paths:
      - "research/props/v2/props_ngs_efficiency_state.py"
      - "research/props/v2/props_ngs_market_residual.py"
      - "research/props/v2/test_props_ngs_market_residual.py"
      - "research/props/v2/evaluate_ngs_market_residual.py"
      - ".github/workflows/research_props_v2_ngs_market_residual.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ngs-market-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile and test residual model
        run: |
          python -m py_compile research/props/v2/props_ngs_market_residual.py
          python -m py_compile research/props/v2/evaluate_ngs_market_residual.py
          pytest -q             research/props/v2/test_props_ngs_efficiency_state.py             research/props/v2/test_props_ngs_market_residual.py
      - name: Download exact frozen V1 historical artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35363701921
          pattern: levline-props-historical-primary-*
          path: research_outputs/props_v2/ngs_residual_inputs
          merge-multiple: true
      - name: Evaluate rolling-origin NGS market residual
        run: |
          python research/props/v2/evaluate_ngs_market_residual.py             --input research_outputs/props_v2/ngs_residual_inputs/2023_forecast_level.csv             --input research_outputs/props_v2/ngs_residual_inputs/2024_forecast_level.csv             --input research_outputs/props_v2/ngs_residual_inputs/2025_forecast_level.csv             --output-dir research_outputs/props_v2/ngs_market_residual
      - name: Enforce chronology and interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_outputs/props_v2/ngs_market_residual/summary.json")
          d=json.loads(p.read_text())
          assert d["promotion_authorized"] is False
          assert d["selective_threshold_used"] is False
          assert d["hyperparameter_search_performed"] is False
          assert d["market_coefficient_fixed_as_offset"] is True
          assert d["ngs_state_audit"]["target_week_rows_used"] == 0
          assert d["ngs_state_audit"]["completed_2026_outcomes_used"] == 0
          assert d["evaluation"]["n"] >= 1000
          fitted=0
          for season, models in d["rolling_origin_models"].items():
              for prop, payload in models.items():
                  if payload["status"] != "fitted":
                      continue
                  fitted += 1
                  assert payload["training_season_max"] < int(season)
                  assert payload["evaluation_season"] == int(season)
          assert fitted >= 5
          print(json.dumps(d["evaluation"], indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-ngs-market-residual
          path: research_outputs/props_v2/ngs_market_residual/
          if-no-files-found: error
