name: LevLine Props 2.1 post-Sunday evaluation

on:
  pull_request:
    paths:
      - 'research/props/evaluation/**'
      - 'research/props/v21/**'
      - '.github/workflows/research_props21_post_sunday_evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Validate frozen evaluation mechanics
        run: |
          python -m pytest -q \
            research/props/evaluation/test_props_evaluation.py \
            research/props/v21/test_evaluate_prospective_props21.py

      - name: Enforce research firewall
        run: |
          git fetch origin main
          python scripts/check_research_firewall.py \
            --base origin/main \
            --head-ref "${{ github.head_ref || github.ref_name }}"

      - name: Recover exact frozen Props 2.1 receipt cohort
        run: |
          set -euo pipefail
          COMMIT=ba723255982c79ffe6072c714dd0ee2c37e1fa34
          PATH_IN_REPO=challenger_outputs/props21/forecast_originals.jsonl
          EXPECTED_BLOB=e89cdce268fb10c5107ba6db4087107fb213555f
          git cat-file -e "${COMMIT}:${PATH_IN_REPO}"
          ACTUAL_BLOB=$(git rev-parse "${COMMIT}:${PATH_IN_REPO}")
          test "${ACTUAL_BLOB}" = "${EXPECTED_BLOB}"
          git show "${COMMIT}:${PATH_IN_REPO}" > /tmp/props21_frozen_receipts.jsonl
          test "$(wc -l < /tmp/props21_frozen_receipts.jsonl)" -eq 3439

      - name: Score finalized games only
        run: |
          set -euo pipefail
          rm -rf research_outputs/props21/post_sunday
          python research/props/v21/evaluate_prospective_props21.py \
            --receipts /tmp/props21_frozen_receipts.jsonl \
            --output-dir research_outputs/props21/post_sunday \
            --bootstrap-replicates 5000

      - name: Validate evaluation boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_outputs/props21/post_sunday/summary.json')
          result=json.loads(p.read_text())
          assert result['evaluation_contract_version']=='levline-props-eval-v1.0'
          assert result['sample']['forecasts']==3439
          assert result['source_provenance']['publication_commit']=='ba723255982c79ffe6072c714dd0ee2c37e1fa34'
          assert result['props21_postgame_adapter']['automatic_promotion_authorized'] is False
          assert result['props21_postgame_adapter']['eligibility_audit']['graded']>0
          print(json.dumps({
              'sample':result['sample'],
              'graded_sample':result['graded_sample'],
              'continuous':result['continuous'],
              'probability':result['probability'],
              'market_relative':result['market_relative'],
              'eligibility':result['props21_postgame_adapter']['eligibility_audit'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload postgame evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: props21-post-sunday-evaluation-${{ github.run_id }}
          path: research_outputs/props21/post_sunday
          if-no-files-found: error
          retention-days: 30
