name: LevLine Props 2.0 TD count distribution

on:
  pull_request:
    branches:
      - research/props-v2-challenger
    paths:
      - 'research/props/v2/td_count_distribution_v2.py'
      - 'research/props/v2/run_td_count_distribution_v2.py'
      - 'research/props/v2/test_td_count_distribution_v2.py'
      - 'research/props/v2/TD_COUNT_DISTRIBUTION_CONTRACT.md'
      - '.github/workflows/research_props_v2_td_count_distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy pytest
      - run: pytest -q research/props/v2/test_td_count_distribution_v2.py

  real-data:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' pyarrow
      - run: |
          python research/props/v2/run_td_count_distribution_v2.py             --output-dir research_outputs/props_v2/td_count_distribution
      - name: Enforce research boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research_outputs/props_v2/td_count_distribution/td_count_result.json").read_text())
          assert d["production_authorized"] is False
          assert d["completed_2026_outcomes_used"] == 0
          assert d["player_td_outcomes_used_for_selection"] == 0
          assert d["aggregate"]["n"] > 0
          print(json.dumps(d["aggregate"],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-td-count-distribution
          path: research_outputs/props_v2/td_count_distribution/
          if-no-files-found: error
