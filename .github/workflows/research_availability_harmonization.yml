name: LevLine availability harmonization research

on:
  pull_request:
    paths:
      - '.github/workflows/research_availability_harmonization.yml'
      - '.github/workflows/research_availability_v4_source_pin.yml'
      - 'research/availability/2022_2025_harmonization_contract_v1.json'
      - 'research/availability/2022_2025_harmonization_contract_v2.json'
      - 'research/availability/2022_2025_harmonization_contract_v3.json'
      - 'research/availability/2022_2025_harmonization_v1_failure_receipt.json'
      - 'research/availability/2022_2025_harmonization_v2_failure_receipt.json'
      - 'research/availability/2022_2025_harmonization_implementation_repairs_v1.json'
      - 'research/availability/2025_reconstruction_qualification_v1.json'
      - 'research/availability_harmonization_v1.py'
      - 'research/availability_identity_v2.py'
      - 'research/run_availability_harmonization_v1.py'
      - 'research/run_availability_harmonization_repaired_v1.py'
      - 'research/run_availability_harmonization_v2.py'
      - 'research/run_availability_harmonization_v3.py'
      - 'research/test_availability_harmonization_v1.py'
      - 'research/test_availability_harmonization_repaired_v1.py'
      - 'research/test_availability_identity_v2.py'
      - 'research/test_availability_harmonization_v3.py'
      - 'scripts/reconstruct_2025_availability.py'
      - 'src/nfl_forecast/availability_2025_reconstruction.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harmonize-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research runtime
        run: pip install '.[dev]'

      - name: Preflight-pin V4 weekly-roster identity sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_outputs/availability_v4_source_pin/raw
          curl --fail --location --retry 3 \
            'https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_2023.csv' \
            -o research_outputs/availability_v4_source_pin/raw/roster_weekly_2023.csv
          curl --fail --location --retry 3 \
            'https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_2024.csv' \
            -o research_outputs/availability_v4_source_pin/raw/roster_weekly_2024.csv
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import pandas as pd

          out = Path('research_outputs/availability_v4_source_pin')
          raw = out / 'raw'
          required = {
              2023: {
                  20: {'BAL','HOU','BUF','KC','DET','TB','GB','SF'},
                  21: {'BAL','KC','DET','SF'},
                  22: {'KC','SF'},
              },
              2024: {
                  20: {'KC','HOU','DET','WAS','PHI','LAR','BUF','BAL'},
              },
          }
          asset_ids = {2023: 156614676, 2024: 237398162}
          urls = {
              s: f'https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_{s}.csv'
              for s in required
          }
          receipts = {}
          identity_slices = []
          for season in sorted(required):
              path = raw / f'roster_weekly_{season}.csv'
              payload = path.read_bytes()
              frame = pd.read_csv(path, low_memory=False)
              must = {'season','week','team','gsis_id','full_name','first_name','last_name','football_name'}
              missing = sorted(must - set(frame.columns))
              if missing:
                  raise SystemExit(f'{season} weekly roster missing required identity columns: {missing}')
              frame = frame.loc[pd.to_numeric(frame['season'], errors='coerce').eq(season)].copy()
              frame['week'] = pd.to_numeric(frame['week'], errors='coerce').astype('Int64')
              coverage = {}
              for week, teams in sorted(required[season].items()):
                  week_rows = frame.loc[frame['week'].eq(week)].copy()
                  present = set(week_rows['team'].dropna().astype(str))
                  missing_teams = sorted(teams - present)
                  if missing_teams:
                      raise SystemExit(f'{season} week {week} weekly roster missing teams: {missing_teams}')
                  coverage[str(week)] = {
                      team: int((week_rows['team'].astype(str) == team).sum())
                      for team in sorted(teams)
                  }
                  keep = week_rows.loc[
                      week_rows['team'].astype(str).isin(teams),
                      ['season','week','team','gsis_id','full_name','first_name','last_name','football_name'],
                  ].copy()
                  keep['source_asset_id'] = asset_ids[season]
                  identity_slices.append(keep)
              receipts[str(season)] = {
                  'release_tag': 'weekly_rosters',
                  'asset_id': asset_ids[season],
                  'asset_name': path.name,
                  'url': urls[season],
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
                  'required_team_week_counts': coverage,
              }
          combined = pd.concat(identity_slices, ignore_index=True)
          combined.to_csv(out / 'postseason_identity_slice.csv', index=False)
          receipt = {
              'purpose': 'Pre-execution source pin only. No availability qualification, model fitting, outcomes, snaps, or production behavior are evaluated.',
              'allowed_identity_fields': ['season','week','team','gsis_id','full_name','first_name','last_name','football_name'],
              'forbidden_for_v4_identity_decisions': ['status','position','depth_chart_position','snaps','participation','game_outcomes'],
              'sources': receipts,
          }
          (out / 'source_pin_receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload V4 identity-source preflight
        uses: actions/upload-artifact@v4
        with:
          name: availability-v4-weekly-roster-source-pin
          path: research_outputs/availability_v4_source_pin/
          if-no-files-found: error
          retention-days: 90

      - name: Test preregistered harmonization, identity, and fallback semantics
        run: >-
          pytest -q
          research/test_availability_harmonization_v1.py
          research/test_availability_harmonization_repaired_v1.py
          research/test_availability_identity_v2.py
          research/test_availability_harmonization_v3.py
          tests/test_availability_2025_reconstruction.py
          tests/test_availability_qualification.py

      - name: Reconstruct already-qualified 2025 state
        run: >-
          python scripts/reconstruct_2025_availability.py
          --output-dir research_outputs/availability_2025_reconstruction
          --require-qualified

      - name: Audit harmonized 2022-2025 source contract v3
        run: >-
          python -m research.run_availability_harmonization_v3
          --output-dir research_outputs/availability_2022_2025_harmonization
          --reconstruction-2025-dir research_outputs/availability_2025_reconstruction
          --require-qualified

      - name: Prove harmonization did not modify production surfaces
        run: |
          git diff --exit-code -- \
            src/nfl_forecast/pipeline.py \
            src/nfl_forecast/models.py \
            src/nfl_forecast/features.py \
            src/nfl_forecast/fst_production.py \
            src/nfl_forecast/fst_nested_pure.py \
            outputs/ \
            challenger_outputs/ \
            site/

      - name: Upload source captures and harmonization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: availability-2022-2025-harmonization-v3
          path: |
            research_outputs/availability_2025_reconstruction/
            research_outputs/availability_2022_2025_harmonization/
          if-no-files-found: warn
          retention-days: 90
