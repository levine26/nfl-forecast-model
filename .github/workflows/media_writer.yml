name: Sunday Signal Copilot media writer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/nfl_forecast/media_context.py"
      - "src/nfl_forecast/media_editorial.py"
      - "src/nfl_forecast/copilot_media.py"
      - "src/nfl_forecast/source_policy.py"
      - "scripts/finalize_editorial.py"
      - "scripts/build_copilot_media_prompt.py"
      - "scripts/build_single_game_copilot_prompt.py"
      - "scripts/merge_copilot_game_payloads.py"
      - "scripts/compose_copilot_media_reads.py"
      - "scripts/render_levline_paragraphs.py"
      - "scripts/validate_copilot_media_reads.py"
      - "tests/test_media_context.py"
      - "tests/test_copilot_media.py"
      - "tests/test_copilot_composition.py"
      - "tests/test_copilot_json_handoff.py"
      - "tests/test_levline_paragraph_renderer.py"
      - "tests/test_read_contract.py"
      - "pyproject.toml"
      - ".github/workflows/media_writer.yml"
  schedule:
    - cron: "37 */3 * 1-2,9-12 *"

permissions:
  contents: write
  actions: read
  copilot-requests: write

concurrency:
  group: sunday-signal-media-writer
  cancel-in-progress: true

jobs:
  write-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Synchronize with contextual intelligence
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          context_seen=0
          # A media-only merge does not trigger context.yml. Give GitHub a short
          # window to register a matching context run; if none exists, use the
          # latest already-published context on main instead of timing out.
          for discovery in 1 2 3 4; do
            state=$(gh run list \
              --workflow "Sunday Signal contextual intelligence" \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json status,conclusion \
              --jq 'if length == 0 then "missing" else .[0].status + ":" + (.[0].conclusion // "") end' 2>/dev/null || echo missing)
            echo "context discovery $discovery: $state"
            if [ "$state" != "missing" ]; then
              context_seen=1
              break
            fi
            sleep 5
          done

          if [ "$context_seen" -eq 1 ]; then
            for attempt in $(seq 1 40); do
              state=$(gh run list \
                --workflow "Sunday Signal contextual intelligence" \
                --commit "$GITHUB_SHA" \
                --limit 1 \
                --json status,conclusion \
                --jq 'if length == 0 then "missing" else .[0].status + ":" + (.[0].conclusion // "") end' 2>/dev/null || echo missing)
              echo "context run: $state"
              if [ "$state" = "completed:success" ]; then
                break
              fi
              if [[ "$state" == completed:* ]] && [ "$state" != "completed:success" ]; then
                echo "Context refresh failed; refusing to write media on stale context."
                exit 1
              fi
              if [ "$attempt" -eq 40 ]; then
                echo "Timed out waiting for matching context refresh."
                exit 1
              fi
              sleep 15
            done
          else
            echo "No context workflow was triggered for this media-only push; using latest context committed on main."
          fi
          git fetch origin main
          git reset --hard origin/main

      - name: Refresh latest main for scheduled/manual run
        if: github.event_name != 'push'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install editorial environment
        run: pip install ".[dev]"

      - name: Test media editorial guardrails
        run: pytest -q tests/test_media_context.py tests/test_copilot_media.py tests/test_copilot_composition.py tests/test_copilot_json_handoff.py tests/test_levline_paragraph_renderer.py tests/test_read_contract.py tests/test_editorial_finalize.py

      - name: Refresh deterministic reporting packet
        run: python scripts/finalize_editorial.py --skip-copilot

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Research, compose and validate human game Reads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t approved_domains < <(python - <<'PY'
          from nfl_forecast.source_policy import APPROVED_MEDIA_DOMAINS
          for domain in sorted(APPROVED_MEDIA_DOMAINS):
              print(domain)
          PY
          )
          mapfile -t game_ids < <(python - <<'PY'
          import pandas as pd
          for gid in pd.read_csv('outputs/this_week.csv')['game_id'].astype(str):
              print(gid)
          PY
          )
          copilot_args=(
            -s
            --no-ask-user
            "--deny-tool=shell,write"
            "--allow-tool=url"
          )
          for domain in "${approved_domains[@]}"; do
            copilot_args+=("--allow-url=$domain")
          done
          echo "Copilot approved source domains: ${#approved_domains[@]}"
          echo "Focused matchup research calls per attempt: ${#game_ids[@]}"

          validated=0
          feedback=/tmp/copilot-validation-feedback.txt
          : > "$feedback"
          for attempt in 1 2 3; do
            echo "Copilot focused editorial attempt $attempt/3"
            parts=/tmp/copilot-game-parts
            prompts=/tmp/copilot-game-prompts
            rm -rf "$parts" "$prompts"
            mkdir -p "$parts" "$prompts"
            rm -f /tmp/copilot-media-raw.json /tmp/copilot-media-composed.json /tmp/copilot-media-rendered.json outputs/copilot_media_reads.json

            research_failed=0
            for gid in "${game_ids[@]}"; do
              prompt="$prompts/$gid.txt"
              python scripts/build_single_game_copilot_prompt.py \
                --game-id "$gid" \
                --prompt-file "$prompt" \
                --feedback-file "$feedback"
              if ! copilot "${copilot_args[@]}" -p "$(cat "$prompt")" > "$parts/$gid.txt"; then
                echo "$gid: Copilot research call failed" | tee -a "$feedback"
                research_failed=1
                break
              fi
            done
            if [ "$research_failed" -ne 0 ]; then
              echo "Focused research attempt $attempt failed before composition."
              continue
            fi

            if ! python scripts/merge_copilot_game_payloads.py \
                --input-dir "$parts" \
                --predictions outputs/this_week.csv \
                --output /tmp/copilot-media-raw.json; then
              echo "Focused response merge failed on attempt $attempt" | tee -a "$feedback"
              continue
            fi
            if ! python scripts/compose_copilot_media_reads.py \
                --input /tmp/copilot-media-raw.json \
                --predictions outputs/this_week.csv \
                --previews outputs/game_previews.json \
                --evidence outputs/contextual_evidence.json \
                --output /tmp/copilot-media-composed.json; then
              echo "Deterministic composition failed on attempt $attempt" | tee -a "$feedback"
              continue
            fi
            if ! python scripts/render_levline_paragraphs.py \
                --input /tmp/copilot-media-composed.json \
                --predictions outputs/this_week.csv \
                --previews outputs/game_previews.json \
                --output /tmp/copilot-media-rendered.json; then
              echo "Deterministic LevLine paragraph render failed on attempt $attempt" | tee -a "$feedback"
              continue
            fi

            if python scripts/validate_copilot_media_reads.py \
                --input /tmp/copilot-media-rendered.json \
                --predictions outputs/this_week.csv \
                --output outputs/copilot_media_reads.json \
                2> "$feedback"; then
              validated=1
              echo "Copilot focused editorial attempt $attempt passed all publication gates."
              break
            fi
            echo "Copilot focused editorial attempt $attempt failed strict validation."
            cat "$feedback"
          done
          if [ "$validated" -ne 1 ]; then
            echo "All three focused Copilot editorial attempts failed strict publication validation."
            exit 1
          fi

      - name: Finalize and enforce full-slate launch gate
        run: |
          python scripts/finalize_editorial.py
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('outputs/context_source_status.json').read_text())
          media = status.get('media_reporting', {})
          copilot = status.get('copilot_media', {})
          finalizer = status.get('editorial_finalizer', {})
          games = int(finalizer.get('games', 0))
          if media.get('status') != 'healthy' or int(media.get('games_with_trusted_reporting', 0)) != games:
              raise SystemExit(f'media reporting not launch-grade: {media}')
          if copilot.get('status') != 'healthy' or int(copilot.get('games_applied', 0)) != games:
              raise SystemExit(f'Copilot did not cover full slate: {copilot}')
          if finalizer.get('status') != 'healthy' or int(finalizer.get('unique_headlines', 0)) != games:
              raise SystemExit(f'final editorial gate failed: {finalizer}')
          print('Copilot matchup/model/pick launch gate passed:', games, 'games')
          PY

      - name: Publish editorial-only outputs
        run: |
          set -euo pipefail
          git config user.name "sunday-signal-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            outputs/copilot_media_reads.json \
            outputs/game_previews.json \
            outputs/context_source_status.json
          if git diff --cached --quiet; then
            echo "No media editorial changes to publish."
            exit 0
          fi
          git commit -m "Refresh human Sunday Signal Reads"
          git pull --rebase origin main
          git push origin HEAD:main
