name: LevLine Phase 4 baseline/tie identity audit
on:
  push:
    branches:
      - research/post-week4-phase4-baseline-reconcile-20261007
    paths:
      - 'research/post_week4_phase4/RUN_BASELINE_AUDIT.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce-frozen-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: '.:src'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install '.[dev]'
      - name: Reproduce historical comparator and tie identity
        run: |
          python -m pytest -q research/post_week4_phase4/test_reconcile_baselines.py
          python research/post_week4_phase4/reconcile_baselines.py --output research/post_week4_phase4/evidence/baseline_identity_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/post_week4_phase4/evidence/baseline_identity_receipt.json').read_text())
          assert d['paired_games']==1087
          assert d['baseline_definitions']['season_forward']['correct']==741
          assert d['baseline_definitions']['frozen_final_coefficients']['correct']==740
          assert d['outcomes_2026_used']==0
          assert d['production_changed'] is False
          PY
      - name: No change in production
        run: |
          git diff --exit-code -- outputs/ site/ src/nfl_forecast/ scripts/
      - name: Preserve source-scoped research receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/post_week4_phase4/evidence/baseline_identity_receipt.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: preserve frozen-vs-season-forward tie audit [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-fst-identity-${{ github.run_id }}
          path: research/post_week4_phase4/evidence/baseline_identity_receipt.json
          if-no-files-found: warn
          retention-days: 90
