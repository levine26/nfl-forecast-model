name: ATS NextGen Q2 Stage B

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/challenger_ats_nextgen_q2.py'
      - 'src/nfl_forecast/challenger_ats_nextgen_q2_experiment.py'
      - 'src/nfl_forecast/challenger_ats_nextgen_q2_reporting.py'
      - 'scripts/run_challenger_ats_nextgen_q2.py'
      - 'tests/test_challenger_ats_nextgen_q2.py'
      - 'tests/test_challenger_ats_nextgen_q2_experiment.py'
      - 'research/ats-nextgen/**'
      - '.github/workflows/research_ats_nextgen_q2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ats-nextgen-q2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROTECTED_SURFACES: >-
    outputs/ site/ src/nfl_forecast/pipeline.py src/nfl_forecast/models.py
    src/nfl_forecast/features.py src/nfl_forecast/data.py src/nfl_forecast/publish.py
    src/nfl_forecast/market.py src/nfl_forecast/market_t120.py src/nfl_forecast/lock_verify.py
    scripts/run_week.py scripts/refresh_market.py scripts/pregame_due.py scripts/verify_pregame_lock.py

jobs:
  contract:
    name: Q2 pre-result contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Prove opening gate, frozen Q1, and Q2 distribution contract
        run: |
          pytest -q \
            tests/test_challenger_ats_nextgen_phase2_gate.py \
            tests/test_challenger_ats_nextgen_q1.py \
            tests/test_challenger_ats_nextgen_q1_reporting.py \
            tests/test_challenger_ats_nextgen_q2.py \
            tests/test_challenger_ats_nextgen_q2_experiment.py
      - name: Prove contract tests did not modify production surfaces
        run: git diff --exit-code -- $PROTECTED_SURFACES

  historical:
    name: Q2 chronology-clean 2022-2025 OOF
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: ats-nextgen-q2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ats-nextgen-q2-${{ runner.os }}-
            ats-nextgen-q1-${{ runner.os }}-
            nfl-research-${{ runner.os }}-
            nfl-challenger-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Execute frozen Q2 only after contract success
        run: |
          rm -rf research_outputs/ats_nextgen/q2
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
            python scripts/run_challenger_ats_nextgen_q2.py
          test -s research_outputs/ats_nextgen/q2/q2_outer_oof_metadata_2022_2025.csv
          test -s research_outputs/ats_nextgen/q2/q2_outer_oof_pmfs.npz
          test -s research_outputs/ats_nextgen/q2/q2_inner_selections.csv
          test -s research_outputs/ats_nextgen/q2/q2_distribution_metrics.csv
          test -s research_outputs/ats_nextgen/q2/q2_fixed_slice_metrics.csv
          test -s research_outputs/ats_nextgen/q2/q2_cover_reliability.csv
          test -s research_outputs/ats_nextgen/q2/q2_summary.json
      - name: Prove Q2 execution did not modify production surfaces
        run: git diff --exit-code -- $PROTECTED_SURFACES
      - name: Upload immutable Q2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ats-nextgen-q2-${{ github.run_id }}
          path: research_outputs/ats_nextgen/q2/
          retention-days: 90
