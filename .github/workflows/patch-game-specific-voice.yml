name: Patch game-specific editorial voice
on:
  push:
    branches: [editorial/game-specific-voice]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/game-specific-voice
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install '.[dev]'
      - run: python scripts/patch_game_specific_voice.py
      - name: Regenerate editorial layer only
        run: |
          PYTHONPATH="$PWD/src" python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from nfl_forecast.editorial_voice import polish_preview_slate
          from nfl_forecast.editorial_finalize import finalize_previews

          previews_path = Path('outputs/game_previews.json')
          previews = json.loads(previews_path.read_text())
          evidence = json.loads(Path('outputs/contextual_evidence.json').read_text())
          predictions = pd.read_csv('outputs/this_week.csv')
          previews = polish_preview_slate(previews, predictions)
          report = finalize_previews(predictions, previews, evidence)
          previews_path.write_text(json.dumps(previews, indent=2, sort_keys=True) + '\n')
          print(report)
          PY
      - run: pytest -q
      - name: Build site with regenerated game files
        run: |
          cp outputs/game_previews.json site/public/data/game_previews.json
          cd site
          npm install
          npm run build
      - name: Commit final patch and remove helpers
        run: |
          git config user.name "sunday-signal-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          rm scripts/patch_game_specific_voice.py .github/workflows/patch-game-specific-voice.yml
          git add -A
          git commit -m "Make every game file evidence-specific"
          git push origin HEAD:editorial/game-specific-voice
