name: Market independence audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/nfl_forecast/market_diagnostics.py'
      - 'scripts/run_market_audit.py'
      - 'tests/test_market_diagnostics.py'
      - '.github/workflows/market-audit.yml'
  schedule:
    - cron: '35 13 * * 2'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - run: pytest -q tests/test_market_diagnostics.py
      - name: Run historical market-independence audit
        run: PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" python scripts/run_market_audit.py --season 2026
      - uses: actions/upload-artifact@v4
        with:
          name: market-independence-audit
          path: |
            outputs/market_independence.json
            outputs/market_weight_grid.csv
            outputs/market_weight_walk_forward.csv
