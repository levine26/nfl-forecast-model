name: LevLine Phase 4 two-stage gateway synthetic QA

on:
  pull_request:
    paths:
      - 'research/post_week4_phase4/two_stage_gateway.py'
      - 'research/post_week4_phase4/test_two_stage_gateway.py'
      - 'research/post_week4_phase4/TWO_STAGE_GATEWAY.md'
      - '.github/workflows/research_phase4_two_stage_gateway.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: '.:src'
      PYTHONHASHSEED: '26'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install '.[dev]'
      - name: Frozen candidate identity + syntax + adversarial synthetic tests
        run: |
          python -m compileall -q research/post_week4_phase4
          python -m pytest -q research/post_week4_phase4/test_c_shadow.py research/post_week4_phase4/test_two_stage_gateway.py
          python - <<'PY'
          import json
          from pathlib import Path
          from research.post_week4_phase4.c_shadow import validate_model
          obj = json.loads(Path("research/post_week4_phase4/artifacts/C_SHADOW_FROZEN_2026.json").read_text())
          validate_model(obj)
          assert obj["outcomes_2026_used"] == 0
          assert obj["training_games"] == 1615
          print("Immutable Candidate C artifact: PASS, NO REFIT")
          PY
      - name: Keep production F-ST and outputs unchanged
        run: |
          git diff --exit-code origin/main -- outputs/ site/ src/nfl_forecast/ scripts/ \
            .github/workflows/pregame.yml .github/workflows/weekly.yml
