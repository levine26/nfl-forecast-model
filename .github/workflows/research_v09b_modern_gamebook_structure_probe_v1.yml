name: LevLine V09B modern Game Book structure probe V1

on:
  pull_request:
    paths:
      - 'research/availability/v09b_modern_gamebook_structure_probe_contract_v1.json'
      - 'research/v09b_modern_gamebook_structure_probe_v1.py'
      - 'research/test_v09b_modern_gamebook_structure_probe_v1.py'
      - '.github/workflows/research_v09b_modern_gamebook_structure_probe_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test diagnostic-only text inspection helpers
        run: pytest -q research/test_v09b_modern_gamebook_structure_probe_v1.py
      - name: Validate no-qualification contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/availability/v09b_modern_gamebook_structure_probe_contract_v1.json').read_text())
          assert c['status'] == 'DIAGNOSTIC_ONLY_NO_QUALIFICATION_AUTHORITY'
          assert c['sample_design']['sample_per_season'] == 1
          assert c['sample_design']['sample_is_coverage_qualification'] is False
          assert c['text_extraction']['semantic_parser_applied'] is False
          assert c['text_extraction']['legacy_heading_regex_assumed_valid'] is False
          assert c['text_extraction']['legacy_roster_partition_assumed_valid'] is False
          assert c['authorization']['modern_raw_source_bytes_qualified'] is False
          assert c['authorization']['modern_gamebook_structure_qualified'] is False
          assert c['authorization']['v09b_model_fit_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used'] == 0
          PY

  structure-probe:
    needs: unit-and-contract
    strategy:
      fail-fast: false
      matrix:
        season: [2017, 2018, 2019, 2020, 2021]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install '.[dev]'
      - name: Probe one deterministic official modern Game Book
        run: |
          mkdir -p research_outputs/v09b_modern_gamebook_structure_probe_v1
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_modern_gamebook_structure_probe_v1.py \
              --season ${{ matrix.season }} \
              --output research_outputs/v09b_modern_gamebook_structure_probe_v1/${{ matrix.season }}.json
      - name: Assert diagnostic-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          season = '${{ matrix.season }}'
          r = json.loads(Path(f'research_outputs/v09b_modern_gamebook_structure_probe_v1/{season}.json').read_text())
          assert r['qualification_authority'] is False
          assert r['semantic_parser_applied'] is False
          assert r['legacy_heading_regex_assumed_valid'] is False
          assert r['legacy_roster_partition_assumed_valid'] is False
          assert r['modern_raw_source_bytes_qualified'] is False
          assert r['modern_gamebook_structure_qualified'] is False
          assert r['modern_game_day_roster_universe_qualified'] is False
          assert r['modern_player_team_game_identity_qualified'] is False
          assert r['training_label_semantics_qualified'] is False
          assert r['training_source_chronology_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['game_outcomes_used'] == 0
          assert r['completed_2026_outcomes_used'] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v09b-modern-gamebook-structure-probe-v1-${{ matrix.season }}-${{ github.run_id }}
          path: research_outputs/v09b_modern_gamebook_structure_probe_v1/${{ matrix.season }}.json
          if-no-files-found: error
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove probe remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
