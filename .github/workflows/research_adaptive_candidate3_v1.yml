name: Adaptive Weekly Candidate 3 canonical evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ADAPTIVE_WEEKLY_CANDIDATE3_*"
      - "research/adaptive_candidate3_*"
      - ".github/workflows/research_adaptive_candidate3_v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --disable-pip-version-check             "duckdb>=1.1,<2" "numpy>=1.26,<3" "pandas>=2.1,<3"             "scipy>=1.11,<2" "scikit-learn>=1.4,<2"

      - name: Verify frozen preregistration identity
        run: |
          grep -F "ADAPTIVE-MARKET-PATH-INNOVATION-V1" research/ADAPTIVE_WEEKLY_CANDIDATE3_PREREGISTRATION.md
          grep -F "52cf402cd33da0e535ef963c7d98f9b4304ea208" research/adaptive_candidate3_evaluation_v1.py
          python -m py_compile             research/adaptive_candidate3_market_path_source_audit_v1.py             research/adaptive_candidate3_evaluation_v1.py

      - name: Download immutable historical market archive
        run: |
          mkdir -p candidate3_inputs
          curl -L --fail --retry 3             "https://github.com/bobby-king3/nfl-market-movement-tracker/releases/download/v1.1.1/nfl_odds.duckdb"             -o candidate3_inputs/nfl_odds.duckdb
          echo "b03c4e7f1cf885e9f20ea808ee538c26c21df4065b342fe04c50d09b808c344c  candidate3_inputs/nfl_odds.duckdb" | sha256sum -c -

      - name: Download canonical Candidate 2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail --retry 3             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10705320611/zip"             -o candidate3_inputs/candidate2.zip
          echo "fc647c321190cebcda814a88a8159b7342894951aa7e80e07585928a5b4cb771  candidate3_inputs/candidate2.zip" | sha256sum -c -
          mkdir -p candidate3_inputs/candidate2
          unzip -q candidate3_inputs/candidate2.zip -d candidate3_inputs/candidate2
          test -f candidate3_inputs/candidate2/candidate/scored_games.csv

      - name: Re-run outcome-blind PIT source qualification
        run: |
          mkdir -p candidate3_evidence
          python research/adaptive_candidate3_market_path_source_audit_v1.py             --db candidate3_inputs/nfl_odds.duckdb             --output candidate3_evidence/source_audit.json

      - name: Run frozen Candidate 3 canonical evaluation
        run: |
          PYTHONPATH=. python research/adaptive_candidate3_evaluation_v1.py             --db candidate3_inputs/nfl_odds.duckdb             --training-frame challenger_outputs/fst/provenance/training_frame_keyed.csv             --candidate2-scored candidate3_inputs/candidate2/candidate/scored_games.csv             --output-dir candidate3_evidence

      - name: Validate evidence schema and scientific firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("candidate3_evidence/evaluation.json").read_text())
          assert r["candidate_id"]=="ADAPTIVE-MARKET-PATH-INNOVATION-V1"
          assert r["preregistration_sha"]=="52cf402cd33da0e535ef963c7d98f9b4304ea208"
          assert r["sample"]["games"]==272
          assert r["fst"]["correct"]==179
          assert r["leakage_assessment"]["market_rows_post_kickoff_used"]==0
          assert r["leakage_assessment"]["lock_rows_later_than_T120_used"]==0
          assert r["leakage_assessment"]["completed_2026_season_outcomes_loaded"]==0
          assert r["leakage_assessment"]["production_changed"] is False
          assert r["promotion_authorized"] is False
          PY

      - name: Verify production firewall
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(research/|\.github/workflows/research_)' || true)"
          if [ -n "$bad" ]; then
            echo "Non-research surface changed:"
            echo "$bad"
            exit 1
          fi

      - name: Record run metadata
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("candidate3_evidence/run_metadata.json")
          p.write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "execution_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "candidate_id": "ADAPTIVE-MARKET-PATH-INNOVATION-V1",
              "preregistration_sha": "52cf402cd33da0e535ef963c7d98f9b4304ea208",
              "production_changed": False
          }, indent=2, sort_keys=True)+"\n")
          PY

      - name: Upload canonical Candidate 3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-candidate3-${{ github.run_id }}
          path: candidate3_evidence/
          if-no-files-found: error
          retention-days: 60
