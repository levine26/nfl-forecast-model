name: LevLine V09B Game Book residual path V3

on:
  pull_request:
    paths:
      - 'research/availability/v09b_gamebook_training_label_coverage_receipt_v2.json'
      - 'research/availability/v09b_gamebook_residual_path_audit_v3.json'
      - 'research/v09b_gamebook_residual_path_audit_v3.py'
      - 'research/test_v09b_gamebook_residual_path_audit_v3.py'
      - '.github/workflows/research_v09b_gamebook_residual_path_v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-v09b-gamebook-residual-path-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  residual-path-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research dependencies
        run: pip install '.[dev]'

      - name: Test frozen V3 diagnostic semantics
        run: pytest -q research/test_v09b_gamebook_residual_path_audit_v3.py

      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: v09b-gamebook-residual-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            v09b-gamebook-residual-v3-${{ runner.os }}-
            v09b-gamebook-coverage-v2-${{ runner.os }}-
            nfl-availability-${{ runner.os }}-

      - name: Execute known-host residual path audit
        run: |
          rm -rf research_outputs/v09b_gamebook_residual_path_audit_v3
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_gamebook_residual_path_audit_v3.py \
              --output-dir research_outputs/v09b_gamebook_residual_path_audit_v3
          test -s research_outputs/v09b_gamebook_residual_path_audit_v3/qualification.json
          test -s research_outputs/v09b_gamebook_residual_path_audit_v3/v2_residual_games.csv
          test -s research_outputs/v09b_gamebook_residual_path_audit_v3/directory_queries.csv
          test -s research_outputs/v09b_gamebook_residual_path_audit_v3/directory_pdf_candidates.csv

      - name: Validate source-only diagnostic disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path('research_outputs/v09b_gamebook_residual_path_audit_v3/qualification.json').read_text()
          )
          assert report['technical_status'] in {
              'NO_ADDITIONAL_KNOWN_HOST_PATHS_FOUND',
              'ADDITIONAL_KNOWN_HOST_PATH_CANDIDATES_FOUND',
              'INCONCLUSIVE_NETWORK_OR_CDX_ERRORS',
              'BLOCKED_REPRODUCTION_MISMATCH',
          }, report
          assert report['v2_failure_preserved'] is True, report
          assert report['authorization']['training_label_semantics_qualified'] is False, report
          assert report['authorization']['training_source_chronology_qualified'] is False, report
          assert report['authorization']['v09b_model_fit_authorized'] is False, report
          assert report['governance']['source_only_audit'] is True, report
          assert report['governance']['labels_constructed'] is False, report
          assert report['governance']['model_fit_performed'] is False, report
          assert report['governance']['game_outcomes_used'] == 0, report
          assert report['governance']['completed_2026_outcomes_used'] == 0, report
          if report['technical_status'] not in {'BLOCKED_REPRODUCTION_MISMATCH'}:
              assert report['v2_reproduction']['schedule_games'] == 2576, report
              assert report['v2_reproduction']['covered_games'] == 2506, report
              assert report['v2_reproduction']['residual_games'] == 70, report
              assert report['v2_reproduction']['alias_conflict_games'] == 1, report
          PY

      - name: Prove branch remains research-only
        if: always()
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [line.strip() for line in Path('/tmp/changed.txt').read_text().splitlines() if line.strip()]
          bad = [
              path for path in changed
              if not (path.startswith('research/') or path.startswith('.github/workflows/research_'))
          ]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: levline-v09b-gamebook-residual-path-v3-${{ github.run_id }}
          path: research_outputs/v09b_gamebook_residual_path_audit_v3/
          retention-days: 30
          if-no-files-found: warn
