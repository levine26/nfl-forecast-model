name: LevLine Props live refresh

on:
  workflow_dispatch:
    inputs:
      season:
        description: Optional explicit season; omit to use outputs/this_week.csv
        required: false
        type: string
      week:
        description: Optional explicit week; omit to use outputs/this_week.csv
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/run_props_live_cycle.py'
      - 'tests/test_props_live_cycle.py'
      - '.github/workflows/props_live.yml'
  pull_request:
    paths:
      - 'scripts/run_props_live_cycle.py'
      - 'tests/test_props_live_cycle.py'
      - '.github/workflows/props_live.yml'
      - '.github/workflows/dashboard.yml'
  schedule:
    # Regular snapshots Thursday-Saturday and Monday.
    - cron: '20 15,22 * * 4,5,6,1'
    # Denser Sunday snapshots as the main slate approaches and rolls through kickoff.
    - cron: '20 13,16,19,22 * * 0'

permissions:
  contents: write

concurrency:
  group: levline-props-live
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
      - run: pip install '.[dev]'
      - name: Validate live Props orchestration and governed contracts
        run: >-
          python -m pytest -q
          tests/test_props_live_cycle.py
          tests/test_props_runner.py
          tests/test_props_publication.py
          tests/test_props_market_live.py
          tests/test_props_upstream.py

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      PROPS_PRIORS_JSON: ${{ secrets.PROPS_PRIORS_JSON }}
      PROPS_BOOKMAKERS: ${{ vars.PROPS_BOOKMAKERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
      - name: Fail closed unless live credentials and preregistered priors exist
        run: |
          set -euo pipefail
          if [ -z "${THE_ODDS_API_KEY:-}" ]; then
            echo "::error::THE_ODDS_API_KEY repository secret is not configured."
            exit 1
          fi
          if [ -z "${PROPS_PRIORS_JSON:-}" ]; then
            echo "::error::PROPS_PRIORS_JSON repository secret is not configured."
            exit 1
          fi
          umask 077
          printf '%s' "$PROPS_PRIORS_JSON" > /tmp/props_priors.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/props_priors.json').read_text())
          if not isinstance(payload, dict):
              raise SystemExit('PROPS_PRIORS_JSON must decode to an object')
          print('Preregistered Props priors loaded without exposing secret contents.')
          PY
      - run: pip install '.[dev]'
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: props-live-nflreadpy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            props-live-nflreadpy-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Generate, freeze, and publish current Props artifact
        run: |
          set -euo pipefail
          git config user.name "levline-props-bot"
          git config user.email "actions@users.noreply.github.com"

          SEASON="${{ inputs.season }}"
          WEEK="${{ inputs.week }}"
          EXTRA_ARGS=()
          if [ -n "$SEASON" ] || [ -n "$WEEK" ]; then
            if [ -z "$SEASON" ] || [ -z "$WEEK" ]; then
              echo "::error::Manual override requires both season and week."
              exit 1
            fi
            EXTRA_ARGS=(--season "$SEASON" --week "$WEEK")
          fi
          BOOK_ARGS=()
          if [ -n "${PROPS_BOOKMAKERS:-}" ]; then
            BOOK_ARGS=(--bookmakers "$PROPS_BOOKMAKERS")
          fi

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "main advanced during Props refresh; regenerating from current main (attempt $attempt/3)"
              git fetch origin main
              git reset --hard origin/main
              git clean -fd outputs/props/
            fi

            PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
              python scripts/run_props_live_cycle.py \
                --priors /tmp/props_priors.json \
                --work-root .artifacts/props-live \
                "${EXTRA_ARGS[@]}" \
                "${BOOK_ARGS[@]}"

            git add \
              outputs/props/forecasts.json \
              outputs/props/public_props.json \
              outputs/props/status.json \
              outputs/props/history/forecast_originals.jsonl

            if git diff --cached --quiet; then
              echo "No Props publication changes to publish."
              exit 0
            fi

            git commit -m "Refresh LevLine Props research beta"
            base_sha=$(git rev-parse HEAD^)
            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$base_sha" ]; then
              echo "Push failed even though main did not advance; refusing to mask a non-race publish error."
              exit 1
            fi
          done

          echo "main changed during all three Props refresh attempts; leaving existing published Props outputs untouched."
          exit 1
      - name: Preserve full live capture for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levline-props-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/props-live
          if-no-files-found: ignore
          retention-days: 30
