name: LevLine V09B modern Game Book identity audit V3

on:
  pull_request:
    paths:
      - 'research/availability/v09b_modern_gamebook_identity_audit_v3_contract.json'
      - 'research/v09b_modern_position_identity_source_capture_v2.py'
      - 'research/v09b_modern_gamebook_identity_audit_v3.py'
      - 'research/test_v09b_modern_gamebook_identity_audit_v3.py'
      - '.github/workflows/research_v09b_modern_gamebook_identity_audit_v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-v09b-modern-gamebook-identity-audit-v3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test preregistered V3 rules
        run: pytest -q research/test_v09b_modern_gamebook_identity_audit_v3.py
      - name: Validate frozen V3 contract and predecessor
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          c = json.loads(Path('research/availability/v09b_modern_gamebook_identity_audit_v3_contract.json').read_text())
          assert c['contract_id'] == 'V09B-MODERN-GAMEBOOK-IDENTITY-AUDIT-V3'
          assert c['status'] == 'PREREGISTERED_INDEPENDENT_POSITION_FAMILY_CALIBRATION_GATE'
          p = c['predecessor_v2']
          assert p['receipt_git_blob_sha1'] == '0d79d904798db2e8d3aa5e40efb3550fe9220a19'
          assert p['final_ambiguous'] == 2
          assert p['final_unresolved'] == 405
          assert p['ambiguity_rows_reopened'] == 2
          assert p['unresolved_rows_reopened'] == 0
          actual = subprocess.check_output(['git', 'hash-object', p['receipt_path']], text=True).strip()
          assert actual == p['receipt_git_blob_sha1']

          d = c['adaptive_design_disclosure']
          assert d['target_identity_values_may_not_be_used_in_calibration'] is True
          assert d['all_10_v1_ambiguity_rows_excluded_from_calibration'] is True
          assert d['manual_target_specific_exception_authorized'] is False

          s = c['position_source_projection']
          assert s['projection_fields'] == ['season','game_type','week','team','gsis_id','jersey_number','position']
          assert s['status_fields_selected'] is False
          assert s['status_fields_read'] is False
          assert s['projection_must_be_persisted_before_calibration_or_target_resolution'] is True

          g = c['independent_calibration']
          assert g['truth_source'].startswith('V1 exact resolver only')
          assert g['structural_v1_resolutions_included'] is False
          assert g['all_v1_ambiguity_rows_excluded'] is True
          assert g['minimum_total_comparable_rows'] == 5000
          assert g['minimum_secondary_gamebook_rows'] == 1000
          assert g['minimum_linebacker_gamebook_rows'] == 1000
          assert g['minimum_overall_family_agreement'] == 0.95
          assert g['minimum_secondary_family_agreement'] == 0.95
          assert g['minimum_linebacker_family_agreement'] == 0.95
          assert g['minimum_wilson95_lower_bound_each_family'] == 0.94
          assert g['target_rows_allowed_in_calibration'] == 0

          a = c['aggregate_identity_qualification_gate']
          assert a['minimum_final_resolution_rate'] == 0.995
          assert a['final_ambiguities_allowed'] == 0
          assert a['source_identity_conflicts_allowed'] == 0
          assert a['independent_calibration_gate_required'] is True
          assert a['both_v2_remaining_rows_must_replay'] is True
          assert c['explicit_non_authority']['modern_game_day_roster_universe_qualified'] is False
          assert c['explicit_non_authority']['training_label_semantics_qualified'] is False
          assert c['explicit_non_authority']['training_source_chronology_qualified'] is False
          assert c['explicit_non_authority']['v09b_model_fit_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used'] == 0
          PY

  capture-position-source:
    needs: unit-and-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Materialize exact frozen weekly-roster source
        run: |
          set -euo pipefail
          SOURCE_COMMIT=1c6f388c06f7473eb7483d6b4b91685ecb3d019c
          git fetch origin research-data/v09b-modern-identity-source-v1
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git worktree add --detach /tmp/v09b-modern-identity-source "$SOURCE_COMMIT"
      - name: Persist five status-free position projections
        run: |
          set -euo pipefail
          OUT=research_outputs/v09b_modern_position_identity_source_capture_v2
          declare -A SHA
          SHA[2017]=2f633cf331f561ea5346238a1808e8a68811eb280084e75f0dd09880535c5012
          SHA[2018]=0fcd3c3f098dbb5350be2095959acf38202602c6b3c71475e883fabda23077a8
          SHA[2019]=08ef64996cecdff2f4631ca26b21ed9a39bf5fba0b3379d902e531facf81e5c4
          SHA[2020]=8d601bf5c5d669465481421ad5cd1a1470d51792054e84bdc04f3620785f7530
          SHA[2021]=3e9f67569e940b54b3778ef2c9150850920b5bf93143bad3bd158e649825cf6b
          for season in 2017 2018 2019 2020 2021; do
            PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
              python research/v09b_modern_position_identity_source_capture_v2.py \
                --season "$season" \
                --raw-path "/tmp/v09b-modern-identity-source/research_outputs/v09b_modern_identity_source_capture_v1/raw/${SHA[$season]}.parquet" \
                --output-root "$OUT"
          done
      - name: Validate five-season capture firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected_rows = {2017:49210, 2018:50113, 2019:49561, 2020:41972, 2021:44539}
          expected_missing = {2017:0, 2018:35, 2019:2, 2020:5, 2021:23}
          root = Path('research_outputs/v09b_modern_position_identity_source_capture_v2/receipts')
          for season in expected_rows:
              r = json.loads((root / f'{season}.json').read_text())
              assert r['capture_contract_id'] == 'V09B-MODERN-POSITION-IDENTITY-SOURCE-CAPTURE-V2'
              assert r['capture_gate_pass'] is True
              assert r['source_rows_selected'] == expected_rows[season]
              assert r['missing_gsis_rows'] == expected_missing[season]
              assert r['projection_fields'] == ['season','game_type','week','team','gsis_id','jersey_number','position']
              assert r['projection_contains_status_fields'] is False
              assert r['status_fields_selected'] is False
              assert r['status_fields_read'] is False
              assert r['modern_player_team_game_identity_qualified'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v09b-modern-position-source-v2-${{ github.run_id }}
          path: research_outputs/v09b_modern_position_identity_source_capture_v2
          if-no-files-found: error
          retention-days: 30

  identity-v3-gate:
    needs: capture-position-source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install '.[dev]'
      - name: Materialize exact Game Book and identity sources
        run: |
          set -euo pipefail
          GAMEBOOK_COMMIT=aab55bf97aa62cae446b358b9739f4c62604cc8e
          IDENTITY_COMMIT=1c6f388c06f7473eb7483d6b4b91685ecb3d019c
          git fetch origin research-data/v09b-gamebooks-modern-v2 research-data/v09b-modern-identity-source-v1
          git cat-file -e "$GAMEBOOK_COMMIT^{commit}"
          git cat-file -e "$IDENTITY_COMMIT^{commit}"
          git worktree add --detach /tmp/v09b-modern-gamebooks "$GAMEBOOK_COMMIT"
          git worktree add --detach /tmp/v09b-modern-identity-source "$IDENTITY_COMMIT"
      - uses: actions/download-artifact@v4
        with:
          name: v09b-modern-position-source-v2-${{ github.run_id }}
          path: /tmp/v09b-position-source
      - name: Run independent calibration and target replay
        run: |
          set +e
          OUT=research_outputs/v09b_modern_gamebook_identity_audit_v3/aggregate.json
          mkdir -p "$(dirname "$OUT")"
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_modern_gamebook_identity_audit_v3.py \
              --archive-root /tmp/v09b-modern-gamebooks/research_outputs/v09b_modern_gamebook_raw_archive_v2 \
              --identity-root /tmp/v09b-modern-identity-source/research_outputs/v09b_modern_identity_source_capture_v1 \
              --position-root /tmp/v09b-position-source \
              --v1-receipt research/availability/v09b_modern_gamebook_identity_audit_v1_receipt.json \
              --v2-receipt research/availability/v09b_modern_gamebook_identity_audit_v2_receipt.json \
              --output "$OUT"
          true
      - name: Apply frozen V3 calibration and aggregate identity gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('research_outputs/v09b_modern_gamebook_identity_audit_v3/aggregate.json').read_text())
          assert r['contract_id'] == 'V09B-MODERN-GAMEBOOK-IDENTITY-AUDIT-V3'
          c = r['calibration']
          assert c['v1_ambiguity_rows_excluded'] == 10
          assert c['total_comparable_rows'] >= 5000
          assert c['overall_agreement_rate'] >= 0.95
          assert c['by_gamebook_family']['secondary']['rows'] >= 1000
          assert c['by_gamebook_family']['linebacker']['rows'] >= 1000
          for family in ('secondary','linebacker'):
              assert c['by_gamebook_family'][family]['agreement_rate'] >= 0.95
              assert c['by_gamebook_family'][family]['wilson95_lower_bound'] >= 0.94
          assert c['calibration_gate_pass'] is True
          t = r['target_follow_up']
          assert t['rows_replayed'] == 2
          assert t['resolved_rows'] == 2
          assert t['candidate_projection_lookup_misses'] == 0
          assert t['source_error_count'] == 0
          assert r['source_identity_conflicts'] == 0
          assert r['final_identity_resolution_rate'] >= 0.995
          assert r['final_ambiguous'] == 0
          assert r['aggregate_qualification_gate_pass'] is True
          assert r['modern_player_team_game_identity_qualified'] is True
          assert r['modern_game_day_roster_universe_qualified'] is False
          assert r['training_label_semantics_qualified'] is False
          assert r['training_source_chronology_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['weekly_roster_status_used'] is False
          assert r['raw_weekly_roster_consumed_by_calibration_or_target_resolver'] is False
          assert r['postgame_participation_used'] is False
          assert r['completed_2026_outcomes_used'] == 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v09b-modern-gamebook-identity-v3-${{ github.run_id }}
          path: research_outputs/v09b_modern_gamebook_identity_audit_v3/aggregate.json
          if-no-files-found: error
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
