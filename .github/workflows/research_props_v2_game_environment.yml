name: LevLine Props 2.0 game environment

on:
  pull_request:
    branches:
      - research/props-v2-challenger
    paths:
      - 'research/props/v2/game_environment_residual.py'
      - 'research/props/v2/test_game_environment_residual.py'
      - 'research/props/v2/run_game_environment_residual.py'
      - 'research/props/v2/GAME_ENVIRONMENT_RESIDUAL_CONTRACT.md'
      - '.github/workflows/research_props_v2_game_environment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate frozen low-dimensional component
        run: python -m pytest -q research/props/v2/test_game_environment_residual.py

  component:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pyarrow
      - name: Run season-forward game-environment component study
        run: |
          python research/props/v2/run_game_environment_residual.py \
            --output-dir research_outputs/props_v2/game_environment
      - name: Enforce component boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research_outputs/props_v2/game_environment/summary.json").read_text())
          assert d["contract_version"]=="levline-props-v2-game-environment-v0.1.0"
          assert d["prop_outcomes_used"]==0
          assert d["completed_2026_outcomes_used"]==0
          assert d["production_authorized"] is False
          assert d["n"]>0
          for season,part in d["by_season"].items():
              assert part["trained_through_season"]==int(season)-1
          print(json.dumps({
              "n":d["n"],
              "baseline_team_plays_mae":d["baseline_team_plays_mae"],
              "challenger_team_plays_mae":d["challenger_team_plays_mae"],
              "team_plays_mae_diff_ci95":d["team_plays_mae_diff_ci95"],
              "baseline_dropback_rate_mae":d["baseline_dropback_rate_mae"],
              "challenger_dropback_rate_mae":d["challenger_dropback_rate_mae"],
              "dropback_rate_mae_diff_ci95":d["dropback_rate_mae_diff_ci95"],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-game-environment
          path: research_outputs/props_v2/game_environment/
          if-no-files-found: error
