name: LevLine V09B roster universe source audit v2

on:
  pull_request:
    paths:
      - 'research/v09b_roster_universe_audit_v2.py'
      - 'research/test_v09b_roster_universe_audit_v2.py'
      - '.github/workflows/research_v09b_roster_universe_audit_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test v1 frozen audit plus v2 identifier/duplicate diagnostics
        run: |
          pytest -q \
            research/test_v09b_roster_universe_audit_v1.py \
            research/test_v09b_roster_universe_audit_v2.py

  source-audit-v2:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        season: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Audit with observed legacy aliases and duplicate-shape diagnostics
        run: |
          mkdir -p research_outputs/v09b_roster_universe_audit_v2
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_roster_universe_audit_v2.py \
              --season ${{ matrix.season }} \
              --output research_outputs/v09b_roster_universe_audit_v2/${{ matrix.season }}.json
      - name: Assert v2 preserves no-label and zero-duplicate boundary
        if: always()
        run: |
          if test -s research_outputs/v09b_roster_universe_audit_v2/${{ matrix.season }}.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          season = '${{ matrix.season }}'
          result = json.loads(Path(f'research_outputs/v09b_roster_universe_audit_v2/{season}.json').read_text())
          assert result['v1_frozen_zero_duplicate_gate_preserved'] is True
          assert result['generic_status_used_for_audit_membership'] is False
          assert result['source_era_status_semantics_qualified'] is False
          assert result['game_day_roster_universe_qualified'] is False
          assert result['player_team_game_identity_qualified'] is False
          assert result['training_label_semantics_qualified'] is False
          assert result['training_source_chronology_qualified'] is False
          assert result['v09b_model_fit_authorized'] is False
          assert result['model_fit_performed'] is False
          assert result['game_outcomes_used'] == 0
          assert result['completed_2026_outcomes_used'] == 0
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v09b-roster-universe-audit-v2-${{ matrix.season }}-${{ github.run_id }}
          path: research_outputs/v09b_roster_universe_audit_v2/${{ matrix.season }}.json
          if-no-files-found: warn
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove v2 remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
