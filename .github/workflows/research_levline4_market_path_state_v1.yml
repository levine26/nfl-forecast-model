name: LevLine 4 market path state

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/market_path_state_v1.py'
      - 'research/test_market_path_state_v1.py'
      - '.github/workflows/research_levline4_market_path_state_v1.yml'

permissions:
  contents: read

jobs:
  market-path-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: pip install '.[dev]'
      - name: Test prospective outcome-blind market path derivative
        run: |
          pytest -q research/test_market_path_state_v1.py
      - name: Prove branch remains research-only
        run: |
          git diff --name-only origin/main...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [p for p in changed if not (p.startswith('research/') or p.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/main...HEAD -- outputs/ site/ src/ scripts/ config/
