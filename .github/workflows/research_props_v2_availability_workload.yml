name: LevLine Props 2.0 availability workload mixture

on:
  pull_request:
    paths:
      - 'research/props/v2/availability_workload_mixture.py'
      - 'research/props/v2/test_availability_workload_mixture.py'
      - 'research/props/v2/run_availability_workload_mixture.py'
      - 'research/props/v2/AVAILABILITY_WORKLOAD_MIXTURE_CONTRACT.md'
      - '.github/workflows/research_props_v2_availability_workload.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate availability mixture research
        run: >-
          python -m pytest -q
          research/props/v2/test_availability_workload_mixture.py

  season_forward:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        season: [2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run workload-state evaluation
        run: |
          python research/props/v2/run_availability_workload_mixture.py \
            --evaluation-season ${{ matrix.season }} \
            --output-dir research_outputs/props_v2/availability_workload/${{ matrix.season }}
      - name: Enforce chronology and no-prop-outcome boundary
        env:
          SEASON: ${{ matrix.season }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          season=int(os.environ["SEASON"])
          p=Path(f"research_outputs/props_v2/availability_workload/{season}/{season}_summary.json")
          d=json.loads(p.read_text())
          assert d["contract_version"]=="levline-props-v2-availability-workload-v0.1.0"
          assert d["trained_through_season"]==season-1
          assert d["prop_outcomes_used_for_fit_or_evaluation"]==0
          assert d["completed_2026_outcomes_used"]==0
          assert d["production_authorized"] is False
          assert d["n"]>0
          print(json.dumps({
              "season":season,
              "n":d["n"],
              "mixture_workload_mae":d["mixture_workload_mae"],
              "active_only_workload_mae":d["active_only_workload_mae"],
              "mixture_minus_active_only_mae":d["mixture_minus_active_only_mae"],
              "mixture_active_brier":d["mixture_active_brier"],
              "active_only_brier":d["active_only_brier"],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-availability-workload-${{ matrix.season }}
          path: research_outputs/props_v2/availability_workload/${{ matrix.season }}/
          if-no-files-found: error
