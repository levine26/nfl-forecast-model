name: LevLine Props 2.0 prospective shadow

on:
  pull_request:
    paths:
      - 'research/props/v2/record_prospective_shadow.py'
      - 'research/props/v2/prospective_shadow_v0_1.json'
      - 'research/props/v2/PROSPECTIVE_MARKET_ANCHOR_SHADOW_CONTRACT.md'
      - 'research/props/v2/test_prospective_shadow.py'
      - '.github/workflows/research_props_v2_prospective_shadow.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main-branch LevLine Props live refresh run ID
        required: true
        type: string
  workflow_run:
    workflows:
      - 'LevLine Props live refresh'
    types:
      - completed

permissions:
  contents: read

env:
  EXACT_SOURCE_RUN_LISTENER_VERSION: levline-props-v2-market-shadow-exact-source-v0.1.0
  LIVE_SOURCE_PROVENANCE_REQUIRED_VERSION: levline-props-live-source-provenance-v0.1.0

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e . pytest
      - name: Validate immutable pregame shadow semantics
        run: python -m pytest -q research/props/v2/test_prospective_shadow.py

  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    concurrency:
      group: levline-props-v2-prospective-shadow
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve exact source live workflow run
        id: source
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID="${{ inputs.source_run_id }}"
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          test -n "$RUN_ID"
          META=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID")
          NAME=$(printf '%s' "$META" | jq -r '.name')
          BRANCH=$(printf '%s' "$META" | jq -r '.head_branch')
          TRIGGER_SHA=$(printf '%s' "$META" | jq -r '.head_sha')
          CONCLUSION=$(printf '%s' "$META" | jq -r '.conclusion')
          if [ "$NAME" != "LevLine Props live refresh" ]; then
            echo "::error::source run is not LevLine Props live refresh: $NAME"
            exit 1
          fi
          if [ "$BRANCH" != "main" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::source run must be successful on main; branch=$BRANCH conclusion=$CONCLUSION"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "trigger_head_sha=$TRIGGER_SHA" >> "$GITHUB_OUTPUT"

      - name: Download and validate exact live source provenance
        id: artifact
        run: |
          set -euo pipefail
          rm -rf /tmp/props-live-artifacts
          mkdir -p /tmp/props-live-artifacts
          gh run download "${{ steps.source.outputs.run_id }}" --repo "${{ github.repository }}" --dir /tmp/props-live-artifacts

          mapfile -t FORECASTS < <(find /tmp/props-live-artifacts -name forecasts.json -type f | sort)
          mapfile -t PROVENANCE < <(find /tmp/props-live-artifacts -name source_provenance.json -type f | sort)
          mapfile -t MARKETS < <(find /tmp/props-live-artifacts -name market.json -type f | sort)
          if [ "${#FORECASTS[@]}" -ne 1 ] || [ "${#PROVENANCE[@]}" -ne 1 ] || [ "${#MARKETS[@]}" -ne 1 ]; then
            echo "::error::source artifact must contain exactly one forecasts.json, source_provenance.json, and market.json"
            exit 1
          fi

          PROV="${PROVENANCE[0]}"
          CONTRACT=$(jq -r '.contract_version // empty' "$PROV")
          PROV_RUN=$(jq -r '.source_workflow_run // empty' "$PROV")
          PROV_TRIGGER=$(jq -r '.trigger_head_sha // empty' "$PROV")
          GENERATION_SHA=$(jq -r '.generation_base_sha // empty' "$PROV")
          PROVIDER=$(jq -r '.market_provider // empty' "$PROV")
          CREDENTIAL_MODE=$(jq -r '.market_credential_mode // empty' "$PROV")
          EXPECTED_FORECAST_SHA=$(jq -r '.forecasts_sha256 // empty' "$PROV")
          EXPECTED_MARKET_SHA=$(jq -r '.market_snapshot_sha256 // empty' "$PROV")
          ACTUAL_FORECAST_SHA=$(sha256sum "${FORECASTS[0]}" | awk '{print $1}')
          ACTUAL_MARKET_SHA=$(sha256sum "${MARKETS[0]}" | awk '{print $1}')
          SNAPSHOT_PROVIDER=$(jq -r '.provider // empty' "${MARKETS[0]}")
          PROVENANCE_SHA=$(sha256sum "$PROV" | awk '{print $1}')

          if [ "$CONTRACT" != "$LIVE_SOURCE_PROVENANCE_REQUIRED_VERSION" ]; then
            echo "::error::unexpected live source provenance contract: $CONTRACT"
            exit 1
          fi
          if [ "$PROV_RUN" != "${{ steps.source.outputs.run_id }}" ]; then
            echo "::error::live source provenance run ID mismatch"
            exit 1
          fi
          if [ "$PROV_TRIGGER" != "${{ steps.source.outputs.trigger_head_sha }}" ]; then
            echo "::error::live source provenance trigger SHA mismatch"
            exit 1
          fi
          if ! [[ "$GENERATION_SHA" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]; then
            echo "::error::invalid generation SHA in live source provenance"
            exit 1
          fi
          if [ -z "$PROVIDER" ] || [ -z "$CREDENTIAL_MODE" ]; then
            echo "::error::live source provenance missing market provider/mode"
            exit 1
          fi
          if [ "$EXPECTED_FORECAST_SHA" != "$ACTUAL_FORECAST_SHA" ]; then
            echo "::error::live source forecast artifact SHA mismatch"
            exit 1
          fi
          if [ "$EXPECTED_MARKET_SHA" != "$ACTUAL_MARKET_SHA" ] || [ "$SNAPSHOT_PROVIDER" != "$PROVIDER" ]; then
            echo "::error::live source market snapshot provenance mismatch"
            exit 1
          fi

          for SHA in "${{ steps.source.outputs.trigger_head_sha }}" "$GENERATION_SHA"; do
            WORKFLOW_B64=$(gh api "repos/${{ github.repository }}/contents/.github/workflows/research_props_v2_prospective_shadow.yml?ref=$SHA" | jq -r '.content // empty')
            if [ -z "$WORKFLOW_B64" ] || \
               ! printf '%s' "$WORKFLOW_B64" | base64 -d | grep -Fq 'LIVE_SOURCE_PROVENANCE_REQUIRED_VERSION: levline-props-live-source-provenance-v0.1.0'; then
              echo "::error::source SHA predates the live-source-provenance market shadow listener: $SHA"
              exit 1
            fi
          done

          echo "forecasts=${FORECASTS[0]}" >> "$GITHUB_OUTPUT"
          echo "generation_sha=$GENERATION_SHA" >> "$GITHUB_OUTPUT"
          echo "market_provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "market_credential_mode=$CREDENTIAL_MODE" >> "$GITHUB_OUTPUT"
          echo "provenance_sha256=$PROVENANCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.artifact.outputs.generation_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Restore immutable research shadow ledger
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/props_v2/prospective_shadow
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          git fetch origin research-data/props-v2-prospective-shadow:refs/remotes/origin/research-data/props-v2-prospective-shadow || true
          if git show-ref --verify --quiet refs/remotes/origin/research-data/props-v2-prospective-shadow; then
            git archive --format=tar origin/research-data/props-v2-prospective-shadow "$DATA_DIR" 2>/dev/null | tar -xf - || true
          fi
          mkdir -p "$DATA_DIR"

      - name: Record exact-run pregame market shadow receipts
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/props_v2/prospective_shadow
          python research/props/v2/record_prospective_shadow.py \
            --forecasts "${{ steps.artifact.outputs.forecasts }}" \
            --config research/props/v2/prospective_shadow_v0_1.json \
            --ledger "$DATA_DIR/challenger_originals.jsonl" \
            --source-workflow-run "${{ steps.source.outputs.run_id }}" \
            --source-head-sha "${{ steps.artifact.outputs.generation_sha }}" \
            --source-trigger-head-sha "${{ steps.source.outputs.trigger_head_sha }}" \
            --source-market-provider "${{ steps.artifact.outputs.market_provider }}" \
            --source-market-credential-mode "${{ steps.artifact.outputs.market_credential_mode }}" \
            --source-provenance-sha256 "${{ steps.artifact.outputs.provenance_sha256 }}" \
            | tee "$DATA_DIR/last_record_status.json"

      - name: Enforce research-only source provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research_outputs/props_v2/prospective_shadow")
          status=json.loads((root/"last_record_status.json").read_text())
          assert status["contract_version"]=="levline-props-v2-prospective-shadow-v0.1.0"
          assert status["production_authorized"] is False
          assert status["winner_model_mutated"] is False
          assert status["published_v1_props_mutated"] is False
          assert status["source_workflow_run"]
          assert len(status["source_head_sha"]) in {40,64}
          assert len(status["source_trigger_head_sha"]) in {40,64}
          assert status["source_market_provider"]
          assert status["source_market_credential_mode"]
          assert len(status["source_provenance_sha256"])==64
          ledger=root/"challenger_originals.jsonl"
          rows=[]
          if ledger.exists():
              rows=[json.loads(line) for line in ledger.read_text().splitlines() if line.strip()]
          current=[
              row for row in rows
              if str(row.get("source_workflow_run"))==str(status["source_workflow_run"])
          ]
          if int(status["appended"])>0:
              assert len(current)>=int(status["appended"])
              assert all(row["source_head_sha"]==status["source_head_sha"] for row in current)
          provenance_fields=(
              "source_trigger_head_sha",
              "source_market_provider",
              "source_market_credential_mode",
              "source_provenance_sha256",
          )
          legacy=0
          for row in rows:
              assert row["source_workflow_run"]
              assert len(str(row["source_head_sha"])) in {40,64}
              present=[bool(str(row.get(field) or "").strip()) for field in provenance_fields]
              if any(present):
                  assert all(present), "partial live-source provenance is invalid"
                  assert len(str(row["source_trigger_head_sha"])) in {40,64}
                  assert len(str(row["source_provenance_sha256"]))==64
              else:
                  legacy+=1
              assert row["governance"]["production_authorized"] is False
              assert "actual_result" not in row
              assert "grading_result" not in row
          for row in current:
              assert row["source_head_sha"]==status["source_head_sha"]
              assert row["source_trigger_head_sha"]==status["source_trigger_head_sha"]
              assert row["source_market_provider"]==status["source_market_provider"]
              assert row["source_market_credential_mode"]==status["source_market_credential_mode"]
              assert row["source_provenance_sha256"]==status["source_provenance_sha256"]
          print(json.dumps({
              "source_workflow_run":status["source_workflow_run"],
              "source_head_sha":status["source_head_sha"],
              "appended":status["appended"],
              "ledger_receipts":len(rows),
              "legacy_pre_provenance_receipts":legacy,
          },indent=2))
          PY

      - name: Persist shadow evidence away from main
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/props_v2/prospective_shadow
          rm -rf /tmp/props_v2_prospective_shadow
          cp -R "$DATA_DIR" /tmp/props_v2_prospective_shadow
          rm -rf "$DATA_DIR"
          git config user.name 'levline-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/research-data/props-v2-prospective-shadow; then
            git checkout -B props-v2-prospective-shadow-data origin/research-data/props-v2-prospective-shadow
          else
            git checkout -B props-v2-prospective-shadow-data
          fi
          mkdir -p research_outputs/props_v2
          rm -rf research_outputs/props_v2/prospective_shadow
          cp -R /tmp/props_v2_prospective_shadow research_outputs/props_v2/prospective_shadow
          git add research_outputs/props_v2/prospective_shadow/
          if git diff --cached --quiet; then
            echo 'Prospective Props shadow ledger unchanged.'
            exit 0
          fi
          git commit -m 'Record immutable Props 2.0 prospective shadows'
          git push origin HEAD:research-data/props-v2-prospective-shadow
