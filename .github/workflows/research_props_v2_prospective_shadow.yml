name: LevLine Props 2.0 prospective shadow

on:
  pull_request:
    paths:
      - 'research/props/v2/record_prospective_shadow.py'
      - 'research/props/v2/prospective_shadow_v0_1.json'
      - 'research/props/v2/PROSPECTIVE_MARKET_ANCHOR_SHADOW_CONTRACT.md'
      - 'research/props/v2/test_prospective_shadow.py'
      - '.github/workflows/research_props_v2_prospective_shadow.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'LevLine Props live refresh'
    types:
      - completed

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Validate immutable pregame shadow semantics
        run: python -m pytest -q research/props/v2/test_prospective_shadow.py

  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: levline-props-v2-prospective-shadow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore immutable research shadow ledger
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/props_v2/prospective_shadow
          mkdir -p "$DATA_DIR"
          git fetch origin research-data/props-v2-prospective-shadow:refs/remotes/origin/research-data/props-v2-prospective-shadow || true
          if git show-ref --verify --quiet refs/remotes/origin/research-data/props-v2-prospective-shadow; then
            for file in challenger_originals.jsonl last_record_status.json; do
              git show "origin/research-data/props-v2-prospective-shadow:$DATA_DIR/$file" > "$DATA_DIR/$file" 2>/dev/null || true
            done
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Record all currently eligible pregame shadow receipts
        run: |
          set -euo pipefail
          test -s outputs/props/forecasts.json
          mkdir -p research_outputs/props_v2/prospective_shadow
          python research/props/v2/record_prospective_shadow.py             --forecasts outputs/props/forecasts.json             --config research/props/v2/prospective_shadow_v0_1.json             --ledger research_outputs/props_v2/prospective_shadow/challenger_originals.jsonl             | tee research_outputs/props_v2/prospective_shadow/last_record_status.json

      - name: Persist shadow evidence away from main
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/props_v2/prospective_shadow
          rm -rf /tmp/props_v2_prospective_shadow
          cp -R "$DATA_DIR" /tmp/props_v2_prospective_shadow
          rm -rf "$DATA_DIR"
          git config user.name 'levline-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/research-data/props-v2-prospective-shadow; then
            git checkout -B props-v2-prospective-shadow-data origin/research-data/props-v2-prospective-shadow
          else
            git checkout -B props-v2-prospective-shadow-data
          fi
          mkdir -p research_outputs/props_v2
          rm -rf research_outputs/props_v2/prospective_shadow
          cp -R /tmp/props_v2_prospective_shadow research_outputs/props_v2/prospective_shadow
          git add research_outputs/props_v2/prospective_shadow/
          if git diff --cached --quiet; then
            echo 'Prospective Props shadow ledger unchanged.'
            exit 0
          fi
          git commit -m 'Record immutable Props 2.0 prospective shadows'
          git push origin HEAD:research-data/props-v2-prospective-shadow
