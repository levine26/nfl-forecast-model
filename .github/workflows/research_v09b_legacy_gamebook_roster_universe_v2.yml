name: LevLine V09B legacy Game Book roster universe V2

on:
  pull_request:
    paths:
      - 'research/availability/v09b_legacy_gamebook_roster_universe_contract_v2.json'
      - 'research/v09b_legacy_gamebook_roster_universe_v2.py'
      - 'research/test_v09b_legacy_gamebook_roster_universe_v2.py'
      - '.github/workflows/research_v09b_legacy_gamebook_roster_universe_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test V1 preservation and V2 duplicate semantics
        run: pytest -q research/test_v09b_legacy_gamebook_roster_universe_v1.py research/test_v09b_legacy_gamebook_roster_universe_v2.py
      - name: Validate evidence-bounded V2 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/availability/v09b_legacy_gamebook_roster_universe_contract_v2.json').read_text())
          assert c['status'] == 'POST_V1_FAILURE_EVIDENCE_BOUNDED_CORRECTION'
          assert c['v1_failure_preservation']['v1_result_preserved'] is True
          assert c['v1_failure_preservation']['v1_active_set_changed_by_duplicate'] is False
          assert c['duplicate_semantics']['repeated_occurrence_within_same_semantic_section'] == 'allowed and diagnostic only'
          assert c['duplicate_semantics']['membership_in_multiple_distinct_active_sections'] == 'hard failure'
          assert c['frozen_audit_gates']['canonical_game_parse_coverage_rate_required'] == 1.0
          assert c['frozen_audit_gates']['team_partition_parse_coverage_rate_required'] == 1.0
          assert c['frozen_audit_gates']['cross_semantic_active_section_conflicts_allowed'] == 0
          assert c['frozen_audit_gates']['active_inactive_overlaps_allowed'] == 0
          assert c['scientific_disclosure']['coverage_thresholds_relaxed'] is False
          assert c['scientific_disclosure']['active_inactive_label_semantics_changed'] is False
          assert c['authorization']['v09b_model_fit_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used'] == 0
          PY

  roster-universe-audit-v2:
    needs: unit-and-contract
    strategy:
      fail-fast: false
      matrix:
        season: [2012, 2013, 2014, 2015, 2016]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install '.[dev]'
      - name: Re-verify source and audit V2 direct roster partitions
        run: |
          ROOT=research_outputs/v09b_legacy_gamebook_roster_universe_v2/${{ matrix.season }}
          mkdir -p "$ROOT"
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_legacy_gamebook_roster_universe_v2.py \
              --season ${{ matrix.season }} \
              --archive-root "$ROOT/archive" \
              --output "$ROOT/receipt.json"
      - name: Assert correction scope and no leakage
        if: always()
        run: |
          p=research_outputs/v09b_legacy_gamebook_roster_universe_v2/${{ matrix.season }}/receipt.json
          if test -s "$p"; then
            python - <<'PY'
          import json
          from pathlib import Path
          season = '${{ matrix.season }}'
          r = json.loads(Path(f'research_outputs/v09b_legacy_gamebook_roster_universe_v2/{season}/receipt.json').read_text())
          assert r['v1_failure_preserved'] is True
          assert r['coverage_thresholds_relaxed_from_v1'] is False
          assert r['label_semantics_changed_from_v1'] is False
          assert r['cross_semantic_active_section_conflicts'] == 0
          assert r['active_inactive_overlaps'] == 0
          assert r['weekly_roster_status_used_to_define_membership'] is False
          assert r['postgame_participation_used_to_define_membership'] is False
          assert r['player_team_game_identity_qualified'] is False
          assert r['training_label_semantics_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['model_fit_performed'] is False
          assert r['game_outcomes_used'] == 0
          assert r['completed_2026_outcomes_used'] == 0
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v09b-legacy-gamebook-roster-universe-v2-${{ matrix.season }}-${{ github.run_id }}
          path: research_outputs/v09b_legacy_gamebook_roster_universe_v2/${{ matrix.season }}/receipt.json
          if-no-files-found: warn
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove V2 remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
