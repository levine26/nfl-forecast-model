name: LevLine M1 prospective market state v1

on:
  pull_request:
    paths:
      - 'research/m1_market_contract_v1.py'
      - 'research/m1_market_capture_due_v1.py'
      - 'research/m1_market_state_v1.py'
      - 'research/run_m1_market_capture_v1.py'
      - 'research/test_m1_market_state_v1.py'
      - 'research/test_run_m1_market_capture_v1.py'
      - 'research/ats-frontier-v2/M1_*'
      - '.github/workflows/research_m1_market_state_v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install M1 research dependencies
        run: python -m pip install pytest 'pandas==3.0.5' 'numpy==2.4.6' 'requests>=2.32'
      - name: Validate frozen M1 information boundary and identity semantics
        run: >-
          python -m pytest -q
          research/test_m1_market_state_v1.py
          research/test_run_m1_market_capture_v1.py
      - name: Prove predictor registry excludes diagnostic horizons
        run: |
          python - <<'PY'
          from research.m1_market_contract_v1 import PREDICTOR_FEATURE_COLUMNS, DIAGNOSTIC_ONLY_PREFIXES
          assert all(not name.startswith(DIAGNOSTIC_ONLY_PREFIXES) for name in PREDICTOR_FEATURE_COLUMNS)
          PY

  capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: levline-m1-market-state-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cheap local M1 horizon gate
        id: gate
        run: |
          RESULT=$(python -m research.m1_market_capture_due_v1)
          echo "$RESULT"
          if echo "$RESULT" | grep -q '^due=true'; then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          else
            echo 'due=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore append-only M1 ledger
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        run: |
          set -euo pipefail
          git fetch origin research-data/m1-market-state-v1:refs/remotes/origin/research-data/m1-market-state-v1 || true
          mkdir -p research_outputs/m1_market_state_v1
          if git show-ref --verify --quiet refs/remotes/origin/research-data/m1-market-state-v1; then
            for file in market_snapshots.csv status.json predictor_rows.csv diagnostic_rows.csv audit.json; do
              git show "origin/research-data/m1-market-state-v1:research_outputs/m1_market_state_v1/$file" \
                > "research_outputs/m1_market_state_v1/$file" 2>/dev/null || true
            done
          fi

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research dependencies
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        run: |
          python -m pip install 'pandas==3.0.5' 'numpy==2.4.6' 'requests>=2.32'
          python -m pip install -e . --no-deps

      - name: Capture M1 point-in-time market state
        id: capture
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        continue-on-error: true
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python -m research.run_m1_market_capture_v1 --quota-reserve 50

      - name: Derive M1 predictor and diagnostic artifacts
        if: (github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true') && steps.capture.outcome == 'success'
        run: python -m research.m1_market_state_v1

      - name: Persist M1 research evidence off main
        if: always() && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true')
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/m1_market_state_v1
          if [ ! -d "$DATA_DIR" ]; then
            echo 'No M1 research data to persist.'
            exit 0
          fi
          rm -rf /tmp/m1_market_state_v1
          cp -R "$DATA_DIR" /tmp/m1_market_state_v1
          rm -rf "$DATA_DIR"
          git config user.name 'levline-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/research-data/m1-market-state-v1; then
            git checkout -B m1-market-state-v1-data origin/research-data/m1-market-state-v1
          else
            git checkout -B m1-market-state-v1-data
          fi
          mkdir -p research_outputs
          rm -rf research_outputs/m1_market_state_v1
          cp -R /tmp/m1_market_state_v1 research_outputs/m1_market_state_v1
          git add research_outputs/m1_market_state_v1/
          if git diff --cached --quiet; then
            echo 'M1 research ledger unchanged.'
            exit 0
          fi
          git commit -m 'Capture prospective M1 market state'
          git push origin HEAD:research-data/m1-market-state-v1

      - name: Surface capture failure after preserving evidence
        if: always() && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true')
        run: |
          if [ "${{ steps.capture.outcome }}" != 'success' ]; then
            echo 'M1 capture failed; preserved evidence remains research-only.' >&2
            exit 1
          fi
