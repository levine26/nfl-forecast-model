name: LevLine 4 NGS player ID browser held-out V3

on:
  pull_request:
    paths:
      - 'research/levline4_2026_ngs_player_id_browser_heldout_v3_contract.json'
      - 'research/levline4_2026_ngs_player_id_browser_heldout_v3.py'
      - 'research/test_levline4_2026_ngs_player_id_browser_heldout_v3.py'
      - 'research/levline4_2026_ngs_player_id_browser_heldout_v3_first_result_manifest.json'
      - '.github/workflows/research_levline4_2026_ngs_player_id_browser_heldout_v3.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: levline4-ngs-player-id-browser-heldout-v3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  FROZEN_CONTRACT_COMMIT: '6a62f766180ba5a5e8d1af1daf667dcf4d9ae0b5'
  CONTRACT_PATH: 'research/levline4_2026_ngs_player_id_browser_heldout_v3_contract.json'
  MANIFEST_PATH: 'research/levline4_2026_ngs_player_id_browser_heldout_v3_first_result_manifest.json'
  ROSTER_ARTIFACT_ID: '10461126275'
  ROSTER_WORKFLOW_RUN_ID: '35130069924'
  ROSTER_HEAD_SHA: '1280e4a06eacf3e30700f75d4dab9ecff99944a4'
  ROSTER_ARTIFACT_DIGEST: 'sha256:7ba9c87c8de3392505327e572cf6730d901113d2c22ca25daef3a3dc8a01fe3e'
  ROSTER_METADATA_SHA256: '90c3974677862b8838acf2afaf6bec07087ce9784a7ab01491d8dcfd1f41489f'
  V2_ARTIFACT_ID: '10471546654'
  V2_WORKFLOW_RUN_ID: '35157178143'
  V2_HEAD_SHA: '00dc6765d781c83db657ee10172eb3000097703a'
  V2_ARTIFACT_DIGEST: 'sha256:c7bce3e329fa21e0d0ae9d627a89273fd52bb03ed66fff9c5dad54b2ac78db33'
  V2_TARGET_SELECTION_SHA256: '3e96d2f85b090a619b9c6bb85e64ce68e94ce374f24311d5c75103a2f84b6378'

jobs:
  mode:
    runs-on: ubuntu-24.04
    outputs:
      frozen: ${{ steps.mode.outputs.frozen }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        run: |
          if [ -f "$MANIFEST_PATH" ]; then
            echo 'frozen=true' >> "$GITHUB_OUTPUT"
          else
            echo 'frozen=false' >> "$GITHUB_OUTPUT"
          fi

  preregistration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove frozen V3 contract predates executable, tests, and workflow
        run: |
          set -euo pipefail
          git cat-file -e "${FROZEN_CONTRACT_COMMIT}^{commit}"
          git merge-base --is-ancestor "$FROZEN_CONTRACT_COMMIT" HEAD
          frozen_blob=$(git rev-parse "${FROZEN_CONTRACT_COMMIT}:${CONTRACT_PATH}")
          current_blob=$(git rev-parse "HEAD:${CONTRACT_PATH}")
          test "$frozen_blob" = "$current_blob"
          test "$FROZEN_CONTRACT_COMMIT" = "$(git log -1 --format=%H -- "$CONTRACT_PATH")"
          test "$FROZEN_CONTRACT_COMMIT" != "$(git log -1 --format=%H -- research/levline4_2026_ngs_player_id_browser_heldout_v3.py)"
          test "$FROZEN_CONTRACT_COMMIT" != "$(git log -1 --format=%H -- research/test_levline4_2026_ngs_player_id_browser_heldout_v3.py)"
          test "$FROZEN_CONTRACT_COMMIT" != "$(git log -1 --format=%H -- .github/workflows/research_levline4_2026_ngs_player_id_browser_heldout_v3.yml)"
      - name: Install lightweight test dependency
        run: python -m pip install pytest
      - name: Unit-test frozen V3 transport and resolver semantics
        run: python -m pytest -q research/test_levline4_2026_ngs_player_id_browser_heldout_v3.py
      - name: Prove research-only diff
        run: |
          set -euo pipefail
          git fetch origin main --depth=100
          bad=$(git diff --name-only origin/main...HEAD | grep -Ev '^(research/|\.github/workflows/research_)' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi

  live-heldout:
    if: needs.mode.outputs.frozen == 'false'
    needs: [mode, preregistration]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove this is the unfrozen canonical first-result path
        run: |
          set -euo pipefail
          test ! -f "$MANIFEST_PATH"
          test "$FROZEN_CONTRACT_COMMIT" = "$(git log -1 --format=%H -- "$CONTRACT_PATH")"
          git merge-base --is-ancestor "$FROZEN_CONTRACT_COMMIT" HEAD
      - name: Download pinned roster and frozen V2 target evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          roster_meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ROSTER_ARTIFACT_ID}")
          test "$(echo "$roster_meta" | jq -r .digest)" = "$ROSTER_ARTIFACT_DIGEST"
          test "$(echo "$roster_meta" | jq -r .workflow_run.id)" = "$ROSTER_WORKFLOW_RUN_ID"
          test "$(echo "$roster_meta" | jq -r .workflow_run.head_sha)" = "$ROSTER_HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ROSTER_ARTIFACT_ID}/zip" > /tmp/roster_v2.zip
          rm -rf /tmp/roster_v2
          mkdir -p /tmp/roster_v2
          unzip -q /tmp/roster_v2.zip -d /tmp/roster_v2
          test "$(sha256sum /tmp/roster_v2/roster_metadata.jsonl | awk '{print $1}')" = "$ROSTER_METADATA_SHA256"

          v2_meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${V2_ARTIFACT_ID}")
          test "$(echo "$v2_meta" | jq -r .digest)" = "$V2_ARTIFACT_DIGEST"
          test "$(echo "$v2_meta" | jq -r .workflow_run.id)" = "$V2_WORKFLOW_RUN_ID"
          test "$(echo "$v2_meta" | jq -r .workflow_run.head_sha)" = "$V2_HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${V2_ARTIFACT_ID}/zip" > /tmp/ngs_v2.zip
          rm -rf /tmp/ngs_v2
          mkdir -p /tmp/ngs_v2
          unzip -q /tmp/ngs_v2.zip -d /tmp/ngs_v2
          test "$(sha256sum /tmp/ngs_v2/target_selection.json | awk '{print $1}')" = "$V2_TARGET_SELECTION_SHA256"
      - name: Prove exact V2 70-target population before any V3 NGS request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.levline4_2026_ngs_player_id_browser_heldout_v3 import load_jsonl, select_targets

          contract=json.loads(Path('research/levline4_2026_ngs_player_id_browser_heldout_v3_contract.json').read_text())
          rows=load_jsonl(Path('/tmp/roster_v2/roster_metadata.jsonl'))
          targets,diag=select_targets(rows,contract)
          frozen_v2=json.loads(Path('/tmp/ngs_v2/target_selection.json').read_text())
          assert targets == frozen_v2['targets']
          assert diag == frozen_v2['selection_diagnostics']
          assert len(targets)==70
          assert diag['coverage_target_count']==64
          assert diag['source_name_ambiguity_target_count']==6
          assert diag['source_name_ambiguity_group_count']==3
          assert diag['overlap_count']==0
          assert sorted(diag['ambiguity_groups'])==['byron young','devonta smith','marcus harris']
          print(json.dumps(diag,indent=2,sort_keys=True))
          PY
      - name: Install browser dependency
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Execute canonical first browser-context V3 once
        id: execute
        continue-on-error: true
        run: |
          set +e
          rm -rf research_outputs/levline4_2026_ngs_player_id_browser_heldout_v3
          python research/levline4_2026_ngs_player_id_browser_heldout_v3.py \
            --contract "$CONTRACT_PATH" \
            --roster-metadata /tmp/roster_v2/roster_metadata.jsonl \
            --output-dir research_outputs/levline4_2026_ngs_player_id_browser_heldout_v3 \
            > /tmp/v3_execution.log 2>&1
          code=$?
          mkdir -p research_outputs/levline4_2026_ngs_player_id_browser_heldout_v3
          cp /tmp/v3_execution.log research_outputs/levline4_2026_ngs_player_id_browser_heldout_v3/execution.log
          echo "$code" > research_outputs/levline4_2026_ngs_player_id_browser_heldout_v3/execution_exit_code.txt
          cat /tmp/v3_execution.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Verify governance boundary before artifact upload
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_outputs/levline4_2026_ngs_player_id_browser_heldout_v3')
          receipt=json.loads((root/'receipt.json').read_text())
          assert receipt['contract_id']=='LEVLINE-4-2026-NGS-PLAYER-ID-BROWSER-HELDOUT-V3'
          assert receipt['target_selection']['total_target_count']==70
          assert receipt['target_selection']['coverage_target_count']==64
          assert receipt['target_selection']['source_name_ambiguity_target_count']==6
          assert receipt['browser_transport']['manual_headers_or_credentials_used'] is False
          assert receipt['browser_transport']['browser_storage_state_persisted'] is False
          assert receipt['browser_transport']['direct_http_fallback_used'] is False
          assert receipt['browser_transport']['explicit_retry_used'] is False
          assert receipt['completed_2026_outcomes_used_for_design_or_selection']==0
          assert receipt['postgame_participation_used'] is False
          assert receipt['week2_inactive_execution_evidence_used_for_design'] is False
          assert receipt['f_st_01_frozen_2026_unchanged'] is True
          assert receipt['research_only'] is True
          assert receipt['production_paths_changed'] is False
          for key in ('general_2026_player_identity_to_gsis_qualified','week2_sunday_due_inactive_player_identity_to_gsis_qualified','availability_state_authorized','forecast_probability_effect_authorized','model_fit_authorized','production_authorized'):
              assert receipt['authority'][key] is False, key
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
      - name: Upload immutable canonical first V3 artifact even on scientific FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levline4-ngs-player-id-browser-heldout-v3-first-${{ github.run_id }}
          path: research_outputs/levline4_2026_ngs_player_id_browser_heldout_v3/
          if-no-files-found: error
          retention-days: 30
      - name: Surface canonical scientific disposition after artifact upload
        if: always()
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          EXECUTE_EXIT_CODE: ${{ steps.execute.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$EXECUTE_OUTCOME" = 'success'
          test "${EXECUTE_EXIT_CODE:-1}" = '0'
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('research_outputs/levline4_2026_ngs_player_id_browser_heldout_v3/receipt.json').read_text())
          if receipt['status'] != 'PASS':
              raise SystemExit('Canonical first V3 result is scientifically FAIL; freeze this artifact and version up before any adaptation.')
          assert all(receipt['gates'].values())
          a=receipt['authority']
          assert a['ngs_public_page_browser_context_transport_qualified_for_frozen_official_roster_v2_population'] is True
          assert a['ngs_exact_display_name_plus_team_resolver_qualified_for_frozen_official_roster_v2_population'] is True
          assert a['official_roster_to_ngs_gsis_candidate_bridge_qualified_for_separately_preregistered_heldout_application'] is True
          for key in ('ngs_endpoint_as_independent_or_stable_production_api_qualified','ngs_is_independent_player_identity_ground_truth','general_2026_player_identity_to_gsis_qualified','week2_sunday_due_inactive_player_identity_to_gsis_qualified','game_day_membership_qualified','availability_state_authorized','player_value_join_authorized','forecast_probability_effect_authorized','model_fit_authorized','production_authorized'):
              assert a[key] is False, key
          PY

  replay-canonical-first-result:
    if: needs.mode.outputs.frozen == 'true'
    needs: [mode, preregistration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read immutable first-result coordinates
        id: manifest
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          m=json.loads(Path('research/levline4_2026_ngs_player_id_browser_heldout_v3_first_result_manifest.json').read_text())
          assert m['contract_id']=='LEVLINE-4-2026-NGS-PLAYER-ID-BROWSER-HELDOUT-V3'
          assert m['first_result_is_canonical'] is True
          assert m['later_same_version_execution_may_replace_first_result'] is False
          assert m['same_version_rule_adaptation_after_first_result'] is False
          print(f"artifact_id={m['first_artifact_id']}")
          print(f"artifact_digest={m['artifact_digest']}")
          print(f"workflow_run_id={m['first_workflow_run_id']}")
          print(f"head_sha={m['first_head_sha']}")
          PY
      - name: Download and verify immutable canonical V3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.manifest.outputs.artifact_id }}")
          test "$(echo "$meta" | jq -r .digest)" = "${{ steps.manifest.outputs.artifact_digest }}"
          test "$(echo "$meta" | jq -r .workflow_run.id)" = "${{ steps.manifest.outputs.workflow_run_id }}"
          test "$(echo "$meta" | jq -r .workflow_run.head_sha)" = "${{ steps.manifest.outputs.head_sha }}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.manifest.outputs.artifact_id }}/zip" > /tmp/ngs_v3.zip
          rm -rf /tmp/ngs_v3
          mkdir -p /tmp/ngs_v3
          unzip -q /tmp/ngs_v3.zip -d /tmp/ngs_v3
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('research/levline4_2026_ngs_player_id_browser_heldout_v3_first_result_manifest.json').read_text())
          root=Path('/tmp/ngs_v3')
          observed={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert observed==m['file_sha256']
          receipt=json.loads((root/'receipt.json').read_text())
          assert receipt['status']==m['first_result_status']
          assert receipt['authority']==m['authority']
          assert receipt['completed_2026_outcomes_used_for_design_or_selection']==0
          assert receipt['postgame_participation_used'] is False
          assert receipt['week2_inactive_execution_evidence_used_for_design'] is False
          assert receipt['f_st_01_frozen_2026_unchanged'] is True
          assert receipt['research_only'] is True
          assert receipt['production_paths_changed'] is False
          PY

  research-firewall:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove research-only scope
        run: |
          git fetch origin main --depth=100
          git diff --name-only origin/main...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed=[x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad=[x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/main...HEAD -- outputs/ site/ src/ scripts/ config/
