name: Bootstrap portable F-ST production branch

on:
  push:
    branches:
      - feat/deploy-fst-production-current
    paths:
      - '.github/workflows/fst_bootstrap_portable_production.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deploy-fst-production-current
          fetch-depth: 0
      - name: Transplant validated production integration files only
        run: |
          set -euo pipefail
          git fetch origin feat/deploy-fst-production:refs/remotes/origin/feat/deploy-fst-production
          paths=(
            src/nfl_forecast/fst_nested_pure.py
            src/nfl_forecast/fst_production.py
            src/nfl_forecast/fst_diagnostics.py
            src/nfl_forecast/pipeline.py
            src/nfl_forecast/publish.py
            src/nfl_forecast/probability_strategy.py
            scripts/refresh_market.py
            scripts/run_week.py
            scripts/validate_fst_production_canary.py
            site/src/fst-production-presentation.js
            site/src/main.jsx
            tests/test_fst_market_refresh.py
            tests/test_fst_public_methodology.py
            tests/test_fst_production.py
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "origin/feat/deploy-fst-production:$path" > "$path"
          done
      - name: Recover exact keyed pre-fit artifacts from forensic run
        run: |
          set -euo pipefail
          rm -rf /tmp/fst-recovered /tmp/fst.zip
          mkdir -p /tmp/fst-recovered src/nfl_forecast/artifacts
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10176440471/zip" > /tmp/fst.zip
          unzip -q /tmp/fst.zip -d /tmp/fst-recovered
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, re

          root = Path('/tmp/fst-recovered')
          out = Path('src/nfl_forecast/artifacts')
          base = root / 'base_oof_keyed.csv'
          train = root / 'training_frame_keyed.csv'
          result = root / 'result_SKYLAKEX.json'
          for path in (base, train, result):
              if not path.exists():
                  raise SystemExit(f'missing forensic artifact: {path}')

          payload = json.loads(result.read_text())
          expected = {
              'candidate_id': 'F-ST-01-FROZEN-2026',
              'training_data_sha256': '6a26713b636a98298bb619982bb38b2e5dbb78816e093e6f910c1cee32ab5aa0',
              'training_games': 1615,
              'training_first_season': 2020,
              'training_last_season': 2025,
              'intercept': -0.06954359363166639,
              'market_logit_coefficient': 1.1939087340527093,
              'pure_logit_coefficient': -0.19342747983803402,
          }
          actual = payload['actual']
          for key in ('candidate_id','training_data_sha256','training_games','training_first_season','training_last_season'):
              if actual[key] != expected[key]:
                  raise SystemExit((key, actual[key], expected[key]))
          coefficient_deltas = {
              key: abs(float(actual[key]) - float(expected[key]))
              for key in ('intercept','market_logit_coefficient','pure_logit_coefficient')
          }
          if max(coefficient_deltas.values()) > 1e-12:
              raise SystemExit(f'forensic coefficient parity failed: {coefficient_deltas}')
          runtime = payload['runtime']
          if str(runtime.get('probe_coretype')) != 'SKYLAKEX':
              raise SystemExit('wrong forensic runtime artifact')
          if str(runtime.get('github_run_id')) != '34538432305':
              raise SystemExit('wrong forensic workflow run')
          if str(runtime.get('github_sha')) != '9c4f45e15d27187c637002b3d4d8df2cc34c744e':
              raise SystemExit('wrong forensic execution SHA')

          expected_raw = {
              base.name: '5563b2c9eeb193891ad0ae3809f3fcc9fac04b6451376fc28fa5888c070a78fa',
              train.name: '174be982d5ac7f3e9f93bda824641eae95c612ec0c1e9546472479a5f6cb55d5',
          }
          specs = [
              (base, 'F-ST-01-FROZEN-2026-base-oof-keyed.csv.gz.b64.part', 'BASE_OOF'),
              (train, 'F-ST-01-FROZEN-2026-training-frame-keyed.csv.gz.b64.part', 'TRAINING'),
          ]
          compressed_hashes = {}
          for source, prefix, key in specs:
              raw = source.read_bytes()
              raw_sha = hashlib.sha256(raw).hexdigest()
              if raw_sha != expected_raw[source.name]:
                  raise SystemExit(f'raw hash mismatch: {source} {raw_sha}')
              compressed = gzip.compress(raw, mtime=0)
              compressed_hashes[key] = hashlib.sha256(compressed).hexdigest()
              encoded = base64.b64encode(compressed).decode('ascii')
              for old in out.glob(prefix + '*'):
                  old.unlink()
              for i, start in enumerate(range(0, len(encoded), 25000)):
                  (out / f'{prefix}{i:02d}').write_text(
                      encoded[start:start+25000] + '\n', encoding='ascii'
                  )

          loader_path = Path('src/nfl_forecast/fst_nested_pure.py')
          loader = loader_path.read_text(encoding='utf-8')
          loader = re.sub(
              r'RECOVERED_BASE_OOF_GZIP_SHA256 = "[0-9a-f]{64}"',
              f'RECOVERED_BASE_OOF_GZIP_SHA256 = "{compressed_hashes["BASE_OOF"]}"',
              loader,
          )
          loader = re.sub(
              r'RECOVERED_TRAINING_GZIP_SHA256 = "[0-9a-f]{64}"',
              f'RECOVERED_TRAINING_GZIP_SHA256 = "{compressed_hashes["TRAINING"]}"',
              loader,
          )
          loader_path.write_text(loader, encoding='utf-8')

          manifest = {
              'candidate_id': 'F-ST-01-FROZEN-2026',
              'status': 'production_frozen',
              'production_promotion_authorized': True,
              'production_authorization_scope': 'F-ST-01-FROZEN-2026 only',
              'target_season': 2026,
              'training_cutoff': 2025,
              '2026_outcomes_used_in_fitting': 0,
              'intercept': expected['intercept'],
              'market_logit_coefficient': expected['market_logit_coefficient'],
              'pure_logit_coefficient': expected['pure_logit_coefficient'],
              'training_games': 1615,
              'training_first_season': 2020,
              'training_last_season': 2025,
              'training_data_sha256': expected['training_data_sha256'],
              'C': 1.0,
              'penalty': 'l2',
              'solver': 'lbfgs',
              'max_iter': 3000,
              'probability_clip': [0.000001, 0.999999],
              'nested_pure': {
                  'base_oof_start_season': 2018,
                  'base_oof_end_season': 2025,
                  'base_oof_rows': 2127,
                  'base_models': ['logistic','extra_trees','xgboost','catboost'],
                  'meta_model': 'logistic_regression',
                  'meta_C': 0.5,
                  'meta_max_iter': 3000,
                  'random_state': 26,
                  'feature_set': 'production_compatible_core',
                  'live_training_outcome_cutoff': 2025,
              },
              'immutable_recovered_inputs': {
                  'capture_context': 'prospective_shadow_reconstruction',
                  'forensic_workflow_run': 34538432305,
                  'forensic_artifact_id': 10176440471,
                  'forensic_branch_head_sha': '31cea3037b0c4bb75364d78c072af9d4fb25a9dc',
                  'forensic_execution_sha': '9c4f45e15d27187c637002b3d4d8df2cc34c744e',
                  'base_oof_raw_sha256': expected_raw[base.name],
                  'training_frame_raw_sha256': expected_raw[train.name],
                  'base_oof_packaged_sha256': compressed_hashes['BASE_OOF'],
                  'training_frame_packaged_sha256': compressed_hashes['TRAINING'],
                  'base_oof_serialized_sequence_sha256': '5f4eda7d5df86ab13e4d6a6b90653be3160bd857e00eb1d412eae0e78eb2c7b3',
                  'base_oof_game_id_sequence_sha256': 'dff495fa86c9c53b1a76213afcb351c01ed691db9c225bdd911717ccd2ce236c',
                  'training_serialized_sequence_sha256': '0716b93e01eaba82c8b807b26d75a2b35558a4be162461b9d0bfd43d43d0a3ab',
                  'training_game_id_sequence_sha256': 'd23d72a2c1226a3dd23ffab6dd2c783f96e76f772f73ca649e687a09b248f209',
                  'reconstruction_only': True,
                  'original_freeze_capture_claimed': False,
                  'reconstruction_note': 'Post-freeze forensic reconstruction persisted as immutable production inputs; it is not relabeled as an original pre-fit freeze capture.',
                  'recovered_runtime_evidence': {
                      'python_version': '3.11.16',
                      'openblas_coretype': 'SKYLAKEX',
                      'blas_threads': 4,
                  },
              },
              'freeze_timestamp_utc': '2026-09-10T05:08:04Z',
              'freeze_implementation_sha': '59830d23e406d32c34e74919b31d0dd9f85b16ca',
              'research_runtime_artifact_sha': 'f3299a595d3a8cee3a7fdd6b367c493c8420a08c',
              'rollback_strategy': 'current_production_75_25',
          }
          (out / 'F-ST-01-FROZEN-2026.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          print('forensic coefficient deltas', coefficient_deltas)
          print('packaged hashes', compressed_hashes)
          PY
      - name: Commit transplanted production code and immutable inputs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/nfl_forecast/fst_nested_pure.py \
            src/nfl_forecast/fst_production.py \
            src/nfl_forecast/fst_diagnostics.py \
            src/nfl_forecast/pipeline.py \
            src/nfl_forecast/publish.py \
            src/nfl_forecast/probability_strategy.py \
            src/nfl_forecast/artifacts/F-ST-01-FROZEN-2026.json \
            src/nfl_forecast/artifacts/F-ST-01-FROZEN-2026-base-oof-keyed.csv.gz.b64.part* \
            src/nfl_forecast/artifacts/F-ST-01-FROZEN-2026-training-frame-keyed.csv.gz.b64.part* \
            scripts/refresh_market.py \
            scripts/run_week.py \
            scripts/validate_fst_production_canary.py \
            site/src/fst-production-presentation.js \
            site/src/main.jsx \
            tests/test_fst_market_refresh.py \
            tests/test_fst_public_methodology.py \
            tests/test_fst_production.py
          if git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
            exit 0
          fi
          git commit -m 'Transplant portable frozen F-ST production integration'
          git push origin HEAD:feat/deploy-fst-production-current
