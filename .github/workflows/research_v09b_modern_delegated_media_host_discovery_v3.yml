name: LevLine V09B modern delegated media-host discovery V3

on:
  pull_request:
    paths:
      - 'research/availability/v09b_modern_delegated_media_host_discovery_v3_contract.json'
      - 'research/v09b_modern_delegated_media_host_discovery_v3.py'
      - 'research/test_v09b_modern_delegated_media_host_discovery_v3.py'
      - '.github/workflows/research_v09b_modern_delegated_media_host_discovery_v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-v09b-modern-delegated-media-v3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - run: pytest -q research/test_v09b_modern_delegated_media_host_discovery_v3.py
      - name: Validate frozen diagnostic authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('research/availability/v09b_modern_delegated_media_host_discovery_v3_contract.json').read_text())
          assert c['status']=='PREREGISTERED_DELEGATION_PROVENANCE_DIAGNOSTIC_ONLY_NO_SOURCE_OR_LOCATOR_AUTHORITY'
          assert len(c['fixed_delegations'])==3
          assert c['required_accounting']['team_season_pairs_expected']==15
          assert c['delegation_requirements']['unobserved_vendor_hosts_forbidden'] is True
          assert c['delegation_requirements']['delegation_does_not_create_source_authority'] is True
          assert c['explicit_non_gates']['delegated_host_is_first_party_authority'] is False
          assert c['authority']['diagnostic_has_source_qualification_authority'] is False
          assert c['authority']['v09b_model_fit_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used']==0
          PY

  delegated-host-diagnostic:
    needs: unit-and-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Audit exact observed delegation paths and bounded delegated indexes
        run: |
          OUT=research_outputs/v09b_modern_delegated_media_host_discovery_v3/result.json
          mkdir -p "$(dirname "$OUT")"
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_modern_delegated_media_host_discovery_v3.py \
              --contract research/availability/v09b_modern_delegated_media_host_discovery_v3_contract.json \
              --output "$OUT" --timeout 12
      - name: Assert accounting and authority firewall only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research_outputs/v09b_modern_delegated_media_host_discovery_v3/result.json').read_text())
          assert r['delegations_reported']==3
          assert r['team_season_pairs_reported']==15
          assert r['accounting_integrity_pass'] is True
          assert r['diagnostic_has_source_qualification_authority'] is False
          assert r['diagnostic_has_locator_qualification_authority'] is False
          assert r['diagnostic_has_membership_authority'] is False
          assert r['delegated_host_is_first_party_authority'] is False
          assert r['modern_roster_depth_locator_coverage_qualified'] is False
          assert r['all_2592_team_game_partitions_tested'] is False
          assert r['modern_game_day_roster_universe_qualified'] is False
          assert r['modern_player_team_game_identity_qualified'] is False
          assert r['training_label_semantics_qualified'] is False
          assert r['training_source_chronology_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['weekly_roster_status_used'] is False
          assert r['completed_2026_outcomes_used']==0
          assert r['model_fit_performed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v09b-modern-delegated-media-host-discovery-v3-${{ github.run_id }}
          path: research_outputs/v09b_modern_delegated_media_host_discovery_v3/result.json
          if-no-files-found: error
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed=[x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad=[x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
