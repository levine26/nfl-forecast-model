name: Launch patch pressure uniqueness

on:
  push:
    branches: [launch/copilot-factual-composition]
    paths:
      - '.github/workflows/_launch_patch_pressure_uniqueness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/copilot-factual-composition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make pressure fallback matchup-unique
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/nfl_forecast/media_editorial.py')
          text = path.read_text()
          old = (
              '                    f"The {protected_name} allowed sacks on {sack_rate}% of pass plays last season; the {rusher_name} generated sacks on {pressure_rate}%. "\n'
              '                    f"The {protected_name} need clean early downs to keep the {rusher_name} out of favorable rush situations, while the {rusher_name} want to force the {protected_name} into obvious passing downs."\n'
          )
          new = (
              '                    f"For {protected_name}, sacks allowed were {sack_rate}% on {protected_name} pass plays last season. "\n'
              '                    f"For {rusher_name}, sacks generated were {pressure_rate}% on {rusher_name} opponent pass plays last season. "\n'
              '                    f"{protected_name} protection wants clean early downs. {rusher_name} pressure wants obvious passing downs."\n'
          )
          if old not in text:
              raise SystemExit('expected pressure prose block not found; refusing stale patch')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('tests/test_read_contract.py')
          tests = test_path.read_text()
          old_asserts = (
              '    assert "The Chiefs need clean early downs" in paragraph1\n'
              '    assert "the Broncos want to force the Chiefs" in paragraph1\n'
          )
          new_asserts = (
              '    assert "Chiefs protection wants clean early downs" in paragraph1\n'
              '    assert "Broncos pressure wants obvious passing downs" in paragraph1\n'
          )
          if old_asserts not in tests:
              raise SystemExit('expected pressure assertions not found; refusing stale patch')
          tests = tests.replace(old_asserts, new_asserts, 1)
          marker = 'def test_pressure_fallbacks_share_no_seven_word_template_spans():'
          if marker not in tests:
              tests += (
                  '\n\n\ndef test_pressure_fallbacks_share_no_seven_word_template_spans():\n'
                  '    cases = [\n'
                  '        ("ARI", "LAC", "LAC gave up sacks on 6.2% of pass plays last season; ARI got home on 9.4%."),\n'
                  '        ("ATL", "PIT", "ATL gave up sacks on 7.2% of pass plays last season; PIT got home on 10.4%."),\n'
                  '        ("NYJ", "TEN", "NYJ gave up sacks on 5.2% of pass plays last season; TEN got home on 8.4%."),\n'
                  '    ]\n'
                  '    paragraphs = []\n'
                  '    for away, home, summary in cases:\n'
                  '        item = {\n'
                  '            "title": f"{home} protection vs {away} pass rush",\n'
                  '            "summary": summary,\n'
                  '            "metadata": {"family": "pressure"},\n'
                  '        }\n'
                  '        paragraphs.append(_football_preview(away, home, item)[1])\n'
                  '\n'
                  '    grams = [_seven_grams(paragraph) for paragraph in paragraphs]\n'
                  '    for i in range(len(grams)):\n'
                  '        for j in range(i + 1, len(grams)):\n'
                  '            assert not grams[i].intersection(grams[j])\n'
              )
          test_path.write_text(tests)
          PY
      - name: Run focused regression
        run: |
          pip install -e '.[dev]'
          pytest -q tests/test_read_contract.py tests/test_editorial_voice_compact.py
      - name: Commit source and regression
        run: |
          set -euo pipefail
          git config user.name "launch-readiness-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/nfl_forecast/media_editorial.py tests/test_read_contract.py
          git commit -m "Make pressure fallback prose matchup-unique"
          git push origin HEAD:launch/copilot-factual-composition
