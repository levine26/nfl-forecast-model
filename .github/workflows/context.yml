name: Sunday Signal contextual intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/nfl_forecast/context.py"
      - "src/nfl_forecast/context_plus.py"
      - "src/nfl_forecast/coaching.py"
      - "src/nfl_forecast/qb_history.py"
      - "src/nfl_forecast/injuries.py"
      - "src/nfl_forecast/personnel_impact.py"
      - "src/nfl_forecast/staff_impact.py"
      - "src/nfl_forecast/narrative.py"
      - "src/nfl_forecast/editorial_voice.py"
      - "src/nfl_forecast/story_context.py"
      - "src/nfl_forecast/source_policy.py"
      - "src/nfl_forecast/advanced_player_context.py"
      - "scripts/run_context.py"
      - "scripts/polish_publication.py"
      - "scripts/add_advanced_player_context.py"
      - "tests/test_context.py"
      - "tests/test_context_plus.py"
      - "tests/test_coaching.py"
      - "tests/test_qb_history_portability.py"
      - "tests/test_injuries.py"
      - "tests/test_personnel_impact.py"
      - "tests/test_staff_impact.py"
      - "tests/test_narrative.py"
      - "tests/test_publication_polish.py"
      - "tests/test_advanced_player_context.py"
      - "pyproject.toml"
      - ".github/workflows/context.yml"
  pull_request:
    paths:
      - "src/nfl_forecast/context.py"
      - "src/nfl_forecast/context_plus.py"
      - "src/nfl_forecast/coaching.py"
      - "src/nfl_forecast/qb_history.py"
      - "src/nfl_forecast/injuries.py"
      - "src/nfl_forecast/personnel_impact.py"
      - "src/nfl_forecast/staff_impact.py"
      - "src/nfl_forecast/narrative.py"
      - "src/nfl_forecast/editorial_voice.py"
      - "src/nfl_forecast/story_context.py"
      - "src/nfl_forecast/source_policy.py"
      - "src/nfl_forecast/advanced_player_context.py"
      - "scripts/run_context.py"
      - "scripts/polish_publication.py"
      - "scripts/add_advanced_player_context.py"
      - "tests/test_context.py"
      - "tests/test_context_plus.py"
      - "tests/test_coaching.py"
      - "tests/test_qb_history_portability.py"
      - "tests/test_injuries.py"
      - "tests/test_personnel_impact.py"
      - "tests/test_staff_impact.py"
      - "tests/test_narrative.py"
      - "tests/test_publication_polish.py"
      - "tests/test_advanced_player_context.py"
      - "pyproject.toml"
      - ".github/workflows/context.yml"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nfl-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
      - name: Test contextual intelligence
        run: pytest -q tests/test_context.py tests/test_context_plus.py tests/test_coaching.py tests/test_qb_history_portability.py tests/test_injuries.py tests/test_personnel_impact.py tests/test_staff_impact.py tests/test_narrative.py tests/test_publication_polish.py tests/test_advanced_player_context.py
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: nfl-context-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nfl-context-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Smoke-test contextual evidence generation
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          python scripts/run_context.py --season 2026 --output-dir /tmp/nfl-context
          python scripts/polish_publication.py --season 2026 --output-dir /tmp/nfl-context
          python scripts/add_advanced_player_context.py --season 2026 --output-dir /tmp/nfl-context
      - name: Require usable current coaching and impact coverage
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('/tmp/nfl-context/context_source_status.json').read_text())
          coaching = status.get('coaching', {})
          covered = int(coaching.get('current_team_coverage', 0))
          requested = int(coaching.get('requested_teams', 0))
          minimum = max(8, int(0.65 * requested)) if requested else 21
          print(f'current coaching coverage: {covered}/{requested}; required >= {minimum}')
          if covered < minimum:
              raise SystemExit(f'coaching source coverage below merge gate: {covered}/{requested}')

          staff = status.get('staff_impact', {})
          personnel = status.get('personnel_usage', {})
          story = status.get('story_desk', {})
          qb = status.get('qb_history_verification', {})
          ngs = status.get('nextgen_qb_context', {})
          print('staff impact:', json.dumps(staff, sort_keys=True))
          print('personnel usage:', json.dumps(personnel, sort_keys=True))
          print('story desk:', json.dumps(story, sort_keys=True))
          print('QB history verification:', json.dumps(qb, sort_keys=True))
          print('NGS quarterback context:', json.dumps(ngs, sort_keys=True))
          if status.get('ftn', {}).get('status') == 'healthy' and status.get('pbp', {}).get('status') == 'healthy' and staff.get('status') != 'healthy':
              raise SystemExit(f'staff-impact layer failed despite healthy FTN/PBP: {staff}')
          if status.get('pbp', {}).get('status') == 'healthy' and personnel.get('status') != 'healthy':
              raise SystemExit(f'personnel-usage layer failed despite healthy PBP: {personnel}')
          if story.get('status') != 'healthy':
              raise SystemExit(f'story-desk publication layer failed: {story}')
          if qb.get('status') != 'healthy' or qb.get('career_counts_published') is not False:
              raise SystemExit(f'QB history publication guardrail failed: {qb}')
          # NGS is genuinely best-effort and therefore never a merge blocker.
          # If it is healthy, however, require proof that the live slate produced
          # at least one actual player-profile match rather than a nominal source check.
          if ngs.get('status') == 'healthy' and int(ngs.get('evidence_items_added', 0)) < 1:
              raise SystemExit(f'NGS reported healthy but enriched no current quarterbacks: {ngs}')
          PY
      - name: Build contextual evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python scripts/run_context.py --season 2026
          python scripts/polish_publication.py --season 2026 --probe-advanced
          python scripts/add_advanced_player_context.py --season 2026
      - name: Commit contextual outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "sunday-signal-context-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/contextual_evidence.json outputs/game_previews.json outputs/context_source_status.json outputs/coaching_cache.json outputs/qb_history_audit.json
          git diff --cached --quiet || git commit -m "Refresh Sunday Signal contextual intelligence"
          git pull --rebase origin main
          git push
