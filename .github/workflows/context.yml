name: Contextual football intelligence

on:
  workflow_dispatch:
  push:
    branches: [main, context-intelligence-v1]
    paths:
      - "src/nfl_forecast/context.py"
      - "scripts/run_context.py"
      - "tests/test_context.py"
      - ".github/workflows/context.yml"
  pull_request:
    paths:
      - "src/nfl_forecast/context.py"
      - "scripts/run_context.py"
      - "tests/test_context.py"
      - ".github/workflows/context.yml"
  schedule:
    # Personnel/weather/context can change during the week; three-hour cadence is
    # frequent enough to stay fresh without hammering public sources.
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nfl-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
      - name: Test contextual intelligence
        run: pytest -q tests/test_context.py
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: nfl-context-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nfl-context-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Build contextual evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python scripts/run_context.py --season 2026
      - name: Commit contextual outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "nfl-context-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/contextual_evidence.json outputs/context_source_status.json outputs/coaching_cache.json
          git diff --cached --quiet || git commit -m "Refresh contextual football intelligence"
          git pull --rebase origin main
          git push
