name: NFL dashboard

on:
  push:
    branches: [main, dashboard-v1, diagnostics-v1, injury-source-v1]
    paths:
      - 'site/**'
      - 'outputs/**'
      - 'src/nfl_forecast/public_forecast.py'
      - 'src/nfl_forecast/player_impact_monitor.py'
      - 'scripts/build_public_forecasts.py'
      - 'scripts/build_public_impact_monitor.py'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'src/nfl_forecast/public_forecast.py'
      - 'src/nfl_forecast/player_impact_monitor.py'
      - 'scripts/build_public_forecasts.py'
      - 'scripts/build_public_impact_monitor.py'
      - '.github/workflows/dashboard.yml'
  workflow_run:
    workflows:
      - 'Daily NFL model refresh'
      - 'Hourly NFL market refresh'
      - 'Sunday Signal contextual intelligence'
      - 'Pregame NFL refresh'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only events capable of a production deploy share the production concurrency
# group. A failed producer creates a no-op workflow_run, and PRs are build-only;
# neither may cancel an in-progress deployment from a successful producer.
concurrency:
  group: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success') && format('pages-noop-{0}', github.run_id) || github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-production' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_run'
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python package
        run: pip install '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package.json
      - name: Copy forecast data into site
        run: |
          mkdir -p site/public/data
          for f in \
            this_week.csv run_history.csv prediction_history.csv power_ratings.csv model_leaderboard.csv \
            calibration.csv confidence_diagnostics.csv movement_attribution.csv team_profiles.csv \
            status.json contextual_evidence.json game_previews.json context_source_status.json weekly_brief.json postgame_autopsies.json \
            power_editorial.json history_scoreboard.json; do
            if [ -f "outputs/$f" ]; then cp "outputs/$f" "site/public/data/$f"; fi
          done
      - name: Build and validate canonical public forecasts
        run: python scripts/build_public_forecasts.py --output site/public/data/public_forecasts.json
      - name: Build fail-closed public Impact Monitor
        run: python scripts/build_public_impact_monitor.py --output site/public/data/impact_monitor.json
      - name: Install dashboard dependencies
        working-directory: site
        run: npm install
      - name: Build dashboard
        working-directory: site
        run: npm run build
      - name: Upload build artifact
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_run') && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_run') && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
