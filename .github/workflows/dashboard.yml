name: NFL dashboard

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'outputs/**'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package.json
      - name: Copy forecast data into site
        run: |
          mkdir -p site/public/data
          for f in this_week.csv run_history.csv prediction_history.csv power_ratings.csv model_leaderboard.csv status.json contextual_evidence.json; do
            if [ -f "outputs/$f" ]; then cp "outputs/$f" "site/public/data/$f"; fi
          done
      - name: Install dashboard dependencies
        working-directory: site
        run: npm install
      - name: Build dashboard
        working-directory: site
        run: npm run build
      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
