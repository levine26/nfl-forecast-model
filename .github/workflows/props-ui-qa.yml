name: Props UI QA

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/props-ui-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package.json
      - name: Install dependencies
        working-directory: site
        run: npm install
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Responsive QA
        working-directory: site
        run: npm run test:responsive
