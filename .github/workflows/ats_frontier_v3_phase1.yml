name: ATS Frontier V3 Phase 1
on:
  pull_request:
    paths:
      - 'research/ats-frontier-v3-keymass/**'
      - '.github/workflows/ats_frontier_v3_phase1.yml'
  workflow_dispatch:
jobs:
  phase1-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy pytest
      - run: python -m pytest research/ats-frontier-v3-keymass/test_phase1.py -q
