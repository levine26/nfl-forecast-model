name: LevLine 4 NGS player ID browser held-out V4 corrected

on:
  pull_request:
    paths:
      - 'research/levline4_2026_ngs_player_id_browser_heldout_v4_contract.json'
      - 'research/levline4_2026_ngs_player_id_browser_heldout_v4_preexecution_addendum.json'
      - 'research/levline4_2026_ngs_player_id_browser_heldout_v4.py'
      - 'research/levline4_2026_ngs_player_id_browser_heldout_v4_corrected.py'
      - 'research/test_levline4_2026_ngs_player_id_browser_heldout_v4.py'
      - 'research/test_levline4_2026_ngs_player_id_browser_heldout_v4_corrected.py'
      - 'research/levline4_2026_ngs_player_id_browser_heldout_v4_first_result_manifest.json'
      - '.github/workflows/research_levline4_2026_ngs_player_id_browser_heldout_v4_corrected.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: levline4-ngs-player-id-browser-heldout-v4-corrected-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  FROZEN_CONTRACT_COMMIT: '64ec8ce23dea248663a3366dde023479f812d0a2'
  PREEXECUTION_ADDENDUM_COMMIT: '93ec4a14e19be62642479140648e88b3d72debc7'
  CONTRACT_PATH: 'research/levline4_2026_ngs_player_id_browser_heldout_v4_contract.json'
  ADDENDUM_PATH: 'research/levline4_2026_ngs_player_id_browser_heldout_v4_preexecution_addendum.json'
  MANIFEST_PATH: 'research/levline4_2026_ngs_player_id_browser_heldout_v4_first_result_manifest.json'
  ROSTER_ARTIFACT_ID: '10461126275'
  ROSTER_WORKFLOW_RUN_ID: '35130069924'
  ROSTER_HEAD_SHA: '1280e4a06eacf3e30700f75d4dab9ecff99944a4'
  ROSTER_ARTIFACT_DIGEST: 'sha256:7ba9c87c8de3392505327e572cf6730d901113d2c22ca25daef3a3dc8a01fe3e'
  ROSTER_METADATA_SHA256: '90c3974677862b8838acf2afaf6bec07087ce9784a7ab01491d8dcfd1f41489f'
  V3_ARTIFACT_ID: '10472217076'
  V3_WORKFLOW_RUN_ID: '35159301387'
  V3_HEAD_SHA: 'fd4224805a46712c6d240cced51ef7d93ac50f9b'
  V3_ARTIFACT_DIGEST: 'sha256:af586ab4b827a8a99422d02d3265ca70f540cc5279770345acb5af5cd5037958'
  V3_TARGET_SELECTION_SHA256: '437a94fa92709d60f0c3b2d88a4e52ce8f3dfd7f6241109793f4d991b8222f8d'
  V3_DATA_BRANCH: 'research-data/levline4-ngs-player-id-browser-heldout-v3'

jobs:
  mode:
    runs-on: ubuntu-24.04
    outputs:
      frozen: ${{ steps.mode.outputs.frozen }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        run: |
          if [ -f "$MANIFEST_PATH" ]; then
            echo 'frozen=true' >> "$GITHUB_OUTPUT"
          else
            echo 'frozen=false' >> "$GITHUB_OUTPUT"
          fi

  preregistration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove frozen contract and addendum predate corrected executable/tests/workflow
        run: |
          set -euo pipefail
          git cat-file -e "${FROZEN_CONTRACT_COMMIT}^{commit}"
          git cat-file -e "${PREEXECUTION_ADDENDUM_COMMIT}^{commit}"
          git merge-base --is-ancestor "$FROZEN_CONTRACT_COMMIT" "$PREEXECUTION_ADDENDUM_COMMIT"
          git merge-base --is-ancestor "$PREEXECUTION_ADDENDUM_COMMIT" HEAD
          test "$(git rev-parse "${FROZEN_CONTRACT_COMMIT}:${CONTRACT_PATH}")" = "$(git rev-parse "HEAD:${CONTRACT_PATH}")"
          test "$(git rev-parse "${PREEXECUTION_ADDENDUM_COMMIT}:${ADDENDUM_PATH}")" = "$(git rev-parse "HEAD:${ADDENDUM_PATH}")"
          test "$FROZEN_CONTRACT_COMMIT" = "$(git log -1 --format=%H -- "$CONTRACT_PATH")"
          test "$PREEXECUTION_ADDENDUM_COMMIT" = "$(git log -1 --format=%H -- "$ADDENDUM_PATH")"
          for p in \
            research/levline4_2026_ngs_player_id_browser_heldout_v4.py \
            research/levline4_2026_ngs_player_id_browser_heldout_v4_corrected.py \
            research/test_levline4_2026_ngs_player_id_browser_heldout_v4.py \
            research/test_levline4_2026_ngs_player_id_browser_heldout_v4_corrected.py \
            .github/workflows/research_levline4_2026_ngs_player_id_browser_heldout_v4_corrected.yml; do
            latest=$(git log -1 --format=%H -- "$p")
            test "$latest" != "$FROZEN_CONTRACT_COMMIT"
            test "$latest" != "$PREEXECUTION_ADDENDUM_COMMIT"
            git merge-base --is-ancestor "$PREEXECUTION_ADDENDUM_COMMIT" "$latest"
          done
      - name: Install lightweight test dependency
        run: python -m pip install pytest
      - name: Unit-test base V4 plus preregistered correction
        run: |
          python -m pytest -q \
            research/test_levline4_2026_ngs_player_id_browser_heldout_v4.py \
            research/test_levline4_2026_ngs_player_id_browser_heldout_v4_corrected.py
      - name: Prove research-only diff
        run: |
          set -euo pipefail
          git fetch origin main --depth=100
          bad=$(git diff --name-only origin/main...HEAD | grep -Ev '^(research/|\.github/workflows/research_)' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi

  live-heldout:
    if: needs.mode.outputs.frozen == 'false'
    needs: [mode, preregistration]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove unfrozen canonical first-result path and preregistration ancestry
        run: |
          set -euo pipefail
          test ! -f "$MANIFEST_PATH"
          git merge-base --is-ancestor "$FROZEN_CONTRACT_COMMIT" "$PREEXECUTION_ADDENDUM_COMMIT"
          git merge-base --is-ancestor "$PREEXECUTION_ADDENDUM_COMMIT" HEAD
          test "$FROZEN_CONTRACT_COMMIT" = "$(git log -1 --format=%H -- "$CONTRACT_PATH")"
          test "$PREEXECUTION_ADDENDUM_COMMIT" = "$(git log -1 --format=%H -- "$ADDENDUM_PATH")"
      - name: Require durable V3 preservation before V4 empirical execution
        run: |
          set -euo pipefail
          git fetch origin "${V3_DATA_BRANCH}:refs/remotes/origin/${V3_DATA_BRANCH}"
          p='research_outputs/levline4_2026_ngs_player_id_browser_heldout_v3/first_result_35159301387/preservation.json'
          git show "origin/${V3_DATA_BRANCH}:$p" > /tmp/v3_preservation.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/v3_preservation.json').read_text())
          assert p['source_actions_artifact_id']==int(os.environ['V3_ARTIFACT_ID'])
          assert p['source_workflow_run_id']==int(os.environ['V3_WORKFLOW_RUN_ID'])
          assert p['source_head_sha']==os.environ['V3_HEAD_SHA']
          assert p['actions_artifact_digest']==os.environ['V3_ARTIFACT_DIGEST']
          assert p['canonical_result']=='FAIL'
          assert p['production_authorized'] is False
          PY
      - name: Download pinned roster and V3 development evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          roster_meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ROSTER_ARTIFACT_ID}")
          test "$(echo "$roster_meta" | jq -r .digest)" = "$ROSTER_ARTIFACT_DIGEST"
          test "$(echo "$roster_meta" | jq -r .workflow_run.id)" = "$ROSTER_WORKFLOW_RUN_ID"
          test "$(echo "$roster_meta" | jq -r .workflow_run.head_sha)" = "$ROSTER_HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ROSTER_ARTIFACT_ID}/zip" > /tmp/roster_v2.zip
          rm -rf /tmp/roster_v2 && mkdir -p /tmp/roster_v2
          unzip -q /tmp/roster_v2.zip -d /tmp/roster_v2
          test "$(sha256sum /tmp/roster_v2/roster_metadata.jsonl | awk '{print $1}')" = "$ROSTER_METADATA_SHA256"

          v3_meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${V3_ARTIFACT_ID}")
          test "$(echo "$v3_meta" | jq -r .digest)" = "$V3_ARTIFACT_DIGEST"
          test "$(echo "$v3_meta" | jq -r .workflow_run.id)" = "$V3_WORKFLOW_RUN_ID"
          test "$(echo "$v3_meta" | jq -r .workflow_run.head_sha)" = "$V3_HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${V3_ARTIFACT_ID}/zip" > /tmp/ngs_v3.zip
          rm -rf /tmp/ngs_v3 && mkdir -p /tmp/ngs_v3
          unzip -q /tmp/ngs_v3.zip -d /tmp/ngs_v3
          test "$(sha256sum /tmp/ngs_v3/target_selection.json | awk '{print $1}')" = "$V3_TARGET_SELECTION_SHA256"
      - name: Prove frozen 74-row out-of-sample target set before any V4 NGS request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.levline4_2026_ngs_player_id_browser_heldout_v4 import load_jsonl, select_targets
          c=json.loads(Path('research/levline4_2026_ngs_player_id_browser_heldout_v4_contract.json').read_text())
          rows=load_jsonl(Path('/tmp/roster_v2/roster_metadata.jsonl'))
          v3=json.loads(Path('/tmp/ngs_v3/target_selection.json').read_text())
          targets,diag=select_targets(rows,c,v3)
          assert len(targets)==74
          assert diag['eligible_row_count']==2389
          assert diag['coverage_target_count']==64
          assert diag['team_alias_ari_target_count']==4
          assert diag['source_name_variant_target_count']==16
          assert diag['overlap_counts']==c['target_selection']['expected_overlap_counts']
          assert diag['sorted_row_identity_sha256']==c['target_selection']['expected_sorted_row_identity_sha256']
          assert diag['target_projection_sha256']==c['target_selection']['expected_target_projection_sha256']
          prior={(x['team'],x['visible_name'],x.get('profile_path','')) for x in v3['targets']}
          assert not any((x['team'],x['visible_name'],x.get('profile_path','')) in prior for x in targets)
          print(json.dumps(diag,indent=2,sort_keys=True))
          PY
      - name: Install browser dependency
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Execute canonical first corrected V4 once
        id: execute
        continue-on-error: true
        run: |
          set +e
          rm -rf research_outputs/levline4_2026_ngs_player_id_browser_heldout_v4
          python research/levline4_2026_ngs_player_id_browser_heldout_v4_corrected.py \
            --contract "$CONTRACT_PATH" \
            --addendum "$ADDENDUM_PATH" \
            --roster-metadata /tmp/roster_v2/roster_metadata.jsonl \
            --v3-target-selection /tmp/ngs_v3/target_selection.json \
            --output-dir research_outputs/levline4_2026_ngs_player_id_browser_heldout_v4 \
            > /tmp/v4_execution.log 2>&1
          code=$?
          mkdir -p research_outputs/levline4_2026_ngs_player_id_browser_heldout_v4
          cp /tmp/v4_execution.log research_outputs/levline4_2026_ngs_player_id_browser_heldout_v4/execution.log
          echo "$code" > research_outputs/levline4_2026_ngs_player_id_browser_heldout_v4/execution_exit_code.txt
          cat /tmp/v4_execution.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Verify governance and corrected alias boundary before artifact upload
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_outputs/levline4_2026_ngs_player_id_browser_heldout_v4')
          r=json.loads((root/'receipt.json').read_text())
          assert r['contract_id']=='LEVLINE-4-2026-NGS-PLAYER-ID-BROWSER-HELDOUT-V4'
          assert r['target_selection']['total_target_count']==74
          assert r['browser_transport']['manual_headers_or_credentials_used'] is False
          assert r['browser_transport']['browser_storage_state_persisted'] is False
          assert r['browser_transport']['direct_http_fallback_used'] is False
          assert r['browser_transport']['explicit_retry_used'] is False
          assert r['completed_2026_outcomes_used_for_design_or_selection']==0
          assert r['postgame_participation_used'] is False
          assert r['week2_inactive_execution_evidence_used_for_design'] is False
          assert r['f_st_01_frozen_2026_unchanged'] is True
          assert r['research_only'] is True
          assert r['production_paths_changed'] is False
          assert r['preexecution_addendum']['alias_exercise_requirement_applied'] is True
          exercised=r['metrics']['ari_az_alias_exercised_count']
          if exercised == 0:
              assert r['conditional_capability_evidence']['ari_az_team_alias_qualified'] is False
              if r['status']=='PASS':
                  assert r['authority']['ari_az_team_alias_qualified_for_frozen_v4_population'] is False
          for key in ('general_2026_player_identity_to_gsis_qualified','week2_sunday_due_inactive_player_identity_to_gsis_qualified','availability_state_authorized','forecast_probability_effect_authorized','model_fit_authorized','production_authorized'):
              assert r['authority'][key] is False, key
          print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Upload immutable canonical first corrected V4 artifact even on scientific FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levline4-ngs-player-id-browser-heldout-v4-first-${{ github.run_id }}
          path: research_outputs/levline4_2026_ngs_player_id_browser_heldout_v4/
          if-no-files-found: error
          retention-days: 30
      - name: Surface canonical scientific disposition after artifact upload
        if: always()
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          EXECUTE_EXIT_CODE: ${{ steps.execute.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$EXECUTE_OUTCOME" = 'success'
          test "${EXECUTE_EXIT_CODE:-1}" = '0'
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research_outputs/levline4_2026_ngs_player_id_browser_heldout_v4/receipt.json').read_text())
          if r['status'] != 'PASS':
              raise SystemExit('Canonical first corrected V4 result is scientifically FAIL; freeze this artifact and version up before adaptation.')
          assert all(r['gates'].values())
          a=r['authority']
          assert a['ngs_public_page_browser_context_transport_qualified_for_frozen_v4_population'] is True
          assert a['ngs_repaired_name_team_resolver_qualified_for_frozen_v4_population'] is True
          assert a['official_roster_to_ngs_gsis_candidate_bridge_qualified_for_separately_preregistered_heldout_application'] is True
          if r['metrics']['ari_az_alias_exercised_count'] == 0:
              assert a['ari_az_team_alias_qualified_for_frozen_v4_population'] is False
          for key in ('ngs_endpoint_as_independent_or_stable_production_api_qualified','ngs_is_independent_player_identity_ground_truth','general_2026_player_identity_to_gsis_qualified','week2_sunday_due_inactive_player_identity_to_gsis_qualified','game_day_membership_qualified','availability_state_authorized','player_value_join_authorized','forecast_probability_effect_authorized','model_fit_authorized','production_authorized'):
              assert a[key] is False, key
          PY

  replay-canonical-first-result:
    if: needs.mode.outputs.frozen == 'true'
    needs: [mode, preregistration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read immutable first-result coordinates
        id: manifest
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          m=json.loads(Path('research/levline4_2026_ngs_player_id_browser_heldout_v4_first_result_manifest.json').read_text())
          assert m['contract_id']=='LEVLINE-4-2026-NGS-PLAYER-ID-BROWSER-HELDOUT-V4'
          assert m['first_result_is_canonical'] is True
          assert m['later_same_version_execution_may_replace_first_result'] is False
          assert m['same_version_rule_adaptation_after_first_result'] is False
          print(f"artifact_id={m['first_artifact_id']}")
          print(f"artifact_digest={m['artifact_digest']}")
          print(f"workflow_run_id={m['first_workflow_run_id']}")
          print(f"head_sha={m['first_head_sha']}")
          PY
      - name: Download and verify immutable canonical V4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.manifest.outputs.artifact_id }}")
          test "$(echo "$meta" | jq -r .digest)" = "${{ steps.manifest.outputs.artifact_digest }}"
          test "$(echo "$meta" | jq -r .workflow_run.id)" = "${{ steps.manifest.outputs.workflow_run_id }}"
          test "$(echo "$meta" | jq -r .workflow_run.head_sha)" = "${{ steps.manifest.outputs.head_sha }}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.manifest.outputs.artifact_id }}/zip" > /tmp/ngs_v4.zip
          rm -rf /tmp/ngs_v4 && mkdir -p /tmp/ngs_v4
          unzip -q /tmp/ngs_v4.zip -d /tmp/ngs_v4
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('research/levline4_2026_ngs_player_id_browser_heldout_v4_first_result_manifest.json').read_text())
          root=Path('/tmp/ngs_v4')
          observed={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert observed==m['file_sha256']
          r=json.loads((root/'receipt.json').read_text())
          assert r['status']==m['first_result_status']
          assert r['authority']==m['authority']
          assert r['completed_2026_outcomes_used_for_design_or_selection']==0
          assert r['postgame_participation_used'] is False
          assert r['week2_inactive_execution_evidence_used_for_design'] is False
          assert r['f_st_01_frozen_2026_unchanged'] is True
          assert r['research_only'] is True
          assert r['production_paths_changed'] is False
          PY

  research-firewall:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove research-only scope
        run: |
          git fetch origin main --depth=100
          git diff --name-only origin/main...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed=[x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad=[x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/main...HEAD -- outputs/ site/ src/ scripts/ config/
