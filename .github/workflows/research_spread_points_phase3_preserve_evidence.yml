name: Phase 3 one-time evidence preservation

on:
  push:
    branches:
      - research/spread-points-nextgen-phase3
    paths:
      - 'research/spread-points-nextgen/phase3/EVIDENCE_COMMIT_REQUEST'

permissions:
  actions: read
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact validated Phase 3 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out='research/spread-points-nextgen/phase3/evidence'
          rm -rf "$out"
          mkdir -p "$out"
          gh run download 35810171571 \
            --repo "${{ github.repository }}" \
            --name spread-points-phase3-35810171571 \
            --dir "$out"
          test -s "$out/A0_OOF_2022_2024.csv"
          test -s "$out/B0_OOF_2022_2024.csv"
          test -s "$out/C0_OOF_2022_2024.csv"
          test -s "$out/FUTURE_CANDIDATE5_OOF_SURFACES_2022_2024.csv"
          test -s "$out/DEVELOPMENT_SUMMARY.json"
          test -s "$out/D_ELIGIBILITY_RECEIPT.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/spread-points-nextgen/phase3/evidence')
          m = json.loads((root / 'RUN_MANIFEST.json').read_text())
          assert m['generator_git_head'] == '3d893ec8e26824f7e6c1883f4d0d09c19160c712'
          assert m['development_seasons'] == [2022, 2023, 2024]
          assert m['2025_loaded'] is False
          assert m['2025_challenger_scored'] is False
          assert m['completed_2026_outcomes_used'] is False
          assert m['candidate5_trained'] is False
          PY
      - name: Commit immutable evidence package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/spread-points-nextgen/phase3/evidence
          git commit -m 'research: preserve validated Phase 3 development evidence [skip ci]'
          git push
