name: LevLine props market research

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/props_market.py'
      - 'src/nfl_forecast/props_market_odds_api.py'
      - 'tests/test_props_market.py'
      - 'tests/test_props_market_odds_api.py'
      - 'research/props/PLAYER_MARKET_CONTRACT.md'
      - '.github/workflows/research_props_market.yml'
  workflow_dispatch:

jobs:
  props-market-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8.0'
      - name: Run props market contract tests
        run: >-
          python -m pytest -q
          tests/test_props_market.py
          tests/test_props_market_odds_api.py
