name: LevLine Props 2.0 team TD count distribution

on:
  pull_request:
    paths:
      - 'research/props/v2/team_td_count_distribution.py'
      - 'research/props/v2/test_team_td_count_distribution.py'
      - 'research/props/v2/run_team_td_count_distribution.py'
      - 'research/props/v2/TEAM_TD_COUNT_DISTRIBUTION_CONTRACT.md'
      - '.github/workflows/research_props_v2_team_td_count.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate TD count component
        run: python -m pytest -q research/props/v2/test_team_td_count_distribution.py

  component:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pyarrow
      - name: Run frozen 2023-2025 TD count study
        run: |
          python research/props/v2/run_team_td_count_distribution.py             --output-dir research_outputs/props_v2/team_td_count
      - name: Enforce research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research_outputs/props_v2/team_td_count/summary.json").read_text())
          assert d["contract_version"]=="levline-props-v2-team-td-count-v0.1.0"
          assert d["same_expected_mean_for_both_models"] is True
          assert d["player_prop_outcomes_used"]==0
          assert d["sportsbook_data_used"]==0
          assert d["completed_2026_outcomes_used"]==0
          assert d["production_authorized"] is False
          assert set(d["by_season"])=={"2023","2024","2025"}
          print(json.dumps({
              "aggregate":d["aggregate"],
              "advance_gate":d["advance_gate"],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-team-td-count
          path: research_outputs/props_v2/team_td_count/
          if-no-files-found: error
