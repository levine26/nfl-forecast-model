name: LevLine 4 official club roster row parser V2

on:
  pull_request:
    paths:
      - 'research/levline4_2026_official_club_roster_row_parser_v2_contract.json'
      - 'research/levline4_2026_official_club_roster_row_parser_v2.py'
      - 'research/test_levline4_2026_official_club_roster_row_parser_v2.py'
      - '.github/workflows/research_levline4_2026_official_club_roster_row_parser_v2.yml'
      - 'research/levline4_2026_official_club_roster_surface_probe_v1_contract.json'
      - 'research/levline4_2026_official_club_roster_surface_probe_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline4-official-club-roster-row-parser-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  unit-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install pytest 'requests>=2.32' 'beautifulsoup4>=4.12' 'lxml>=5.0'
      - name: Run adversarial deterministic parser tests
        run: pytest -q research/test_levline4_2026_official_club_roster_row_parser_v2.py
      - name: Validate preregistration and authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('research/levline4_2026_official_club_roster_row_parser_v2_contract.json').read_text())
          assert c['contract_id']=='LEVLINE-4-2026-OFFICIAL-CLUB-ROSTER-ROW-PARSER-V2'
          assert c['status']=='PREREGISTERED_HELD_OUT_LIVE_ROW_PARSER_QUALIFICATION'
          d=c['discovery_evidence']
          assert d['source_workflow_run_id']==35127480203
          assert d['source_actions_artifact_id']==10459946019
          assert d['source_head_sha']=='31698199e37b3570a82a5c55f879db65f2fdaa34'
          assert d['observed_header_vector']==['Player','#','Pos','HT','WT','Age','Exp','College']
          assert d['observed_row_parse_anomalies']==0
          h=c['held_out_capture']
          assert h['must_be_new_network_capture_after_contract_freeze'] is True
          assert h['reuse_v1_raw_bytes_for_qualification_forbidden'] is True
          p=c['frozen_parser']
          assert p['fuzzy_header_matching_allowed'] is False
          assert p['minimum_parsed_identity_rows_per_team']==50
          assert p['blank_jersey_allowed_but_not_independently_identity_corroborating'] is True
          q=c['qualification']
          assert q['parser_may_qualify_only_on_first_held_out_v2_live_execution'] is True
          assert q['later_retry_may_not_replace_first_empirical_result'] is True
          assert q['same_version_rule_relaxation_after_result_forbidden'] is True
          assert c['source_lineage']['underlying_source_independence_between_club_pages_and_nflverse_weekly_rosters_established'] is False
          assert c['source_lineage']['v2_may_not_be_called_source_independent_gsis_truth'] is True
          for key,value in c['authority'].items():
              if key in {'official_club_roster_surface_capture_qualified_by_v1','official_club_roster_identity_row_parser_may_qualify_by_v2','status_free_official_club_identity_projection_may_be_reused_if_v2_passes'}:
                  assert value is True
              else:
                  assert value is False, key
          assert c['governance']['completed_2026_outcomes_used_for_design_or_selection']==0
          assert c['governance']['postgame_participation_used'] is False
          assert c['governance']['f_st_01_frozen_2026_unchanged'] is True
          PY

  first-held-out-live-v2:
    needs: unit-and-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture dependencies
        run: python -m pip install 'requests>=2.32' 'beautifulsoup4>=4.12' 'lxml>=5.0'
      - name: Execute first held-out V2 live capture
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m research.levline4_2026_official_club_roster_row_parser_v2
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Verify evidence is preserved with zero expanded authority
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_outputs/levline4_2026_official_club_roster_row_parser_v2')
          receipt=json.loads((root/'receipt.json').read_text())
          assert receipt['contract_id']=='LEVLINE-4-2026-OFFICIAL-CLUB-ROSTER-ROW-PARSER-V2'
          assert receipt['expected_team_count']==32
          assert receipt['identity_projection_fields']==[
              'team','player_name_rendered','jersey_number_rendered','position_rendered','profile_url',
              'source_url','final_url','captured_at_utc','raw_html_sha256'
          ]
          assert receipt['real_execution_is_self_qualifying'] is False
          assert receipt['official_club_roster_identity_row_parser_qualified'] is False
          assert receipt['underlying_source_independence_from_nflverse_established'] is False
          for key in (
              'week2_sunday_due_inactive_player_identity_to_gsis_qualified',
              'general_2026_player_identity_to_gsis_qualified','game_day_membership_qualified',
              'availability_state_authorized','availability_probability_authorized','player_value_join_authorized',
              'forecast_probability_effect_authorized','model_fit_authorized','production_authorized'):
              assert receipt[key] is False, key
          assert receipt['completed_2026_outcomes_used_for_design_or_selection']==0
          assert receipt['postgame_participation_used'] is False
          assert receipt['f_st_01_frozen_2026_unchanged'] is True
          assert (root/'identity_rows.jsonl').is_file()
          assert (root/'team_parser_diagnostics.json').is_file()
          assert len(list((root/'raw').glob('*.html'))) > 0
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Upload immutable first-run V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levline4-official-club-roster-row-parser-v2-${{ github.run_id }}
          path: research_outputs/levline4_2026_official_club_roster_row_parser_v2/
          if-no-files-found: error
          retention-days: 30
      - name: Surface held-out failure only after evidence upload
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          CAPTURE_EXIT_CODE: ${{ steps.capture.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "$CAPTURE_OUTCOME" != "success" ] || [ "${CAPTURE_EXIT_CODE:-1}" != "0" ]; then
            echo "Frozen first held-out V2 capture failed; evidence above is canonical and gates may not be relaxed."
            exit 1
          fi

  research-firewall:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch is research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed=[x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad=[x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
