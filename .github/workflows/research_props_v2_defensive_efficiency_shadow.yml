name: LevLine Props 2.0 defensive efficiency shadow freeze

on:
  pull_request:
    paths:
      - 'research/props/v2/freeze_defensive_efficiency_shadow.py'
      - 'research/props/v2/test_defensive_efficiency_shadow_freeze.py'
      - 'research/props/v2/DEFENSIVE_EFFICIENCY_SHADOW_CONTRACT.md'
      - '.github/workflows/research_props_v2_defensive_efficiency_shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install pyarrow
      - run: python -m pytest -q research/props/v2/test_defensive_efficiency_shadow_freeze.py
      - name: Freeze final pre-2026 coefficients
        run: |
          python research/props/v2/freeze_defensive_efficiency_shadow.py \
            --output research_outputs/props_v2/defensive_efficiency_shadow/frozen_coefficients.json
      - name: Enforce prospective firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research_outputs/props_v2/defensive_efficiency_shadow/frozen_coefficients.json").read_text())
          assert d["contract_version"]=="levline-props-v2-defensive-efficiency-shadow-v0.1.0"
          assert d["trained_through_season"]==2025
          assert d["completed_2026_outcomes_used"]==0
          assert d["prop_outcomes_used"]==0
          assert d["sportsbook_results_used"]==0
          assert d["production_authorized"] is False
          assert set(d["fits"])=={"rushing","receiving"}
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-defensive-efficiency-shadow-coefficients
          path: research_outputs/props_v2/defensive_efficiency_shadow/
          if-no-files-found: error
