name: LevLine F-ST-01 stacking research

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/challenger_stacking.py'
      - 'scripts/run_challenger_stacking.py'
      - 'tests/test_challenger_stacking.py'
      - '.github/workflows/research_stacking.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-f-st-01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  historical-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test chronology, architecture, evaluator, and production-import contracts
        run: pytest -q tests/test_challenger_stacking.py tests/test_challenger_evaluation.py tests/test_challenger_v08.py
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: nfl-f-st-01-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nfl-f-st-01-${{ runner.os }}-
            nfl-challenger-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Run pre-registered 2022-25 chronological stack and uncertainty audit
        run: |
          rm -rf challenger_outputs/f_st_01
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" python scripts/run_challenger_stacking.py
          test -s challenger_outputs/f_st_01/report.json
          test -s challenger_outputs/f_st_01/paired_predictions_2022_2025.csv
          test -s challenger_outputs/f_st_01/stack_coefficients.csv
          test -s challenger_outputs/f_st_01/stack_vs_market_bootstrap.csv
          test -s challenger_outputs/f_st_01/stack_vs_v08_adaptive_bootstrap.csv
          test -s challenger_outputs/f_st_01/brier_confidence_set.csv
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('challenger_outputs/f_st_01/report.json').read_text())
          assert report['experiment_id'] == 'F-ST-01'
          assert report['paired_target_games'] >= 1000
          assert report['stack_C'] == 1.0
          assert report['hyperparameter_search_performed'] is False
          assert report['2026_data_loaded'] is False
          assert report['2026_outcomes_used'] == 0
          assert report['promotion_authorized'] is False
          assert report['shadow_authorized'] is False
          assert len(report['coefficients']) == 4
          PY
      - name: Prove production outputs and site are untouched
        run: git diff --exit-code -- outputs/ site/
      - uses: actions/upload-artifact@v4
        with:
          name: levline-f-st-01-${{ github.run_id }}
          path: challenger_outputs/f_st_01/
          retention-days: 30
