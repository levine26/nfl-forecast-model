name: LevLine Props 2.0 distribution V2 study

on:
  pull_request:
    branches:
      - research/props-v2-challenger
    paths:
      - 'research/props/v2/distribution_v2_event_study.py'
      - 'research/props/v2/run_distribution_v2_event_study.py'
      - 'research/props/v2/test_distribution_v2_event_study.py'
      - 'research/props/v2/DISTRIBUTION_V2_RESEARCH_CONTRACT.md'
      - '.github/workflows/research_props_v2_distribution_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy pytest
      - run: pytest -q research/props/v2/test_distribution_v2_event_study.py

  real-data:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' pyarrow
      - run: |
          python research/props/v2/run_distribution_v2_event_study.py             --output-dir research_outputs/props_v2/distribution_v2
      - name: Enforce research boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research_outputs/props_v2/distribution_v2/distribution_result.json").read_text())
          assert d["production_authorized"] is False
          assert d["completed_2026_outcomes_used"] == 0
          assert d["game_outcomes_used_for_model_selection"] == 0
          assert d["aggregate"]["n_test"] > 0
          print(json.dumps(d["aggregate"],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-distribution-v2
          path: research_outputs/props_v2/distribution_v2/
          if-no-files-found: error
