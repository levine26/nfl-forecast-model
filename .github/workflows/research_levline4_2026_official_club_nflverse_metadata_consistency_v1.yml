name: LevLine 4 official club nflverse metadata consistency V1

on:
  pull_request:
    paths:
      - 'research/levline4_2026_official_club_nflverse_metadata_consistency_v1_contract.json'
      - 'research/levline4_2026_official_club_nflverse_metadata_consistency_v1.py'
      - 'research/test_levline4_2026_official_club_nflverse_metadata_consistency_v1.py'
      - '.github/workflows/research_levline4_2026_official_club_nflverse_metadata_consistency_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline4-official-club-nflverse-metadata-consistency-v1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  unit-and-contract-preregistration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic test dependencies
        run: python -m pip install pytest 'polars==1.33.1'
      - name: Run frozen metadata-consistency unit tests
        run: pytest -q research/test_levline4_2026_official_club_nflverse_metadata_consistency_v1.py
      - name: Assert preregistered authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('research/levline4_2026_official_club_nflverse_metadata_consistency_v1_contract.json').read_text())
          assert c['contract_id']=='LEVLINE-4-2026-OFFICIAL-CLUB-NFLVERSE-METADATA-CONSISTENCY-V1'
          assert c['status']=='PREREGISTERED_CROSS_PUBLISHER_METADATA_CONSISTENCY_ONLY'
          assert c['frozen_sources']['official_club']['roster_metadata_sha256']=='90c3974677862b8838acf2afaf6bec07087ce9784a7ab01491d8dcfd1f41489f'
          assert c['frozen_sources']['nflverse_identity']['projection_sha256']=='fc993e0543950222cd20e0c29e457980da572d100bebff6a5d4bf5f7b72b051f'
          assert c['frozen_sources']['nflverse_identity']['position_field_present'] is False
          assert c['frozen_resolution']['jersey_used_for_resolution'] is False
          assert c['frozen_resolution']['position_used_for_resolution'] is False
          assert c['frozen_resolution']['fuzzy_matching_allowed'] is False
          assert c['frozen_resolution']['manual_override_allowed'] is False
          assert c['qualification_gate']['exact_unique_resolution_rate_min']==0.995
          assert c['qualification_gate']['ambiguities_allowed']==0
          assert c['qualification_gate']['jersey_agreement_rate_required']==1.0
          assert c['qualification_gate']['post_result_threshold_relaxation_allowed'] is False
          assert c['qualification_gate']['later_same_version_execution_may_replace_first_result'] is False
          assert c['authority_if_gate_passes']['underlying_source_independence_proven'] is False
          assert c['authority_if_gate_passes']['player_identity_to_gsis_qualified'] is False
          assert c['authority_if_gate_passes']['availability_state_authorized'] is False
          assert c['authority_if_gate_passes']['forecast_probability_effect_authorized'] is False
          assert c['authority_if_gate_passes']['production_authorized'] is False
          assert c['governance']['target_inactive_rows_used_for_design_or_selection'] is False
          assert c['governance']['completed_2026_outcomes_used_for_design_or_selection']==0
          assert c['governance']['postgame_participation_used'] is False
          assert c['governance']['f_st_01_frozen_2026_unchanged'] is True
          PY

  research-firewall:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch is research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed=[x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad=[x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
