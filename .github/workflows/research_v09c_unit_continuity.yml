name: LevLine v0.9C1 unit-continuity research

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/player_state_research.py'
      - 'src/nfl_forecast/challenger_v09c_unit_state.py'
      - 'src/nfl_forecast/challenger_v09c.py'
      - 'scripts/run_challenger_v09c.py'
      - 'scripts/run_challenger_v09c_uncertainty.py'
      - 'tests/test_challenger_v09c_unit_state.py'
      - '.github/workflows/research_v09c_unit_continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-v09c1-unit-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  historical-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test chronology, identity, and production-import contracts
        run: pytest -q tests/test_challenger_v09c_unit_state.py tests/test_player_state_research.py tests/test_challenger_v08.py tests/test_challenger_evaluation.py
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: nfl-v09c1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nfl-v09c1-${{ runner.os }}-
            nfl-player-state-${{ runner.os }}-
            nfl-challenger-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Run pre-registered 2022-25 unit-continuity ablation
        run: |
          rm -rf challenger_outputs/v09c
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" python scripts/run_challenger_v09c.py
          test -s challenger_outputs/v09c/report.json
          test -s challenger_outputs/v09c/paired_predictions_2022_2025.csv
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('challenger_outputs/v09c/report.json').read_text())
          assert report['candidate_version'] == '0.9C-unit-continuity'
          assert report['paired_target_games'] >= 1000
          assert report['2026_outcomes_used'] == 0
          assert report['current_game_snaps_used'] == 0
          assert report['promotion_authorized'] is False
          assert report['shadow_authorized'] is False
          PY
      - name: Run paired uncertainty audit without refitting candidate
        run: |
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" python scripts/run_challenger_v09c_uncertainty.py
          test -s challenger_outputs/v09c/uncertainty/report.json
          test -s challenger_outputs/v09c/uncertainty/adaptive_vs_v08_adaptive_bootstrap.csv
          test -s challenger_outputs/v09c/uncertainty/adaptive_vs_market_bootstrap.csv
          test -s challenger_outputs/v09c/uncertainty/brier_confidence_set.csv
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('challenger_outputs/v09c/uncertainty/report.json').read_text())
          assert report['candidate_version'] == '0.9C-unit-continuity'
          assert report['paired_games'] >= 1000
          assert report['2026_outcomes_used'] == 0
          assert report['candidate_refit_or_tuning_performed'] is False
          assert report['promotion_authorized'] is False
          assert report['shadow_authorized'] is False
          PY
      - name: Prove production outputs and site are untouched
        run: git diff --exit-code -- outputs/ site/
      - uses: actions/upload-artifact@v4
        with:
          name: levline-v09c1-unit-continuity-${{ github.run_id }}
          path: challenger_outputs/v09c/
          retention-days: 30
