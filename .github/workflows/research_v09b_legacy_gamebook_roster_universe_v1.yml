name: LevLine V09B legacy Game Book roster universe

on:
  pull_request:
    paths:
      - 'research/availability/v09b_legacy_gamebook_roster_universe_contract_v1.json'
      - 'research/v09b_legacy_gamebook_roster_universe_v1.py'
      - 'research/test_v09b_legacy_gamebook_roster_universe_v1.py'
      - '.github/workflows/research_v09b_legacy_gamebook_roster_universe_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test direct Game Book roster partition semantics
        run: pytest -q research/test_v09b_legacy_gamebook_roster_universe_v1.py
      - name: Validate source-only denominator contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/availability/v09b_legacy_gamebook_roster_universe_contract_v1.json').read_text())
          assert c['status'] == 'POST_SOURCE_INSPECTION_DETERMINISTIC_PARSER_AUDIT'
          assert c['scientific_disclosure']['parser_design_informed_by_raw_source_inspection'] is True
          assert c['scientific_disclosure']['game_outcomes_used_to_design_parser'] is False
          assert c['source_semantics']['active_candidate_sections'] == ['Lineups', 'Substitutions', 'Did Not Play']
          assert c['source_semantics']['inactive_negative_section'] == 'Not Active'
          assert c['source_semantics']['did_not_play_is_negative'] is False
          assert c['source_semantics']['weekly_roster_status_used_to_define_membership'] is False
          assert c['frozen_audit_gates']['canonical_game_parse_coverage_rate_required'] == 1.0
          assert c['frozen_audit_gates']['team_partition_parse_coverage_rate_required'] == 1.0
          assert c['frozen_audit_gates']['active_inactive_overlaps_allowed'] == 0
          assert c['authorization']['player_team_game_identity_qualified'] is False
          assert c['authorization']['v09b_model_fit_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used'] == 0
          PY

  roster-universe-audit:
    needs: unit-and-contract
    strategy:
      fail-fast: false
      matrix:
        season: [2012, 2013, 2014, 2015, 2016]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install '.[dev]'
      - name: Re-verify source and audit direct roster partitions
        run: |
          ROOT=research_outputs/v09b_legacy_gamebook_roster_universe_v1/${{ matrix.season }}
          mkdir -p "$ROOT"
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_legacy_gamebook_roster_universe_v1.py \
              --season ${{ matrix.season }} \
              --archive-root "$ROOT/archive" \
              --output "$ROOT/receipt.json"
      - name: Assert no identity/model/outcome leakage
        if: always()
        run: |
          p=research_outputs/v09b_legacy_gamebook_roster_universe_v1/${{ matrix.season }}/receipt.json
          if test -s "$p"; then
            python - <<'PY'
          import json
          from pathlib import Path
          season = '${{ matrix.season }}'
          r = json.loads(Path(f'research_outputs/v09b_legacy_gamebook_roster_universe_v1/{season}/receipt.json').read_text())
          assert r['weekly_roster_status_used_to_define_membership'] is False
          assert r['postgame_participation_used_to_define_membership'] is False
          assert r['player_team_game_identity_qualified'] is False
          assert r['training_label_semantics_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['model_fit_performed'] is False
          assert r['game_outcomes_used'] == 0
          assert r['completed_2026_outcomes_used'] == 0
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v09b-legacy-gamebook-roster-universe-${{ matrix.season }}-${{ github.run_id }}
          path: research_outputs/v09b_legacy_gamebook_roster_universe_v1/${{ matrix.season }}/receipt.json
          if-no-files-found: warn
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
