name: ATS JSIP V1 Frozen Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ats-joint-score-iprojection-v1/**'
      - '.github/workflows/research_ats_jsip_v1_preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Enforce research-only diff scope
        run: |
          git fetch origin main
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev '^(research/ats-joint-score-iprojection-v1/|\.github/workflows/research_ats_jsip_v1_preflight\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo 'Production firewall violation:'
            echo "$bad"
            exit 1
          fi
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Syntax check frozen preflight
        run: |
          python -m py_compile research/ats-joint-score-iprojection-v1/preflight_support_audit.py
      - name: Run canonical-null reproduction and fail-closed support audit
        run: |
          rm -f research/ats-joint-score-iprojection-v1/PREFLIGHT_RECEIPT.json
          python research/ats-joint-score-iprojection-v1/preflight_support_audit.py
      - name: Verify chronology boundary and scientific disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/ats-joint-score-iprojection-v1/PREFLIGHT_RECEIPT.json')
          r = json.loads(p.read_text())
          assert r['completed_2026_outcomes_used'] == 0
          assert r['production_changed'] is False
          assert r['candidate_target_probabilities_generated'] is False
          assert r['candidate_target_proper_scores_generated'] is False
          assert r['candidate_target_ats_results_generated'] is False
          assert r['primary_null_reproduction']['status'] == 'PASS'
          if r['support_invariant']['status'] == 'FAIL':
              assert r['scientific_status'] == 'FAILED'
              assert r['phase_disposition'] == 'FAIL_CLOSED_BEFORE_TARGET_SCORING'
          else:
              assert r['scientific_status'] == 'PREFLIGHT_PASS'
              assert r['phase_disposition'] == 'AUTHORIZED_FOR_FROZEN_TARGET_SCORING'
          print(json.dumps({
              'scientific_status': r['scientific_status'],
              'primary_null': r['primary_null_reproduction']['status'],
              'support': r['support_invariant']['status'],
              'min_best_case_tail_at_160': r['support_invariant']['minimum_best_case_tail_at_160'],
              'required_bound_min': r['support_invariant']['best_case_required_bound_min'],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload immutable preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-jsip-v1-preflight-${{ github.run_id }}
          path: research/ats-joint-score-iprojection-v1/PREFLIGHT_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
