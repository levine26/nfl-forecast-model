name: Daily NFL model refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/weekly.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/weekly.yml"
  schedule:
    # Full football-model rebuild every morning. Market-only refreshes run hourly.
    - cron: "5 14 * * *"
permissions:
  contents: write
concurrency:
  group: nfl-forecast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_CORETYPE: SKYLAKEX
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      NUMEXPR_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: pip install ".[dev]"
      - run: pytest -q
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: nflreadpy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nflreadpy-${{ runner.os }}-
      - name: Validate regenerated outputs on pull request
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cp outputs/this_week.csv /tmp/baseline-this-week.csv
          cp outputs/power_ratings.csv /tmp/baseline-power.csv
          cp outputs/model_leaderboard.csv /tmp/baseline-model-leaderboard.csv
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" python scripts/run_week.py --season 2026 --snapshot EARLY
          python - <<'PY'
          import numpy as np
          import pandas as pd

          before = pd.read_csv('/tmp/baseline-this-week.csv')
          after = pd.read_csv('outputs/this_week.csv')
          merged = before[['game_id','pick','final_home_prob','pure_home_prob','expected_margin']].merge(
              after[['game_id','pick','final_home_prob','pure_home_prob','expected_margin']],
              on='game_id', suffixes=('_before','_after'), validate='one_to_one'
          )
          merged['final_delta_pp'] = (merged.final_home_prob_after - merged.final_home_prob_before) * 100
          merged['pure_delta_pp'] = (merged.pure_home_prob_after - merged.pure_home_prob_before) * 100
          merged['margin_delta'] = merged.expected_margin_after - merged.expected_margin_before
          print('\n=== CORRECTED FEATURE OUTPUT DELTA ===')
          print(merged[['game_id','pick_before','pick_after','final_delta_pp','pure_delta_pp','margin_delta']].to_string(index=False))
          print('max abs final probability delta (pp):', round(merged.final_delta_pp.abs().max(), 3))
          print('pick changes:', int((merged.pick_before != merged.pick_after).sum()))

          power = pd.read_csv('outputs/power_ratings.csv')
          metrics = ['off_epa','def_epa_allowed','pass_epa','recent_win_pct']
          signatures = power[metrics].round(12).astype(str).agg('|'.join, axis=1)
          duplicated = power.assign(signature=signatures).groupby('signature').team.apply(list)
          duplicated = duplicated[duplicated.map(len) > 1]
          print('\n=== EXACT POWER PROFILE DUPLICATES AFTER FIX ===')
          print(duplicated.to_string() if len(duplicated) else 'none')
          if len(duplicated):
              raise SystemExit('corrected rolling pipeline still produces exact multi-team efficiency-profile duplicates')

          old_lb = pd.read_csv('/tmp/baseline-model-leaderboard.csv')
          new_lb = pd.read_csv('outputs/model_leaderboard.csv')
          cols = ['model','games','winner_pct','brier','log_loss','margin_mae','total_mae']
          old_lb = old_lb[cols]
          new_lb = new_lb[cols]
          # F-ST promotion makes the old 75/25 ensemble an explicitly named legacy
          # comparator. Normalize only that label so its historical metrics remain
          # subject to the exact same PR audit rather than disappearing from the join.
          old_lb['model'] = old_lb['model'].replace({'Final Ensemble': 'Legacy Final Ensemble'})
          audit = old_lb.merge(new_lb, on='model', suffixes=('_before','_after'), validate='one_to_one')
          for metric in ['winner_pct','brier','log_loss','margin_mae','total_mae']:
              audit[f'{metric}_delta'] = audit[f'{metric}_after'] - audit[f'{metric}_before']
          print('\n=== OOS 2022-25 LEADERBOARD DELTA ===')
          print(audit.to_string(index=False))

          if len(audit) != len(old_lb) or len(audit) != len(new_lb):
              raise SystemExit('model leaderboard row set changed unexpectedly')
          if not (audit.games_before == audit.games_after).all():
              raise SystemExit('OOS evaluation sample size changed; investigate before merge')
          key = audit[audit.model.eq('Legacy Final Ensemble')]
          if len(key) != 1:
              raise SystemExit('Legacy Final Ensemble row missing from corrected OOS leaderboard')
          required = ['winner_pct_after','brier_after','log_loss_after','margin_mae_after','total_mae_after']
          if not np.isfinite(key[required].to_numpy(dtype=float)).all():
              raise SystemExit('corrected Legacy Final Ensemble OOS metrics contain non-finite values')
          market = audit[audit.model.eq('Market')]
          if len(market) == 1:
              for metric in ['winner_pct','brier','log_loss','margin_mae','total_mae']:
                  before_v = float(market.iloc[0][f'{metric}_before'])
                  after_v = float(market.iloc[0][f'{metric}_after'])
                  if abs(before_v - after_v) > 1e-12:
                      raise SystemExit(f'market benchmark changed during football-feature repair: {metric}')
          PY
      - name: Generate and publish outputs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "nfl-model-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "main advanced during generation; regenerating from current main (attempt $attempt/3)"
              git reset --hard origin/main
              git clean -fd outputs/
            fi

            PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
              python scripts/run_week.py --season 2026 --snapshot EARLY
            git add outputs/

            if git diff --cached --quiet; then
              echo "No forecast output changes to publish."
              exit 0
            fi

            git commit -m "Update NFL forecasts"
            base_sha=$(git rev-parse HEAD^)
            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$base_sha" ]; then
              echo "Push failed even though main did not advance; refusing to mask a non-race publish error."
              exit 1
            fi
          done

          echo "main changed during all three generation attempts; leaving existing published outputs untouched."
          exit 1
