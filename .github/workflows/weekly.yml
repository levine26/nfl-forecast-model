name: Daily NFL model refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/weekly.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/weekly.yml"
  schedule:
    # Full football-model rebuild every morning. Market-only refreshes run hourly.
    - cron: "5 14 * * *"
permissions:
  contents: write
concurrency:
  group: nfl-forecast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
      - run: pytest -q
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: .cache/nflreadpy
          key: nflreadpy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nflreadpy-${{ runner.os }}-
      - name: Generate and publish outputs
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "nfl-model-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "main advanced during generation; regenerating from current main (attempt $attempt/3)"
              git reset --hard origin/main
              git clean -fd outputs/
            fi

            PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
              python scripts/run_week.py --season 2026 --snapshot EARLY
            git add outputs/

            if git diff --cached --quiet; then
              echo "No forecast output changes to publish."
              exit 0
            fi

            git commit -m "Update NFL forecasts"
            base_sha=$(git rev-parse HEAD^)
            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$base_sha" ]; then
              echo "Push failed even though main did not advance; refusing to mask a non-race publish error."
              exit 1
            fi
          done

          echo "main changed during all three generation attempts; leaving existing published outputs untouched."
          exit 1
