name: LevLine V09B modern direct roster-depth source probe V2

on:
  pull_request:
    paths:
      - 'research/availability/v09b_modern_roster_depth_source_probe_v2_contract.json'
      - 'research/v09b_modern_roster_depth_source_probe_v2.py'
      - 'research/test_v09b_modern_roster_depth_source_probe_v2.py'
      - '.github/workflows/research_v09b_modern_roster_depth_source_probe_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-v09b-modern-roster-depth-source-probe-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test direct roster-depth source semantics
        run: pytest -q research/test_v09b_modern_roster_depth_source_probe_v2.py
      - name: Validate preregistered V2 source-class contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/availability/v09b_modern_roster_depth_source_probe_v2_contract.json').read_text())
          assert c['status'] == 'PREREGISTERED_DIRECT_ROSTER_DEPTH_SOURCE_CLASS_PROBE_ONLY_NO_COVERAGE_OR_MEMBERSHIP_AUTHORITY'
          assert c['dependencies'] == ['V09B-MODERN-GAME-RELEASE-ROSTER-SOURCE-PROBE-V1-FAILURE']
          assert len(c['fixed_cross_era_samples']) == 5
          assert [x['season'] for x in c['fixed_cross_era_samples']] == [2017, 2018, 2019, 2020, 2021]
          assert c['source_requirements']['archive_page_must_link_exact_source_url'] is True
          assert c['source_requirements']['third_party_authority_allowed'] is False
          assert c['semantic_markers']['maximum_snapshot_age_days_for_viability'] == 7
          assert c['semantic_markers']['practice_squad_marker_required'] == 'PRACTICE SQUAD'
          assert c['explicit_non_gates']['all_team_game_locator_coverage_tested'] is False
          assert c['explicit_non_gates']['roster_snapshot_exactly_equals_kickoff_eligible_population'] is False
          assert c['explicit_non_gates']['same_day_transactions_reconciled'] is False
          assert c['authority']['probe_has_coverage_authority'] is False
          assert c['authority']['probe_has_membership_authority'] is False
          assert c['authority']['modern_game_day_roster_universe_qualified'] is False
          assert c['authority']['v09b_model_fit_authorized'] is False
          assert c['governance']['absence_from_inactive_used_as_positive'] is False
          assert c['governance']['completed_2026_outcomes_used'] == 0
          PY

  semantic-viability-probe:
    needs: unit-and-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install '.[dev]'
      - name: Probe five frozen direct first-party roster-depth PDFs
        id: probe
        continue-on-error: true
        run: |
          OUT=research_outputs/v09b_modern_roster_depth_source_probe_v2/result.json
          mkdir -p "$(dirname "$OUT")"
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_modern_roster_depth_source_probe_v2.py \
              --contract research/availability/v09b_modern_roster_depth_source_probe_v2_contract.json \
              --output "$OUT"
      - name: Assert authority firewall and diagnostic persistence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research_outputs/v09b_modern_roster_depth_source_probe_v2/result.json')
          assert p.exists(), 'V2 probe did not persist diagnostic result'
          r = json.loads(p.read_text())
          assert r['sample_count_expected'] == 5
          assert r['sample_count_completed'] == 5
          assert r['source_errors'] == []
          assert all(x['pdf_magic_valid'] is True for x in r['samples'])
          assert all(x['source_host'] == 'static.clubs.nfl.com' for x in r['samples'])
          assert r['all_team_game_locator_coverage_tested'] is False
          assert r['game_day_membership_constructed'] is False
          assert r['same_day_transactions_reconciled'] is False
          assert r['standard_elevations_reconciled'] is False
          assert r['inactive_lists_reconciled'] is False
          assert r['probe_has_coverage_authority'] is False
          assert r['probe_has_membership_authority'] is False
          assert r['modern_game_day_roster_universe_qualified'] is False
          assert r['modern_player_team_game_identity_qualified'] is False
          assert r['training_label_semantics_qualified'] is False
          assert r['training_source_chronology_qualified'] is False
          assert r['v09b_model_fit_authorized'] is False
          assert r['weekly_roster_membership_used'] is False
          assert r['weekly_roster_status_used'] is False
          assert r['postgame_participation_used_as_training_authority'] is False
          assert r['absence_from_inactive_used_as_positive'] is False
          assert r['completed_2026_outcomes_used'] == 0
          assert r['model_fit_performed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v09b-modern-roster-depth-source-probe-v2-${{ github.run_id }}
          path: research_outputs/v09b_modern_roster_depth_source_probe_v2/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce frozen V2 semantic viability gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('research_outputs/v09b_modern_roster_depth_source_probe_v2/result.json').read_text())
          assert r['source_class_semantic_viability_probe_pass'] is True
          assert all(x['semantic_viability_gate_pass'] is True for x in r['samples'])
          assert all(x['exact_source_link_present'] is True for x in r['samples'])
          assert all(x['current_roster_marker_count'] > 0 for x in r['samples'])
          assert all(x['practice_squad_marker_count'] > 0 for x in r['samples'])
          assert all(x['reserve_marker_count'] > 0 for x in r['samples'])
          assert all(x['chosen_pregame_roster_snapshot'] is not None for x in r['samples'])
          PY

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
