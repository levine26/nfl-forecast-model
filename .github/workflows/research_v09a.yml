name: LevLine v0.9A player-value research

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/challenger_v09a.py'
      - 'src/nfl_forecast/player_state_research.py'
      - 'scripts/run_challenger_v09a.py'
      - 'scripts/run_player_state_research.py'
      - 'tests/test_challenger_v09a.py'
      - 'tests/test_player_state_research.py'
      - '.github/workflows/research_v09a.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-v09a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  historical-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test v0.9A leakage and player-state contracts
        run: pytest -q tests/test_challenger_v09a.py tests/test_player_state_research.py tests/test_challenger_v08.py
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: nfl-v09a-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nfl-v09a-${{ runner.os }}-
            nfl-player-state-${{ runner.os }}-
            nfl-challenger-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Run leakage-safe 2022-25 player-value ablations
        run: |
          rm -rf challenger_outputs/v09a
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" python scripts/run_challenger_v09a.py
          test -s challenger_outputs/v09a/report.json
          test -s challenger_outputs/v09a/paired_predictions_2022_2025.csv
          test -s challenger_outputs/v09a/overall_metrics.csv
          test -s challenger_outputs/v09a/season_metrics.csv
          test -s challenger_outputs/v09a/player_feature_stability.csv
      - name: Prove production outputs and site are untouched
        run: git diff --exit-code -- outputs/ site/
      - uses: actions/upload-artifact@v4
        with:
          name: levline-v09a-${{ github.run_id }}
          path: challenger_outputs/v09a/
          retention-days: 30
