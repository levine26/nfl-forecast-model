name: LevLine 4 prospective horizon evaluation v1

on:
  pull_request:
    paths:
      - 'research/levline4_horizon_eval_v1.py'
      - 'research/levline4_horizon_eligibility_v1.py'
      - 'research/run_levline4_horizon_eval_v1.py'
      - 'research/test_levline4_horizon_eval_v1.py'
      - 'research/test_levline4_horizon_eligibility_v1.py'
      - 'research/levline4_horizon_inference_contract_v1.json'
      - 'research/LEVLINE_4_EVALUATION_GOVERNANCE_V2.md'
      - '.github/workflows/research_levline4_horizon_eval_v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight evaluator dependencies
        run: python -m pip install pytest 'pandas==3.0.5' 'numpy==2.4.6'
      - name: Validate paired scoring, PIT cutoffs and promotion firewall
        run: >-
          python -m pytest -q
          research/test_levline4_horizon_eval_v1.py
          research/test_levline4_horizon_eligibility_v1.py

  evaluate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: levline-research-market-capture-v2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore market/shadow research ledger
        run: |
          set -euo pipefail
          git fetch origin research-data/market-capture-v2:refs/remotes/origin/research-data/market-capture-v2 || true
          mkdir -p research_outputs/market_capture_v2
          if git show-ref --verify --quiet refs/remotes/origin/research-data/market-capture-v2; then
            git archive origin/research-data/market-capture-v2 research_outputs/market_capture_v2 2>/dev/null | tar -xf - || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install lightweight evaluator dependencies
        run: |
          python -m pip install 'pandas==3.0.5' 'numpy==2.4.6'
          python -m pip install -e . --no-deps

      - name: Score frozen LevLine 4 shadows without fitting
        run: python -m research.run_levline4_horizon_eval_v1

      - name: Persist evaluation away from main
        run: |
          set -euo pipefail
          DATA_DIR=research_outputs/market_capture_v2
          test -s "$DATA_DIR/levline4_horizon_eval.json"
          rm -rf /tmp/market_capture_v2
          cp -R "$DATA_DIR" /tmp/market_capture_v2
          rm -rf "$DATA_DIR"
          git config user.name 'levline-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/research-data/market-capture-v2; then
            git checkout -B market-capture-v2-data origin/research-data/market-capture-v2
          else
            git checkout -B market-capture-v2-data
          fi
          mkdir -p research_outputs
          rm -rf research_outputs/market_capture_v2
          cp -R /tmp/market_capture_v2 research_outputs/market_capture_v2
          git add research_outputs/market_capture_v2/
          if git diff --cached --quiet; then
            echo 'Prospective evaluation unchanged.'
            exit 0
          fi
          git commit -m 'Score frozen LevLine 4 horizon shadows'
          git push origin HEAD:research-data/market-capture-v2
