name: LevLine V09B legacy gamebook structure probe

on:
  pull_request:
    paths:
      - 'research/v09b_legacy_gamebook_structure_probe_v1.py'
      - '.github/workflows/research_v09b_legacy_gamebook_structure_probe_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-probe:
    strategy:
      fail-fast: false
      matrix:
        season: [2012, 2013, 2014, 2015, 2016]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install '.[dev]'
      - name: Probe one official legacy Game Book
        run: |
          mkdir -p research_outputs/v09b_legacy_gamebook_structure_probe_v1
          PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python research/v09b_legacy_gamebook_structure_probe_v1.py \
              --season ${{ matrix.season }} \
              --output research_outputs/v09b_legacy_gamebook_structure_probe_v1/${{ matrix.season }}.json
      - name: Assert diagnostic-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          season = '${{ matrix.season }}'
          result = json.loads(Path(f'research_outputs/v09b_legacy_gamebook_structure_probe_v1/{season}.json').read_text())
          assert result['qualification_authority'] is False
          assert result['player_labels_constructed'] is False
          assert result['game_day_roster_universe_constructed'] is False
          assert result['model_fit_performed'] is False
          assert result['game_outcomes_used'] == 0
          assert result['completed_2026_outcomes_used'] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v09b-legacy-gamebook-structure-probe-${{ matrix.season }}-${{ github.run_id }}
          path: research_outputs/v09b_legacy_gamebook_structure_probe_v1/${{ matrix.season }}.json
          retention-days: 30

  research-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove probe remains research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = [x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad = [x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
