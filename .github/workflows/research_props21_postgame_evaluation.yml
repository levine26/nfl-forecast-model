name: LevLine Props 2.1 postgame evaluation

on:
  push:
    branches:
      - research/props21-postgame-evaluation-r2
    paths:
      - 'research/props/v21/**'
      - 'research/props/evaluation/PROPS_ACCURACY_EVALUATION_PREREGISTRATION.md'
      - '.github/workflows/research_props21_postgame_evaluation.yml'
  pull_request:
    paths:
      - 'research/props/v21/**'
      - 'research/props/evaluation/PROPS_ACCURACY_EVALUATION_PREREGISTRATION.md'
      - '.github/workflows/research_props21_postgame_evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile postgame evaluator
        run: |
          python -m py_compile research/props/v21/props_accuracy_preregistered.py
          python -m py_compile research/props/v21/evaluate_props21_prospective.py
      - name: Run frozen evaluator mechanics tests
        env:
          PYTHONPATH: research/props/v21
        run: |
          python -m pytest -q \
            research/props/v21/test_props_accuracy_preregistered.py \
            research/props/v21/test_props21_postgame_evaluation.py
      - name: Verify research firewall
        run: |
          python scripts/check_research_firewall.py \
            --base-ref origin/main \
            --head-ref HEAD

  evaluate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Recover exact frozen Week 2 evidence
        run: |
          set -euo pipefail
          SOURCE=ba723255982c79ffe6072c714dd0ee2c37e1fa34
          P21_PATH=challenger_outputs/props21/forecast_originals.jsonl
          V1_PATH=outputs/props/forecasts.json

          git cat-file -e "$SOURCE^{commit}"
          P21_BLOB=$(git rev-parse "$SOURCE:$P21_PATH")
          V1_BLOB=$(git rev-parse "$SOURCE:$V1_PATH")
          test "$P21_BLOB" = "e89cdce268fb10c5107ba6db4087107fb213555f"
          test "$V1_BLOB" = "ec61a5ae36f2e307b4bde1fc4c5a0fa6255923dc"

          mkdir -p /tmp/props21-eval
          git show "$SOURCE:$P21_PATH" > /tmp/props21-eval/forecast_originals.jsonl
          git show "$SOURCE:$V1_PATH" > /tmp/props21-eval/v1_forecasts.json

          test "$(wc -l < /tmp/props21-eval/forecast_originals.jsonl)" -eq 3439
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/props21-eval/v1_forecasts.json')
          payload=json.loads(p.read_text())
          assert len(payload['forecasts']) == 3439
          assert payload['game_count'] == 15
          PY
      - name: Validate exact cohort before outcome loading
        env:
          PYTHONPATH: research/props/v21
        run: |
          python - <<'PY'
          from pathlib import Path
          import evaluate_props21_prospective as ev
          p21=ev._read_jsonl(Path('/tmp/props21-eval/forecast_originals.jsonl'))
          v1=ev._read_v1(Path('/tmp/props21-eval/v1_forecasts.json'))
          _,audit=ev.verify_frozen_cohort(p21,v1)
          assert audit['props21_receipts'] == 3439
          assert audit['matched_v1_sources'] == 3439
          assert audit['numeric_identity_vs_v1'] is True
          assert audit['game_count'] == 15
          print(audit)
          PY
      - name: Score finalized cohort games
        env:
          PYTHONPATH: research/props/v21
        run: |
          python research/props/v21/evaluate_props21_prospective.py \
            --props21-ledger /tmp/props21-eval/forecast_originals.jsonl \
            --v1-forecasts /tmp/props21-eval/v1_forecasts.json \
            --output-dir /tmp/props21-eval/results \
            --bootstrap-replicates 5000 \
            | tee /tmp/props21-eval/evaluation.log
      - name: Enforce postgame governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('/tmp/props21-eval/results/summary.json').read_text())
          assert summary['props21_postgame_contract_version'] == 'levline-props-2.1-postgame-eval-v0.1.0'
          assert summary['cohort_integrity']['numeric_identity_vs_v1'] is True
          assert summary['governance']['research_only'] is True
          assert summary['governance']['production_authorized'] is False
          assert summary['governance']['original_receipts_mutated'] is False
          assert summary['governance']['model_tuned_from_outcomes'] is False
          assert summary['governance']['single_week_market_superiority_claim_authorized'] is False
          assert summary['component_value']['numerical_forecast_change_vs_v1'] is False
          assert summary['component_value']['predictive_score_delta_vs_v1'] == 0.0
          assert summary['graded_sample']['forecasts'] <= 3439
          print(json.dumps({
            'graded_sample': summary['graded_sample'],
            'eligibility_audit': summary['eligibility_audit'],
            'completed_cohort_games': summary['outcome_source_audit']['completed_cohort_games'],
            'unfinalized_cohort_games': summary['outcome_source_audit']['unfinalized_cohort_games'],
            'continuous': summary['continuous'],
            'probability': summary['probability'],
            'market_relative': summary['market_relative'],
            'component_value': summary['component_value'],
          }, indent=2))
          PY
      - name: Upload postgame evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: props21-week02-postgame-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: |
            /tmp/props21-eval/results
            /tmp/props21-eval/evaluation.log
          if-no-files-found: error
          retention-days: 90
