name: Preserve exact Phase 4 first-run holdout artifact

on:
  push:
    branches: [research/spread-points-nextgen-phase4]
    paths:
      - '.github/workflows/research_spread_points_phase4_preserve.yml'

permissions:
  actions: read
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/spread-points-nextgen-phase4
      - name: Download exact first-run holdout artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10732945725'
          EXPECTED_ZIP_DIGEST: '7e231406237dc0f27681cc974d07ba34a6fe3bb976bea42531bedc8166557671'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/phase4.zip
          actual=$(sha256sum /tmp/phase4.zip | awk '{print $1}')
          echo "artifact_zip_sha256=$actual"
          # GitHub's artifact metadata digest refers to the uploaded artifact payload;
          # preserve it in provenance even if archive transport re-packs ZIP bytes.
          echo "metadata_digest=sha256:$EXPECTED_ZIP_DIGEST"
          rm -rf /tmp/phase4 && mkdir -p /tmp/phase4
          unzip -q /tmp/phase4.zip -d /tmp/phase4
      - name: Verify exact first-run provenance and evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('/tmp/phase4')
          manifest=json.loads((root/'HOLDOUT_RUN_MANIFEST.json').read_text())
          assert manifest['generator_git_head']=='f0b92217488a1a000bee74a903a9437931a53230'
          assert manifest['opening_receipt_commit']=='362af7af7db43a715b9ab9537a52d2749c37e7a6'
          assert manifest['target_season']==2025 and manifest['2025_opened'] is True
          assert manifest['candidate5_trained'] is False
          assert manifest['completed_2026_outcomes_used'] is False
          assert manifest['production_changed'] is False
          assert manifest['implementation_sha256']=='5f148219527b07d85261d3f196ace97a5eb5646271d43596032a692389abc579'
          assert manifest['config_sha256']=='2c5cc1af74fc5f3955e44361b82b791710e4b63bbc69b0c15570617e2d86e543'
          expected=manifest['evidence_sha256']
          for name, digest in expected.items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual==digest, (name, actual, digest)
          required={
              'A0_HOLDOUT_2025.csv','B0_HOLDOUT_2025.csv','C0_HOLDOUT_2025.csv',
              'BASELINES_HOLDOUT_2025.csv','DIAGNOSTIC_SLICES_2025.csv',
              'HOLDOUT_SUMMARY.json','HOLDOUT_RUN_MANIFEST.json'}
          assert required.issubset({p.name for p in root.iterdir()})
          PY
      - name: Commit exact first-run evidence bytes
        shell: bash
        run: |
          set -euo pipefail
          dest='research/spread-points-nextgen/phase4'
          for file in A0_HOLDOUT_2025.csv B0_HOLDOUT_2025.csv C0_HOLDOUT_2025.csv BASELINES_HOLDOUT_2025.csv DIAGNOSTIC_SLICES_2025.csv HOLDOUT_SUMMARY.json HOLDOUT_RUN_MANIFEST.json; do
            cp "/tmp/phase4/$file" "$dest/$file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"/*.csv "$dest/HOLDOUT_SUMMARY.json" "$dest/HOLDOUT_RUN_MANIFEST.json"
          git commit -m 'research: preserve exact first-run Phase 4 2025 holdout evidence [skip ci]'
          git pull --rebase origin research/spread-points-nextgen-phase4
          git push origin HEAD:research/spread-points-nextgen-phase4
