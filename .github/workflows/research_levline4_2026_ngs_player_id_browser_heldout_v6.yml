name: LevLine 4 NGS player ID browser held-out V6

on:
  pull_request:
    paths:
      - '.github/workflows/research_levline4_2026_ngs_player_id_browser_heldout_v6.yml'
      - 'research/levline4_2026_ngs_player_id_browser_heldout_v6*'
      - 'research/test_levline4_2026_ngs_player_id_browser_heldout_v6.py'

concurrency:
  group: levline4-ngs-player-id-browser-heldout-v6-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CONTRACT_PATH: research/levline4_2026_ngs_player_id_browser_heldout_v6_contract.json
  MANIFEST_PATH: research/levline4_2026_ngs_player_id_browser_heldout_v6_first_result_manifest.json
  FROZEN_CONTRACT_COMMIT: 7e041e7f8528bc82af2f1784e72d5b933f0c37c3
  FROZEN_IMPLEMENTATION_COMMIT: 36071f76486856256fd213ab64e998b7007b39a3
  FROZEN_TESTS_COMMIT: f8456406580753fef62e84a5c550b8d8a1487c74
  FROZEN_CONTRACT_BLOB: c5b6df56f57b6388fd22bcb2b21faa2c49a0b794
  FROZEN_V5_BASE_BLOB: e21938b45180b5ed1db0ebb48aa3f8dc784bec33
  FROZEN_V6_IMPLEMENTATION_BLOB: 9d75dd5d54dcefd3085b83d93f5d8e9cb4a30705
  FROZEN_V6_TESTS_BLOB: 1e3e4cd31a5da33044681a3caf0aa7d796551088
  OFFICIAL_ARTIFACT_ID: '10461126275'
  OFFICIAL_RUN_ID: '35130069924'
  OFFICIAL_HEAD_SHA: '1280e4a06eacf3e30700f75d4dab9ecff99944a4'
  OFFICIAL_DIGEST: 'sha256:7ba9c87c8de3392505327e572cf6730d901113d2c22ca25daef3a3dc8a01fe3e'
  OFFICIAL_ROSTER_SHA256: '90c3974677862b8838acf2afaf6bec07087ce9784a7ab01491d8dcfd1f41489f'
  V3_ARTIFACT_ID: '10472217076'
  V3_RUN_ID: '35159301387'
  V3_HEAD_SHA: 'fd4224805a46712c6d240cced51ef7d93ac50f9b'
  V3_DIGEST: 'sha256:af586ab4b827a8a99422d02d3265ca70f540cc5279770345acb5af5cd5037958'
  V3_SELECTION_SHA256: '437a94fa92709d60f0c3b2d88a4e52ce8f3dfd7f6241109793f4d991b8222f8d'
  V5_ARTIFACT_ID: '10473671117'
  V5_RUN_ID: '35162079741'
  V5_HEAD_SHA: '2fbd9cbb76efc12448581eb1ed393a579cfd60b9'
  V5_DIGEST: 'sha256:961994eb487c59103f5388708456659e40e11d13ee4462494f7d093876787c90'
  V5_SELECTION_SHA256: '6ae6e017cd24593657921ee82d023541b0feb679a37aa0051c17fe4ab2244e7a'
  V3_DATA_BRANCH: research-data/levline4-ngs-player-id-browser-heldout-v3
  V4_DATA_BRANCH: research-data/levline4-ngs-player-id-browser-heldout-v4
  V5_DATA_BRANCH: research-data/levline4-ngs-player-id-browser-heldout-v5-observed

jobs:
  preregistration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove contract-first chronology and frozen blobs
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FROZEN_CONTRACT_COMMIT" "$FROZEN_IMPLEMENTATION_COMMIT"
          git merge-base --is-ancestor "$FROZEN_IMPLEMENTATION_COMMIT" "$FROZEN_TESTS_COMMIT"
          git merge-base --is-ancestor "$FROZEN_TESTS_COMMIT" HEAD
          test "$(git rev-parse "${FROZEN_CONTRACT_COMMIT}:${CONTRACT_PATH}")" = "$FROZEN_CONTRACT_BLOB"
          test "$(git hash-object "$CONTRACT_PATH")" = "$FROZEN_CONTRACT_BLOB"
          test "$(git hash-object research/levline4_2026_ngs_player_id_browser_heldout_v6_frozen_base.py)" = "$FROZEN_V5_BASE_BLOB"
          test "$(git hash-object research/levline4_2026_ngs_player_id_browser_heldout_v6.py)" = "$FROZEN_V6_IMPLEMENTATION_BLOB"
          test "$(git hash-object research/test_levline4_2026_ngs_player_id_browser_heldout_v6.py)" = "$FROZEN_V6_TESTS_BLOB"
      - name: Require durable V3 V4 and governance-held V5 evidence
        run: |
          set -euo pipefail
          git fetch origin "${V3_DATA_BRANCH}:refs/remotes/origin/${V3_DATA_BRANCH}"
          git fetch origin "${V4_DATA_BRANCH}:refs/remotes/origin/${V4_DATA_BRANCH}"
          git fetch origin "${V5_DATA_BRANCH}:refs/remotes/origin/${V5_DATA_BRANCH}"
          python - <<'PY'
          import json,subprocess,os
          def show(branch,path):
              return json.loads(subprocess.check_output(['git','show',f'origin/{branch}:{path}'],text=True))
          v3=show(os.environ['V3_DATA_BRANCH'],'research_outputs/levline4_2026_ngs_player_id_browser_heldout_v3/first_result_35159301387/preservation.json')
          assert v3['source_actions_artifact_id']==int(os.environ['V3_ARTIFACT_ID'])
          assert v3['canonical_result']=='FAIL' and v3['production_authorized'] is False
          v4=show(os.environ['V4_DATA_BRANCH'],'research_outputs/levline4_2026_ngs_player_id_browser_heldout_v4/first_result_35162256814/preservation.json')
          assert v4['source_actions_artifact_id']==10473865589
          assert v4['canonical_result']=='TECHNICAL_FAIL_PRE_REQUEST'
          assert v4['scientific_disposition']=='NOT_EVALUATED'
          assert v4['ngs_request_count']==0 and v4['production_authorized'] is False
          v5=show(os.environ['V5_DATA_BRANCH'],'research_outputs/levline4_2026_ngs_player_id_browser_heldout_v5_observed/first_result_35162079741/preservation.json')
          assert v5['source_actions_artifact_id']==int(os.environ['V5_ARTIFACT_ID'])
          assert v5['observed_result']=='PASS'
          assert v5['scientific_authority_status']=='SUSPENDED_GOVERNANCE_PROVENANCE_CONFLICT'
          assert v5['v5_target_rows_must_be_excluded_from_fresh_successor_validation'] is True
          assert v5['production_authorized'] is False
          PY
      - name: Unit-test frozen V6 selection semantics gates and authority
        run: |
          python -m pip install -q pytest
          pytest -q research/test_levline4_2026_ngs_player_id_browser_heldout_v6.py
          python -m research.levline4_2026_ngs_player_id_browser_heldout_v6 --help >/dev/null
      - name: Prove research-only effective diff
        run: |
          set -euo pipefail
          git fetch origin main
          bad=0
          while IFS= read -r path; do
            case "$path" in
              research/levline4_2026_ngs_player_id_browser_heldout_v6.py|research/levline4_2026_ngs_player_id_browser_heldout_v6_contract.json|research/levline4_2026_ngs_player_id_browser_heldout_v6_frozen_base.py|research/test_levline4_2026_ngs_player_id_browser_heldout_v6.py|research/levline4_2026_ngs_player_id_browser_heldout_v6_first_result_manifest.json|.github/workflows/research_levline4_2026_ngs_player_id_browser_heldout_v6.yml) ;;
              *) echo "Forbidden V6 diff path: $path"; bad=1 ;;
            esac
          done < <(git diff --name-only origin/main...HEAD)
          test "$bad" = 0

  mode:
    runs-on: ubuntu-24.04
    outputs:
      manifest_exists: ${{ steps.mode.outputs.manifest_exists }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        run: |
          if [ -f "$MANIFEST_PATH" ]; then
            echo 'manifest_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'manifest_exists=false' >> "$GITHUB_OUTPUT"
          fi

  live-heldout:
    if: needs.mode.outputs.manifest_exists == 'false'
    needs: [preregistration, mode]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify frozen source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_download() {
            local artifact="$1" run="$2" head="$3" digest="$4" zip="$5" dir="$6"
            meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}")
            test "$(echo "$meta" | jq -r .digest)" = "$digest"
            test "$(echo "$meta" | jq -r .workflow_run.id)" = "$run"
            test "$(echo "$meta" | jq -r .workflow_run.head_sha)" = "$head"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}/zip" > "$zip"
            rm -rf "$dir"; mkdir -p "$dir"; unzip -q "$zip" -d "$dir"
          }
          verify_download "$OFFICIAL_ARTIFACT_ID" "$OFFICIAL_RUN_ID" "$OFFICIAL_HEAD_SHA" "$OFFICIAL_DIGEST" /tmp/official.zip /tmp/official
          verify_download "$V3_ARTIFACT_ID" "$V3_RUN_ID" "$V3_HEAD_SHA" "$V3_DIGEST" /tmp/v3.zip /tmp/v3
          verify_download "$V5_ARTIFACT_ID" "$V5_RUN_ID" "$V5_HEAD_SHA" "$V5_DIGEST" /tmp/v5.zip /tmp/v5
          test "$(sha256sum /tmp/official/roster_metadata.jsonl | cut -d' ' -f1)" = "$OFFICIAL_ROSTER_SHA256"
          test "$(sha256sum /tmp/v3/target_selection.json | cut -d' ' -f1)" = "$V3_SELECTION_SHA256"
          test "$(sha256sum /tmp/v5/target_selection.json | cut -d' ' -f1)" = "$V5_SELECTION_SHA256"
      - name: Reproduce frozen 78-target population before Playwright or NGS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research import levline4_2026_ngs_player_id_browser_heldout_v6 as v6
          from research import levline4_2026_ngs_player_id_browser_heldout_v6_frozen_base as frozen
          contract=json.loads(Path('research/levline4_2026_ngs_player_id_browser_heldout_v6_contract.json').read_text())
          rows=frozen.load_jsonl(Path('/tmp/official/roster_metadata.jsonl'))
          v3=json.loads(Path('/tmp/v3/target_selection.json').read_text())
          v5=json.loads(Path('/tmp/v5/target_selection.json').read_text())
          targets,diag=v6.select_targets(rows,contract,v3,v5)
          assert len(targets)==78
          assert diag['eligible_row_count']==2315
          assert diag['coverage_target_count']==64
          assert diag['team_alias_ari_target_count']==4
          assert diag['source_name_variant_target_count']==16
          assert diag['total_target_count']==78
          assert diag['sorted_row_identity_sha256']=='ca06c3eadf135223bfe9695b255906f3b42f42263aacc7262119ec84b041df35'
          assert diag['target_projection_sha256']=='fac150229b3426fee077ab82a1ef3dcf3ce010dbb1b39ddfac23bbf00a421b2e'
          prior={frozen.row_identity(x) for x in v3['targets']} | {frozen.row_identity(x) for x in v5['targets']}
          assert not ({frozen.row_identity(x) for x in targets} & prior)
          Path('/tmp/v6_preflight_selection.json').write_text(json.dumps({'diagnostics':diag,'targets':targets},indent=2,sort_keys=True)+'\n')
          PY
      - name: Install Playwright only after target freeze is reproduced
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Execute canonical V6 browser-context held-out probe
        run: |
          set -euo pipefail
          rm -rf /tmp/v6_result; mkdir -p /tmp/v6_result
          set +e
          python -m research.levline4_2026_ngs_player_id_browser_heldout_v6 \
            --contract "$CONTRACT_PATH" \
            --roster-metadata /tmp/official/roster_metadata.jsonl \
            --v3-target-selection /tmp/v3/target_selection.json \
            --v5-target-selection /tmp/v5/target_selection.json \
            --output-dir /tmp/v6_result > /tmp/v6_result/execution.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/v6_result/execution_exit_code.txt
          cp /tmp/v6_preflight_selection.json /tmp/v6_result/preflight_target_selection.json
      - name: Upload immutable first V6 artifact before disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levline4-ngs-player-id-browser-heldout-v6-first-${{ github.run_id }}
          path: /tmp/v6_result
          if-no-files-found: error
          retention-days: 30
      - name: Surface canonical scientific or technical disposition
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v6_result')
          rc=int((root/'execution_exit_code.txt').read_text().strip()) if (root/'execution_exit_code.txt').exists() else 999
          receipt=root/'receipt.json'
          if rc != 0 or not receipt.exists():
              raise SystemExit(f'canonical V6 technical failure after artifact upload: exit_code={rc}, receipt_exists={receipt.exists()}')
          obj=json.loads(receipt.read_text())
          if obj['status'] != 'PASS':
              raise SystemExit('canonical V6 scientific FAIL after artifact upload')
          print('canonical V6 scientific PASS')
          PY

  replay-canonical-first-result:
    if: needs.mode.outputs.manifest_exists == 'true'
    needs: [preregistration, mode]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify immutable canonical V6 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/coords
          import json,os
          m=json.load(open(os.environ['MANIFEST_PATH']))
          print(m['first_artifact_id'])
          print(m['first_workflow_run_id'])
          print(m['first_head_sha'])
          print(m['artifact_digest'])
          PY
          mapfile -t c < /tmp/coords
          artifact=${c[0]}; run=${c[1]}; head=${c[2]}; digest=${c[3]}
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}")
          test "$(echo "$meta" | jq -r .digest)" = "$digest"
          test "$(echo "$meta" | jq -r .workflow_run.id)" = "$run"
          test "$(echo "$meta" | jq -r .workflow_run.head_sha)" = "$head"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}/zip" > /tmp/v6.zip
          rm -rf /tmp/v6_replay; mkdir -p /tmp/v6_replay; unzip -q /tmp/v6.zip -d /tmp/v6_replay
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/v6_replay'); m=json.load(open(os.environ['MANIFEST_PATH']))
          observed={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          assert observed==m['file_sha256']
          assert m['first_result_is_canonical'] is True
          assert m['later_same_version_execution_may_replace_first_result'] is False
          assert m['same_version_rule_adaptation_after_first_result'] is False
          assert m['completed_2026_outcomes_used_for_design_or_selection']==0
          assert m['postgame_participation_used'] is False
          assert m['week2_inactive_execution_evidence_used_for_design'] is False
          assert m['f_st_01_frozen_2026_unchanged'] is True
          PY
