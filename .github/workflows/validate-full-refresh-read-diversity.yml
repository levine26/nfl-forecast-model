name: Validate full-refresh Read diversity
on:
  push:
    branches: [editorial/full-refresh-read-diversity]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/full-refresh-read-diversity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/patch_full_refresh_read_diversity.py
      - run: pip install '.[dev]'
      - name: Run unit suite
        run: pytest -q
      - name: Exercise complete production contextual publication path
        run: |
          python scripts/run_context.py --season 2026
          python scripts/polish_publication.py --season 2026 --probe-advanced
          python scripts/add_advanced_player_context.py --season 2026
          python scripts/add_career_qb_context.py --season 2026
          python scripts/finalize_editorial.py
      - name: Build dashboard from regenerated outputs
        run: |
          mkdir -p site/public/data
          for f in this_week.csv run_history.csv prediction_history.csv power_ratings.csv model_leaderboard.csv calibration.csv confidence_diagnostics.csv movement_attribution.csv team_profiles.csv status.json contextual_evidence.json game_previews.json context_source_status.json weekly_brief.json postgame_autopsies.json power_editorial.json history_scoreboard.json; do
            if [ -f "outputs/$f" ]; then cp "outputs/$f" "site/public/data/$f"; fi
          done
          cd site
          npm install
          npm run build
      - name: Commit only validated source changes and remove helpers
        run: |
          git config user.name "sunday-signal-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/patch_full_refresh_read_diversity.py .github/workflows/validate-full-refresh-read-diversity.yml
          git add src/nfl_forecast/editorial_voice.py scripts/polish_publication.py tests/test_publication_polish.py
          git commit -m "Keep Reads distinct through full contextual refresh"
          git push origin HEAD:editorial/full-refresh-read-diversity
