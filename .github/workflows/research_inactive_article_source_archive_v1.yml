name: LevLine research inactive article source archive v1

on:
  pull_request:
    paths:
      - 'research/inactive_article_source_contract_v1.json'
      - 'research/inactive_article_source_archive_v1.py'
      - 'research/run_inactive_article_source_archive_v1.py'
      - 'research/test_inactive_article_source_archive_v1.py'
      - 'research/levline4_prospective_inactive_execution_v1_contract.json'
      - 'research/levline4_prospective_inactive_execution_v1.py'
      - 'research/run_levline4_prospective_inactive_execution_v1.py'
      - 'research/test_levline4_prospective_inactive_execution_v1.py'
      - 'research/test_run_levline4_prospective_inactive_execution_v1.py'
      - '.github/workflows/research_inactive_article_source_archive_v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: levline-research-inactive-snapshot-archive-v1
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install pytest 'beautifulsoup4>=4.12' 'requests>=2.32' 'polars==1.44.2'
      - name: Validate raw article discovery, preservation and prospective execution
        run: |
          pytest -q \
            research/test_inactive_article_source_archive_v1.py \
            research/test_levline4_prospective_inactive_execution_v1.py \
            research/test_run_levline4_prospective_inactive_execution_v1.py
      - name: Verify frozen raw-source and prospective execution contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw = json.loads(Path('research/inactive_article_source_contract_v1.json').read_text())
          assert raw['archive_id'] == 'NFL-INACTIVE-ARTICLE-SOURCE-2026-V1'
          assert raw['season'] == 2026
          assert raw['capture_policy']['eligible_window_minutes_to_kickoff'] == [20, 100]
          assert raw['parser_policy']['player_level_parser_qualified'] is False
          assert raw['parser_policy']['player_level_probability_feature_authorized'] is False
          assert raw['research_firewall']['completed_2026_outcomes_used'] == 0
          assert raw['research_firewall']['probability_feature_authorized'] is False
          assert raw['research_firewall']['production_authorized'] is False

          c = json.loads(Path('research/levline4_prospective_inactive_execution_v1_contract.json').read_text())
          assert c['contract_id'] == 'LEVLINE-4-2026-PROSPECTIVE-INACTIVE-EXECUTION-V1'
          assert c['status'] == 'PREREGISTERED_BEFORE_FIRST_WEEK2_REAL_EXECUTION'
          assert c['dependencies']['resolver']['weekly_identity_projection_sha256'] == 'fc993e0543950222cd20e0c29e457980da572d100bebff6a5d4bf5f7b72b051f'
          assert c['dependencies']['resolver']['status_fields_available_to_resolver'] is False
          assert c['dependencies']['global_identity_audit']['projection_sha256'] == '023d7e5b652f56c1b41c432f394d81da60e2ab4df287daeb3baa1be76d6f2603'
          assert c['dependencies']['global_identity_audit']['fallback_resolution_authorized'] is False
          assert c['live_source_selection']['qualified_game_day_semantics'] == 'Sunday in America/New_York only'
          assert c['live_source_selection']['zero_matching_article_behavior'] == 'preserve waiting attempt and retry on a later scheduled capture'
          assert c['global_audit_rule']['global_source_is_never_a_fallback_resolver'] is True
          assert c['global_audit_rule']['cross_source_corroboration_alone_qualifies_player_identity_to_gsis'] is False
          assert c['authority']['player_identity_to_gsis_qualified'] is False
          assert c['authority']['availability_probability_feature_authorized'] is False
          assert c['authority']['production_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used_for_design_or_selection'] == 0
          assert c['governance']['f_st_01_frozen_2026_unchanged'] is True
          PY

  capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cheap pregame gate
        id: gate
        run: |
          RESULT=$(python -m research.inactive_snapshot_due_v1)
          echo "$RESULT"
          if echo "$RESULT" | grep -q '^due=true'; then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          else
            echo 'due=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore append-only article and prospective execution archives
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        run: |
          set -euo pipefail
          git fetch origin research-data/inactive-snapshots-v1:refs/remotes/origin/research-data/inactive-snapshots-v1 || true
          if git show-ref --verify --quiet refs/remotes/origin/research-data/inactive-snapshots-v1; then
            for DATA_DIR in \
              research_outputs/inactive_article_source_archive_v1 \
              research_outputs/levline4_prospective_inactive_execution_v1
            do
              if git ls-tree -d --name-only origin/research-data/inactive-snapshots-v1 "$DATA_DIR" | grep -q "^${DATA_DIR}$"; then
                git archive origin/research-data/inactive-snapshots-v1 "$DATA_DIR" | tar -xf -
              fi
            done
          fi

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install lightweight source collector and identity dependencies
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        run: python -m pip install 'beautifulsoup4>=4.12' 'requests>=2.32' 'polars==1.44.2'

      - name: Capture official NFL News and inactive article source bytes
        id: capture
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        continue-on-error: true
        run: PYTHONPATH="$PWD/src:$PWD" python -m research.run_inactive_article_source_archive_v1 ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Determine whether latest due cohort is inside qualified Sunday semantics
        id: semantics
        if: steps.capture.outcome == 'success'
        run: |
          RESULT=$(PYTHONPATH="$PWD/src:$PWD" python - <<'PY'
          from pathlib import Path
          from research.levline4_prospective_inactive_execution_v1 import _latest_due_observation
          from research.run_levline4_prospective_inactive_execution_v1 import cohort_is_sunday_eastern
          observation = _latest_due_observation(Path('research_outputs/inactive_article_source_archive_v1'))
          due_games = list((observation or {}).get('due_games') or [])
          print('true' if due_games and cohort_is_sunday_eastern(due_games) else 'false')
          PY
          )
          echo "sunday=$RESULT" >> "$GITHUB_OUTPUT"
          echo "qualified Sunday semantics: $RESULT"

      - name: Preserve non-Sunday skip receipt without reading identity sources
        id: nonsunday_execution
        if: steps.capture.outcome == 'success' && steps.semantics.outputs.sunday == 'false'
        continue-on-error: true
        run: |
          PYTHONPATH="$PWD/src:$PWD" python -m research.run_levline4_prospective_inactive_execution_v1 \
            --weekly-projection /tmp/not-read-weekly.parquet \
            --global-projection /tmp/not-read-global.parquet

      - name: Download frozen status-free weekly identity source artifact
        id: weekly_identity
        if: steps.capture.outcome == 'success' && steps.semantics.outputs.sunday == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: levline4-2026-status-free-identity-source-v1-35113550399
          path: /tmp/weekly_identity_source_v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35113550399

      - name: Download frozen global player identity audit artifact
        id: global_identity
        if: steps.capture.outcome == 'success' && steps.semantics.outputs.sunday == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: levline4-2026-global-player-identity-source-v1-35119017721
          path: /tmp/global_identity_source_v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35119017721

      - name: Execute qualified Sunday cohort parser and frozen resolver
        id: sunday_execution
        if: >-
          steps.capture.outcome == 'success' &&
          steps.semantics.outputs.sunday == 'true' &&
          steps.weekly_identity.outcome == 'success' &&
          steps.global_identity.outcome == 'success'
        continue-on-error: true
        run: |
          PYTHONPATH="$PWD/src:$PWD" python -m research.run_levline4_prospective_inactive_execution_v1 \
            --weekly-projection /tmp/weekly_identity_source_v1/projections/2026-fc993e0543950222cd20e0c29e457980da572d100bebff6a5d4bf5f7b72b051f.parquet \
            --global-projection /tmp/global_identity_source_v1/projections/players-023d7e5b652f56c1b41c432f394d81da60e2ab4df287daeb3baa1be76d6f2603.parquet

      - name: Persist raw and prospective execution evidence away from main
        if: always() && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true')
        run: |
          set -euo pipefail
          RAW_DIR=research_outputs/inactive_article_source_archive_v1
          EXEC_DIR=research_outputs/levline4_prospective_inactive_execution_v1
          if [ ! -s "$RAW_DIR/observations.jsonl" ]; then
            echo 'No inactive article source observations to persist.'
            exit 0
          fi
          rm -rf /tmp/inactive_article_source_archive_v1 /tmp/levline4_prospective_inactive_execution_v1
          cp -R "$RAW_DIR" /tmp/inactive_article_source_archive_v1
          if [ -d "$EXEC_DIR" ]; then
            cp -R "$EXEC_DIR" /tmp/levline4_prospective_inactive_execution_v1
          fi
          rm -rf "$RAW_DIR" "$EXEC_DIR"
          git config user.name 'levline-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/research-data/inactive-snapshots-v1; then
            git checkout -B inactive-snapshots-v1-data origin/research-data/inactive-snapshots-v1
          else
            git checkout -B inactive-snapshots-v1-data
          fi
          mkdir -p research_outputs
          rm -rf research_outputs/inactive_article_source_archive_v1
          cp -R /tmp/inactive_article_source_archive_v1 research_outputs/inactive_article_source_archive_v1
          if [ -d /tmp/levline4_prospective_inactive_execution_v1 ]; then
            rm -rf research_outputs/levline4_prospective_inactive_execution_v1
            cp -R /tmp/levline4_prospective_inactive_execution_v1 research_outputs/levline4_prospective_inactive_execution_v1
          fi
          git add research_outputs/inactive_article_source_archive_v1/
          if [ -d research_outputs/levline4_prospective_inactive_execution_v1 ]; then
            git add research_outputs/levline4_prospective_inactive_execution_v1/
          fi
          if git diff --cached --quiet; then
            echo 'Inactive article and prospective execution archives unchanged.'
            exit 0
          fi
          git commit -m 'Capture official NFL inactive and prospective identity evidence'
          git push origin HEAD:research-data/inactive-snapshots-v1

      - name: Surface capture or execution dependency failure after preserving evidence
        if: always() && (github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true')
        run: |
          set -euo pipefail
          if [ "${{ steps.capture.outcome }}" != 'success' ]; then
            echo 'Official inactive article source capture failed; any evidence available was preserved.' >&2
            exit 1
          fi
          if [ "${{ steps.semantics.outputs.sunday }}" = 'true' ]; then
            if [ "${{ steps.weekly_identity.outcome }}" != 'success' ]; then
              echo 'Frozen weekly identity artifact unavailable; raw evidence was preserved.' >&2
              exit 1
            fi
            if [ "${{ steps.global_identity.outcome }}" != 'success' ]; then
              echo 'Frozen global identity artifact unavailable; raw evidence was preserved.' >&2
              exit 1
            fi
            if [ "${{ steps.sunday_execution.outcome }}" != 'success' ]; then
              echo 'Prospective Sunday inactive execution failed; raw and any downstream evidence were preserved.' >&2
              exit 1
            fi
          else
            if [ "${{ steps.nonsunday_execution.outcome }}" != 'success' ]; then
              echo 'Non-Sunday skip receipt failed after raw evidence preservation.' >&2
              exit 1
            fi
          fi
