name: LevLine V09D matchup interaction research

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/challenger_v09d.py'
      - 'scripts/run_challenger_v09d.py'
      - 'tests/test_challenger_v09d.py'
      - '.github/workflows/research_v09d_matchup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-v09d-matchup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  historical-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test fixed feature and production-import contracts
        run: pytest -q tests/test_challenger_v09d.py tests/test_challenger_evaluation.py tests/test_challenger_v08.py
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: nfl-v09d-matchup-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nfl-v09d-matchup-${{ runner.os }}-
            nfl-challenger-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Run pre-registered 2022-25 matchup ablation and uncertainty
        run: |
          rm -rf challenger_outputs/v09d
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" python scripts/run_challenger_v09d.py
          test -s challenger_outputs/v09d/report.json
          test -s challenger_outputs/v09d/paired_predictions_2022_2025.csv
          test -s challenger_outputs/v09d/adaptive_vs_v08_bootstrap.csv
          test -s challenger_outputs/v09d/adaptive_vs_market_bootstrap.csv
          test -s challenger_outputs/v09d/pure_vs_v08_pure_bootstrap.csv
          test -s challenger_outputs/v09d/brier_confidence_set.csv
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('challenger_outputs/v09d/report.json').read_text())
          assert report['experiment_id'] == 'V09D-MATCHUP-001'
          assert report['interaction_count'] == 4
          assert report['feature_subset_search_performed'] is False
          assert report['hyperparameter_search_performed'] is False
          assert report['paired_target_games'] >= 1000
          assert report['2026_data_loaded'] is False
          assert report['2026_outcomes_used'] == 0
          assert report['promotion_authorized'] is False
          assert report['shadow_authorized'] is False
          PY
      - name: Prove production outputs and site are untouched
        run: git diff --exit-code -- outputs/ site/
      - uses: actions/upload-artifact@v4
        with:
          name: levline-v09d-matchup-${{ github.run_id }}
          path: challenger_outputs/v09d/
          retention-days: 30
