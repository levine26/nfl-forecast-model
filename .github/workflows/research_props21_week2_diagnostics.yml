name: LevLine Props 2.1 Week 2 diagnostics

on:
  pull_request:
    paths:
      - 'research/props/v21/WEEK2_ERROR_DIAGNOSTICS_LOCK.md'
      - 'research/props/v21/diagnose_week2_miss.py'
      - 'research/props/v21/test_diagnose_week2_miss.py'
      - '.github/workflows/research_props21_week2_diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Validate descriptive diagnostics
        run: python -m pytest -q research/props/v21/test_diagnose_week2_miss.py
      - name: Enforce research firewall
        run: |
          git fetch origin main
          python scripts/check_research_firewall.py --base origin/main --head-ref "${{ github.head_ref || github.ref_name }}"
