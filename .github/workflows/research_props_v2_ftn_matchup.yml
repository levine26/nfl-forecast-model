name: LevLine Props 2.0 FTN matchup state

on:
  pull_request:
    branches:
      - research/props-v2-challenger
    paths:
      - "research/props/v2/props_ftn_matchup_state.py"
      - "research/props/v2/test_props_ftn_matchup_state.py"
      - "research/props/v2/run_ftn_matchup_coverage.py"
      - ".github/workflows/research_props_v2_ftn_matchup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftn-matchup-state:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile and test FTN matchup state
        run: |
          python -m py_compile research/props/v2/props_ftn_matchup_state.py
          python -m py_compile research/props/v2/run_ftn_matchup_coverage.py
          pytest -q research/props/v2/test_props_ftn_matchup_state.py
      - name: Audit real historical coverage
        run: |
          python research/props/v2/run_ftn_matchup_coverage.py             --season 2025             --week 10             --output-dir research_outputs/props_v2/ftn_matchup_coverage
      - name: Enforce chronology and coverage boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_outputs/props_v2/ftn_matchup_coverage/coverage.json")
          d=json.loads(p.read_text())
          assert d["promotion_authorized"] is False
          assert d["coefficients_fitted"] is False
          assert d["fair_lines_modified"] is False
          assert d["audit"]["target_week_rows_used"] == 0
          assert d["audit"]["completed_2026_outcomes_used_for_model_selection"] == 0
          assert d["audit"]["postseason_participation_used"] is False
          assert d["audit"]["live_source_capable"] is True
          assert d["audit"]["join"]["match_rate"] >= 0.90
          assert d["teams_with_offense_history"] >= 28
          assert d["teams_with_defense_history"] >= 28
          print(json.dumps(d, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-ftn-matchup-coverage
          path: research_outputs/props_v2/ftn_matchup_coverage/
          if-no-files-found: error
