name: LevLine research validation

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/challenger*.py'
      - 'src/nfl_forecast/experiment_registry.py'
      - 'src/nfl_forecast/player_state_research.py'
      - 'src/nfl_forecast/player_impact_cards.py'
      - 'scripts/run_challenger*.py'
      - 'scripts/run_player_state_research.py'
      - 'scripts/build_player_impact_cards.py'
      - 'research/**'
      - 'tests/test_challenger*.py'
      - 'tests/test_experiment_registry.py'
      - 'tests/test_research_firewall.py'
      - 'tests/test_player_state_research.py'
      - 'tests/test_player_impact_cards.py'
      - '.github/workflows/research_*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-research-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Test research foundation
        run: pytest -q tests/test_challenger.py tests/test_challenger_v06.py tests/test_challenger_v07.py tests/test_challenger_v08.py tests/test_challenger_shadow_lock.py tests/test_challenger_evaluation.py tests/test_experiment_registry.py tests/test_research_firewall.py
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: nfl-research-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nfl-research-${{ runner.os }}-
            nfl-challenger-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Regenerate v0.8 challenger in isolated workspace
        run: |
          rm -rf /tmp/v08-challenger
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" python scripts/run_challenger_v08.py --output-dir /tmp/v08-challenger
          test -s /tmp/v08-challenger/report.json
          test -s /tmp/v08-challenger/candidate_shadow_slate.csv
      - name: Run paired statistical uncertainty audit
        run: |
          rm -rf research_outputs/statistical_validation
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" python scripts/run_challenger_uncertainty.py --bootstrap-samples 2000
          test -s research_outputs/statistical_validation/v08_uncertainty_report.json
          test -s research_outputs/statistical_validation/v08_model_confidence_set.csv
      - name: Prove production surfaces were untouched
        run: |
          git diff --exit-code -- outputs/ site/ src/nfl_forecast/pipeline.py src/nfl_forecast/models.py src/nfl_forecast/features.py src/nfl_forecast/data.py src/nfl_forecast/publish.py src/nfl_forecast/market.py src/nfl_forecast/market_t120.py src/nfl_forecast/lock_verify.py scripts/run_week.py scripts/refresh_market.py scripts/pregame_due.py scripts/verify_pregame_lock.py
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: levline-v09-foundation-${{ github.run_id }}
          path: |
            /tmp/v08-challenger/
            research_outputs/statistical_validation/
          retention-days: 30
