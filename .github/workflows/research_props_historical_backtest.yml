name: LevLine Props historical directional accuracy

on:
  pull_request:
    branches:
      - research/props-integration
    paths:
      - "research/props/evaluation/run_historical_directional_backtest.py"
      - "research/props/evaluation/aggregate_historical_directional_backtest.py"
      - "research/props/evaluation/HISTORICAL_DIRECTIONAL_ACCURACY_PREREGISTRATION.md"
      - ".github/workflows/research_props_historical_backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyarrow
      - name: Compile historical backtest
        run: |
          python -m py_compile research/props/evaluation/run_historical_directional_backtest.py
          python -m py_compile research/props/evaluation/aggregate_historical_directional_backtest.py
      - name: Run engineering pilot
        run: |
          python research/props/evaluation/run_historical_directional_backtest.py \
            --season 2025 \
            --week-start 1 \
            --week-end 1 \
            --simulations 1000 \
            --book-id 30 \
            --output-dir research_outputs/props_accuracy/historical_pilot
      - name: Require executable real-data path
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("research_outputs/props_accuracy/historical_pilot/2025_summary.json")
          d=json.loads(path.read_text())
          print(json.dumps(d["headline"], indent=2))
          print(json.dumps(d["exclusions"], indent=2))
          assert d["market_pairing"]["paired_observations"] > 0
          assert d["event_mapping"]["mapped_events"] > 0
          assert d["headline"]["qualified"] > 0
          assert d["headline"]["wins"] + d["headline"]["losses"] > 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-historical-engineering-pilot
          path: research_outputs/props_accuracy/historical_pilot/
          if-no-files-found: error

  primary:
    needs: pilot
    strategy:
      fail-fast: false
      matrix:
        season: [2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyarrow
      - name: Run preregistered season backtest
        run: |
          python research/props/evaluation/run_historical_directional_backtest.py \
            --season ${{ matrix.season }} \
            --week-start 1 \
            --week-end 18 \
            --simulations 20000 \
            --book-id 30 \
            --output-dir research_outputs/props_accuracy/historical_primary/${{ matrix.season }}
      - name: Assert frozen primary contract
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          season=int(os.environ["SEASON"])
          path=Path(f"research_outputs/props_accuracy/historical_primary/{season}/{season}_summary.json")
          d=json.loads(path.read_text())
          assert d["contract_version"] == "levline-props-historical-directional-v1.0"
          assert d["simulations_per_game"] == 20000
          assert d["market_pairing"]["book_id"] == 30
          assert d["market_pairing"]["require_genuine_open"] is True
          assert d["headline"]["wins"] + d["headline"]["losses"] > 0
          print(json.dumps(d["headline"], indent=2))
          PY
        env:
          SEASON: ${{ matrix.season }}
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-historical-primary-${{ matrix.season }}
          path: research_outputs/props_accuracy/historical_primary/${{ matrix.season }}/
          if-no-files-found: error

  aggregate:
    needs: primary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install aggregation dependencies
        run: python -m pip install pandas numpy
      - name: Download season artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: levline-props-historical-primary-*
          path: research_outputs/props_accuracy/historical_downloads
          merge-multiple: true
      - name: Aggregate primary X
        run: |
          python research/props/evaluation/aggregate_historical_directional_backtest.py \
            --input-dir research_outputs/props_accuracy/historical_downloads \
            --output-dir research_outputs/props_accuracy/historical_aggregate
      - name: Print headline
        run: |
          cat research_outputs/props_accuracy/historical_aggregate/2023_2025_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-historical-primary-aggregate
          path: research_outputs/props_accuracy/historical_aggregate/
          if-no-files-found: error
