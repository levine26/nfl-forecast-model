name: LevLine 4 official club roster parser V2 held-out

on:
  pull_request:
    paths:
      - 'research/levline4_2026_official_club_roster_parser_v2_contract.json'
      - 'research/levline4_2026_official_club_roster_parser_v2.py'
      - 'research/test_levline4_2026_official_club_roster_parser_v2.py'
      - 'research/levline4_2026_official_club_roster_parser_v2_first_held_out_receipt.json'
      - 'research/levline4_2026_official_club_roster_parser_v2_first_held_out_manifest.json'
      - '.github/workflows/research_levline4_2026_official_club_roster_parser_v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: levline4-official-club-roster-parser-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  unit-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight parser dependencies
        run: python -m pip install pytest 'requests>=2.32' 'beautifulsoup4>=4.12' 'lxml>=5.0'
      - name: Run frozen V2 parser tests
        run: pytest -q research/test_levline4_2026_official_club_roster_parser_v2.py
      - name: Assert preregistered authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('research/levline4_2026_official_club_roster_parser_v2_contract.json').read_text())
          assert c['contract_id']=='LEVLINE-4-2026-OFFICIAL-CLUB-ROSTER-PARSER-V2'
          assert c['status']=='PREREGISTERED_HELD_OUT_SOURCE_PARSER_QUALIFICATION'
          assert c['discovery_evidence']['workflow_run_id']==35127480203
          assert c['discovery_evidence']['artifact_id']==10459946019
          assert c['discovery_evidence']['discovery_only_not_validation'] is True
          assert c['frozen_parser']['minimum_parsed_rows_per_team']==70
          assert c['frozen_parser']['jersey_may_be_empty'] is True
          assert c['frozen_parser']['no_fuzzy_matching'] is True
          assert c['qualification_gate']['post_result_threshold_relaxation_allowed'] is False
          assert c['qualification_gate']['same_version_retry_may_replace_first_held_out_result'] is False
          assert c['authority_if_gate_passes']['official_club_roster_metadata_parser_qualified'] is True
          assert c['authority_if_gate_passes']['official_club_roster_source_is_independent_gsis_ground_truth'] is False
          assert c['authority_if_gate_passes']['player_identity_to_gsis_qualified'] is False
          assert c['authority_if_gate_passes']['availability_state_authorized'] is False
          assert c['authority_if_gate_passes']['forecast_probability_effect_authorized'] is False
          assert c['authority_if_gate_passes']['production_authorized'] is False
          assert c['governance']['completed_2026_outcomes_used_for_design_or_selection']==0
          assert c['governance']['postgame_participation_used'] is False
          assert c['governance']['f_st_01_frozen_2026_unchanged'] is True
          PY

  canonical-held-out-evidence:
    needs: unit-and-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect whether canonical first-run evidence is frozen
        id: canonical
        shell: bash
        run: |
          if [[ -f research/levline4_2026_official_club_roster_parser_v2_first_held_out_manifest.json && \
                -f research/levline4_2026_official_club_roster_parser_v2_first_held_out_receipt.json ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.canonical.outputs.present != 'true'
        with:
          python-version: '3.11'
      - name: Install held-out capture dependencies
        if: steps.canonical.outputs.present != 'true'
        run: python -m pip install 'requests>=2.32' 'beautifulsoup4>=4.12' 'lxml>=5.0'
      - name: Prove parser contract predates first execution head
        if: steps.canonical.outputs.present != 'true'
        run: |
          set -euo pipefail
          contract_commit=$(git log -1 --format=%H -- research/levline4_2026_official_club_roster_parser_v2_contract.json)
          test -n "$contract_commit"
          test "$contract_commit" != "$GITHUB_SHA"
          echo "frozen_contract_commit=$contract_commit"
      - name: Execute first held-out 32-club V2 capture
        if: steps.canonical.outputs.present != 'true'
        id: heldout
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m research.levline4_2026_official_club_roster_parser_v2
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify new held-out receipt cannot broaden authority
        if: steps.canonical.outputs.present != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_outputs/levline4_2026_official_club_roster_parser_v2/receipt.json')
          assert p.is_file(), 'held-out V2 receipt missing'
          r=json.loads(p.read_text())
          assert r['contract_id']=='LEVLINE-4-2026-OFFICIAL-CLUB-ROSTER-PARSER-V2'
          assert r['expected_team_count']==32
          assert r['discovery_workflow_run_id']==35127480203
          assert r['discovery_artifact_id']==10459946019
          assert r['official_club_roster_source_is_independent_gsis_ground_truth'] is False
          for key in (
              'player_identity_to_gsis_qualified',
              'week2_sunday_due_inactive_player_identity_to_gsis_qualified',
              'general_2026_player_identity_to_gsis_qualified',
              'game_day_membership_qualified',
              'availability_state_authorized',
              'player_value_join_authorized',
              'forecast_probability_effect_authorized',
              'model_fit_authorized',
              'production_authorized',
          ):
              assert r[key] is False, key
          assert r['completed_2026_outcomes_used_for_design_or_selection']==0
          assert r['postgame_participation_used'] is False
          assert r['f_st_01_frozen_2026_unchanged'] is True
          PY
      - name: Upload immutable first held-out V2 evidence
        if: steps.canonical.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: levline4-official-club-roster-parser-v2-first-held-out-${{ github.run_id }}
          path: research_outputs/levline4_2026_official_club_roster_parser_v2/
          if-no-files-found: error
          retention-days: 30
      - name: Surface first held-out failure after evidence upload
        if: steps.canonical.outputs.present != 'true'
        shell: bash
        run: test "${{ steps.heldout.outputs.exit_code }}" = "0"

      - name: Read canonical first-run manifest
        if: steps.canonical.outputs.present == 'true'
        id: manifest
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          m=json.loads(Path('research/levline4_2026_official_club_roster_parser_v2_first_held_out_manifest.json').read_text())
          assert m['first_result_is_canonical'] is True
          assert m['later_same_version_execution_may_replace_first_result'] is False
          print(f"artifact_id={m['first_held_out_artifact_id']}")
          print(f"artifact_digest={m['artifact_digest']}")
          PY
      - name: Download exact canonical first held-out artifact
        if: steps.canonical.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          observed_digest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.manifest.outputs.artifact_id }}" --jq '.digest')
          test "$observed_digest" = "${{ steps.manifest.outputs.artifact_digest }}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.manifest.outputs.artifact_id }}/zip" > /tmp/v2_first.zip
          rm -rf /tmp/v2_first
          mkdir -p /tmp/v2_first
          unzip -q /tmp/v2_first.zip -d /tmp/v2_first
      - name: Verify canonical first held-out bytes and authority
        if: steps.canonical.outputs.present == 'true'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest=json.loads(Path('research/levline4_2026_official_club_roster_parser_v2_first_held_out_manifest.json').read_text())
          frozen=json.loads(Path('research/levline4_2026_official_club_roster_parser_v2_first_held_out_receipt.json').read_text())
          root=Path('/tmp/v2_first')
          def sha(name):
              return hashlib.sha256((root/name).read_bytes()).hexdigest()
          assert sha('receipt.json')==manifest['receipt_sha256']
          assert sha('team_diagnostics.json')==manifest['team_diagnostics_sha256']
          assert sha('roster_metadata.jsonl')==manifest['roster_metadata_sha256']
          observed=json.loads((root/'receipt.json').read_text())
          assert observed==frozen
          assert observed['status']=='PASS'
          assert observed['held_out_parser_gate_pass'] is True
          assert observed['captured_team_count']==32
          assert observed['http_success_team_count']==32
          assert observed['parser_gate_pass_team_count']==32
          assert observed['parsed_row_count']==2463
          assert observed['minimum_parsed_rows_observed']==71
          assert observed['maximum_parsed_rows_observed']==84
          assert observed['empty_jersey_row_count']==6
          assert observed['parse_error_count']==0
          assert observed['duplicate_profile_path_count']==0
          assert observed['source_errors']==[]
          assert observed['official_club_roster_metadata_parser_qualified'] is True
          assert observed['official_club_roster_source_is_independent_gsis_ground_truth'] is False
          for key in (
              'player_identity_to_gsis_qualified',
              'week2_sunday_due_inactive_player_identity_to_gsis_qualified',
              'general_2026_player_identity_to_gsis_qualified',
              'game_day_membership_qualified',
              'availability_state_authorized',
              'player_value_join_authorized',
              'forecast_probability_effect_authorized',
              'model_fit_authorized',
              'production_authorized',
          ):
              assert observed[key] is False, key
          assert observed['completed_2026_outcomes_used_for_design_or_selection']==0
          assert observed['postgame_participation_used'] is False
          assert observed['f_st_01_frozen_2026_unchanged'] is True
          print(json.dumps({
              'canonical_first_run_id':manifest['first_held_out_workflow_run_id'],
              'canonical_artifact_id':manifest['first_held_out_artifact_id'],
              'status':observed['status'],
              'parsed_row_count':observed['parsed_row_count'],
              'minimum_parsed_rows_observed':observed['minimum_parsed_rows_observed'],
              'maximum_parsed_rows_observed':observed['maximum_parsed_rows_observed'],
              'metadata_parser_qualified':observed['official_club_roster_metadata_parser_qualified'],
          },indent=2,sort_keys=True))
          PY

  research-firewall:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove branch is research-only
        run: |
          git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed=[x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()]
          bad=[x for x in changed if not (x.startswith('research/') or x.startswith('.github/workflows/research_'))]
          assert not bad, f'non-research paths changed: {bad}'
          PY
          git diff --exit-code origin/${{ github.base_ref || 'main' }}...HEAD -- outputs/ site/ src/ scripts/ config/
