name: Pregame NFL refresh
on:
  workflow_dispatch:
  schedule:
    # Sunday morning Pacific for the main slate.
    - cron: "30 15 * * 0"
    # Prime-time / standalone-game refreshes (Mon/Wed/Thu). Around 60-135 minutes
    # before typical evening kickoffs depending on daylight-saving time.
    - cron: "0 23 * * 1,3,4"
permissions:
  contents: write
concurrency:
  group: nfl-forecast-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
      - run: pytest -q
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: nflreadpy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nflreadpy-${{ runner.os }}-
      - run: python scripts/run_week.py --season 2026 --snapshot FINAL
      - name: Commit outputs
        run: |
          git config user.name "nfl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/
          git diff --cached --quiet || git commit -m "Update final NFL forecasts"
          git pull --rebase origin main
          git push
