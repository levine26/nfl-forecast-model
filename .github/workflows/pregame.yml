name: Pregame NFL refresh
on:
  workflow_dispatch:
  # A change to the lock gate can initiate a real-time repair run without
  # requiring the external scheduler to fire again.
  push:
    branches: [main]
    paths:
      - '.github/workflows/pregame.yml'
      - 'scripts/pregame_due.py'
  # Independent successful or failed production refreshes are an additional
  # scheduling heartbeat. This workflow reads only trusted current main.
  workflow_run:
    workflows:
      - 'Hourly NFL market refresh'
      - 'Daily NFL model refresh'
    types: [completed]
  schedule:
    # More than one opportunity per hour: scheduled GitHub events are best-effort
    # and can be delayed/dropped. The cheap gate avoids full work after a lock.
    # This is DST-safe and covers international/irregular kickoff times.
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: nfl-forecast-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether a final refresh is due
        id: gate
        run: |
          RESULT=$(python scripts/pregame_due.py --min-minutes 0 --max-minutes 165)
          echo "$RESULT"
          if echo "$RESULT" | grep -q '^due=true'; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
      - run: pytest -q
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
      - uses: actions/cache@v4
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        with:
          path: .cache/nflreadpy
          key: nflreadpy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nflreadpy-${{ runner.os }}-
      - name: Generate and publish final outputs
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        run: |
          set -euo pipefail
          git config user.name "levline-model-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "main advanced during pregame generation; regenerating from current main (attempt $attempt/3)"
              git reset --hard origin/main
              git clean -fd outputs/
            fi

            PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
              python scripts/run_week.py --season 2026 --snapshot FINAL

            # Fail closed if this run finishes inside the official T-120 window
            # but the immutable history row was not actually created. This does
            # not create or modify locks; write_outputs remains authoritative.
            PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
              python scripts/verify_pregame_lock.py

            # Confirm canonical forecasts and deterministic Reads match before commit.
            PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
              python scripts/sync_market_reads.py --output-dir outputs --check
            git add outputs/

            if git diff --cached --quiet; then
              echo "No final forecast output changes to publish."
              exit 0
            fi

            git commit -m "Refresh LevLine final forecasts"
            base_sha=$(git rev-parse HEAD^)
            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$base_sha" ]; then
              echo "Push failed even though main did not advance; refusing to mask a non-race publish error."
              exit 1
            fi
          done

          echo "main changed during all three pregame generation attempts; leaving existing published outputs untouched."
          exit 1
