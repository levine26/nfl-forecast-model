name: Pregame NFL refresh
on:
  workflow_dispatch:
  schedule:
    # Cheap hourly gate. The gate reads the published slate and only runs the
    # expensive model when a kickoff is approaching. This is DST-safe and also
    # catches international, Saturday, holiday, and irregular kickoff times.
    - cron: "25 * * * *"
permissions:
  contents: write
concurrency:
  group: nfl-forecast-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether a final refresh is due
        id: gate
        run: |
          RESULT=$(python scripts/pregame_due.py --min-minutes 45 --max-minutes 165)
          echo "$RESULT"
          if echo "$RESULT" | grep -q '^due=true'; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
      - run: pytest -q
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
      - uses: actions/cache@v4
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        with:
          path: .cache/nflreadpy
          key: nflreadpy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nflreadpy-${{ runner.os }}-
      - run: python scripts/run_week.py --season 2026 --snapshot FINAL
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
      - name: Commit outputs
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.due == 'true'
        run: |
          git config user.name "levline-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/
          git diff --cached --quiet || git commit -m "Refresh LevLine final forecasts"
          git pull --rebase origin main
          git push
