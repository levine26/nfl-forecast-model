name: LevLine 4 preserve NGS player ID browser held-out V7

on:
  pull_request:
    paths:
      - '.github/workflows/research_levline4_preserve_ngs_player_id_browser_heldout_v7.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/research_levline4_preserve_ngs_player_id_browser_heldout_v7.yml'
  workflow_dispatch:

concurrency:
  group: levline4-preserve-ngs-player-id-browser-heldout-v7
  cancel-in-progress: false

env:
  SOURCE_ARTIFACT_ID: '10480271496'
  SOURCE_WORKFLOW_RUN_ID: '35180312523'
  SOURCE_HEAD_SHA: '24366c3688dec998a860ed8c3fb3c9ac0ef30956'
  EXPECTED_ARTIFACT_DIGEST: 'sha256:6fb06c558e516ac54f2bc9576358ab113d4913a817b6764f6efd9e10259c2d1b'
  EXPECTED_ARTIFACT_SIZE: '140399'
  MANIFEST_PATH: 'research/levline4_2026_ngs_player_id_browser_heldout_v7_first_result_manifest.json'
  DATA_BRANCH: 'research-data/levline4-ngs-player-id-browser-heldout-v7'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable canonical V7 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")
          test "$(echo "$meta" | jq -r .digest)" = "$EXPECTED_ARTIFACT_DIGEST"
          test "$(echo "$meta" | jq -r .size_in_bytes)" = "$EXPECTED_ARTIFACT_SIZE"
          test "$(echo "$meta" | jq -r .workflow_run.id)" = "$SOURCE_WORKFLOW_RUN_ID"
          test "$(echo "$meta" | jq -r .workflow_run.head_sha)" = "$SOURCE_HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/ngs_v7.zip
          rm -rf /tmp/ngs_v7 && mkdir -p /tmp/ngs_v7
          unzip -q /tmp/ngs_v7.zip -d /tmp/ngs_v7

      - name: Verify complete file map, frozen FAIL, and authority ceiling
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/ngs_v7')
          m=json.loads(Path(os.environ['MANIFEST_PATH']).read_text())
          observed={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(root.rglob('*')) if p.is_file()}
          assert m['contract_id']=='LEVLINE-4-2026-NGS-PLAYER-ID-BROWSER-HELDOUT-V7'
          assert m['first_artifact_id']==int(os.environ['SOURCE_ARTIFACT_ID'])
          assert m['first_workflow_run_id']==int(os.environ['SOURCE_WORKFLOW_RUN_ID'])
          assert m['first_head_sha']==os.environ['SOURCE_HEAD_SHA']
          assert m['first_artifact_digest']==os.environ['EXPECTED_ARTIFACT_DIGEST']
          assert m['canonical_file_count']==120
          assert len(observed)==120
          assert observed==m['canonical_file_sha256']
          assert m['canonical_status']=='FAIL'
          assert m['scientific_disposition']=='FAIL'
          assert m['technical_execution_completed'] is True
          assert m['execution_exit_code']==0
          assert m['failed_gates']==['every_executed_query_attempt_http_200_parseable_players_array']
          assert m['failure_class']=='FROZEN_TRANSPORT_GATE_HTTP_400_INVALID_EXACT_VISIBLE_NAME_QUERY'
          d=m['failure_detail']
          assert d['target_index']==44
          assert d['team']=='HOU'
          assert d['visible_name']=='Kenneth Murray, Jr.'
          assert d['query_kind']=='exact_visible_name'
          assert d['http_status']==400
          assert d['same_version_repair_allowed'] is False
          s=m['target_selection']
          assert s['eligible_row_count']==2237
          assert s['total_target_count']==103
          assert s['coverage_target_count']==64
          assert s['team_alias_ari_target_count']==4
          assert s['source_name_variant_target_count']==16
          assert s['canonical_name_variant_target_count']==32
          assert s['sorted_row_identity_sha256']=='8a6b4bd7f6f84f292a20f20ce378f69de74ea98ae34deeb09ad192bc64911d7c'
          assert s['target_projection_sha256']=='08170a782af614e79da43eaa201fc6898889b2001907adec72b6f259c2b7ef85'
          metrics=m['metrics']; gates=m['gates']
          assert metrics['target_count']==103
          assert metrics['executed_query_attempt_count']==113
          assert metrics['coverage_unique_resolution_count']==64
          assert metrics['canonical_name_variant_unique_resolution_count']==32
          assert metrics['source_name_variant_unique_resolution_count']==15
          assert metrics['team_alias_ari_unique_resolution_count']==4
          assert metrics['invalid_selected_gsis_count']==0
          assert metrics['duplicate_selected_gsis_across_distinct_target_rows_count']==0
          assert metrics['fallback_exercised_count']==6 and metrics['fallback_success_count']==6
          assert metrics['independent_resolved_coverage_jersey_comparable_count']==62
          assert metrics['independent_resolved_coverage_jersey_agreement_count']==61
          assert gates['every_executed_query_attempt_http_200_parseable_players_array'] is False
          assert all(v is True for k,v in gates.items()
                     if k!='every_executed_query_attempt_http_200_parseable_players_array')
          g=m['governance']
          assert g['completed_2026_outcomes_used_for_design_or_selection']==0
          assert g['postgame_participation_used'] is False
          assert g['week2_inactive_execution_evidence_used_for_design'] is False
          assert g['future_information_used_to_repair_point_in_time_state'] is False
          assert g['f_st_01_frozen_2026_unchanged'] is True
          assert g['research_only'] is True and g['production_paths_changed'] is False
          assert all(v is False for v in m['authority'].values() if isinstance(v,bool))
          PY

  preserve:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download immutable canonical V7 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")
          test "$(echo "$meta" | jq -r .digest)" = "$EXPECTED_ARTIFACT_DIGEST"
          test "$(echo "$meta" | jq -r .size_in_bytes)" = "$EXPECTED_ARTIFACT_SIZE"
          test "$(echo "$meta" | jq -r .workflow_run.id)" = "$SOURCE_WORKFLOW_RUN_ID"
          test "$(echo "$meta" | jq -r .workflow_run.head_sha)" = "$SOURCE_HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/ngs_v7.zip
          rm -rf /tmp/ngs_v7 && mkdir -p /tmp/ngs_v7
          unzip -q /tmp/ngs_v7.zip -d /tmp/ngs_v7

      - name: Reverify and add preservation metadata
        run: |
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('/tmp/ngs_v7')
          m=json.loads(Path(os.environ['MANIFEST_PATH']).read_text())
          observed={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(root.rglob('*')) if p.is_file()}
          assert observed==m['canonical_file_sha256'] and len(observed)==120
          assert m['canonical_status']=='FAIL' and m['scientific_disposition']=='FAIL'
          assert m['failed_gates']==['every_executed_query_attempt_http_200_parseable_players_array']
          preservation={
            'schema_version':'levline4-ngs-player-id-browser-heldout-v7-preservation-v1',
            'source_actions_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
            'source_workflow_run_id':int(os.environ['SOURCE_WORKFLOW_RUN_ID']),
            'source_head_sha':os.environ['SOURCE_HEAD_SHA'],
            'actions_artifact_digest':os.environ['EXPECTED_ARTIFACT_DIGEST'],
            'actions_artifact_size_in_bytes':int(os.environ['EXPECTED_ARTIFACT_SIZE']),
            'canonical_file_sha256':m['canonical_file_sha256'],
            'preserved_at_utc':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'preserving_workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'canonical_result':'FAIL',
            'scientific_disposition':'FAIL',
            'failure_gate':'every_executed_query_attempt_http_200_parseable_players_array',
            'failure_class':m['failure_class'],
            'failure_target_index':44,
            'coverage_resolved_count':64,
            'coverage_target_count':64,
            'canonical_name_variant_resolved_count':32,
            'canonical_name_variant_target_count':32,
            'research_only':True,
            'general_2026_player_identity_to_gsis_qualified':False,
            'game_day_membership_qualified':False,
            'availability_state_authorized':False,
            'player_value_join_authorized':False,
            'forecast_probability_effect_authorized':False,
            'model_fit_authorized':False,
            'production_authorized':False,
            'completed_2026_outcomes_used':0,
            'postgame_participation_used':False,
            'week2_inactive_execution_evidence_used_for_design':False,
            'future_information_used_to_repair_point_in_time_state':False,
            'f_st_01_frozen_2026_unchanged':True,
          }
          (root/'preservation.json').write_text(json.dumps(preservation,indent=2,sort_keys=True)+'\n')
          PY

      - name: Persist on dedicated research-data branch
        run: |
          set -euo pipefail
          git fetch origin "${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${DATA_BRANCH}"; then
            git checkout -B ngs-v7-data "origin/${DATA_BRANCH}"
          else
            git checkout -B ngs-v7-data
          fi
          DEST='research_outputs/levline4_2026_ngs_player_id_browser_heldout_v7/first_result_35180312523'
          if [ -e "$DEST/preservation.json" ]; then
            DEST="$DEST" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['DEST']); p=json.loads((root/'preservation.json').read_text())
          assert p['source_actions_artifact_id']==int(os.environ['SOURCE_ARTIFACT_ID'])
          assert p['source_workflow_run_id']==int(os.environ['SOURCE_WORKFLOW_RUN_ID'])
          assert p['source_head_sha']==os.environ['SOURCE_HEAD_SHA']
          assert p['actions_artifact_digest']==os.environ['EXPECTED_ARTIFACT_DIGEST']
          assert p['canonical_result']=='FAIL' and p['scientific_disposition']=='FAIL'
          assert p['production_authorized'] is False
          for rel,expected in p['canonical_file_sha256'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==expected, rel
          PY
            echo 'Canonical NGS browser held-out V7 evidence already preserved exactly.'
            exit 0
          fi
          mkdir -p "$(dirname "$DEST")"
          cp -R /tmp/ngs_v7 "$DEST"
          git config user.name 'levline-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'Preserve canonical failed NGS browser held-out V7 evidence'
          git push origin HEAD:"${DATA_BRANCH}"
