name: ATS NextGen Phase 2 Stage D Closeout

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/challenger_ats_nextgen_stage_d.py'
      - 'scripts/run_challenger_ats_nextgen_stage_d.py'
      - 'tests/test_challenger_ats_nextgen_stage_d.py'
      - 'research/ats-nextgen/**'
      - '.github/workflows/research_ats_nextgen_stage_d.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ats-nextgen-stage-d-closeout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROTECTED_SURFACES: >-
    outputs/ site/ src/nfl_forecast/pipeline.py src/nfl_forecast/models.py
    src/nfl_forecast/features.py src/nfl_forecast/data.py src/nfl_forecast/publish.py
    src/nfl_forecast/market.py src/nfl_forecast/market_t120.py src/nfl_forecast/lock_verify.py
    scripts/run_week.py scripts/refresh_market.py scripts/pregame_due.py scripts/verify_pregame_lock.py

jobs:
  contract:
    name: Stage D frozen synthesis contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Re-prove frozen scientific contracts
        run: |
          pytest -q \
            tests/test_challenger_ats_nextgen_phase2_gate.py \
            tests/test_challenger_ats_nextgen_q1.py \
            tests/test_challenger_ats_nextgen_q1_reporting.py \
            tests/test_challenger_ats_nextgen_q3.py \
            tests/test_challenger_ats_nextgen_q3_reporting.py \
            tests/test_challenger_ats_nextgen_stage_d.py
      - name: Verify immutable Stage-D result registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('research/ats-nextgen/phase2_stage_d_result_registry.json').read_text())
          assert result['status'] == 'COMPLETE_ACCEPTED_EVIDENCE'
          assert result['classification'] == 'FINAL_PHASE2_EVIDENCE_SYNTHESIS_COMPLETE'
          assert result['accepted_result_head'] == 'd9a416ff17e2692b1ed86c461b4bd87f5a6cb8ba'
          assert result['workflow']['run_id'] == 35938628588
          assert result['workflow']['conclusion'] == 'success'
          assert result['workflow']['contract_job_id'] == 107441314608
          assert result['workflow']['synthesis_job_id'] == 107441551438
          assert result['artifact']['id'] == 10783982962
          assert result['artifact']['digest'] == 'sha256:a7386fdb000e3dd17ee44563762e8cdb5c9423e62467f41138419978c4a75d7c'
          assert result['artifact']['files_sha256'] == {
              'phase2_stage_d_hit_rate_intervals.csv': '885c4627c814286b76e6ba3e91c34bafd97b2079f4937448b385e7220df720b3',
              'phase2_stage_d_paired_uncertainty.csv': 'c6680a25bc6acc17a6b552bd6c9593df166d17c5e2e750e1ebffa7d538ed6f1e',
              'phase2_stage_d_season_deltas.csv': '28316ccf2e7009f0a9a9f1fe1a5e2f127a7f449dfb5cd04a15e506c7dd15f0bc',
              'phase2_stage_d_summary.json': 'd78dcf91965bdb71bea8fbcf0261bbe5ff629e28b0a7538e12ac20e07c1766a9',
          }
          assert result['bootstrap'] == {
              'samples': 10000,
              'seed': 26,
              'alpha': 0.05,
              'block_columns': ['season', 'week'],
              'blocks': 72,
              'interval': 'percentile_95pct',
          }
          assert result['accepted_inputs']['q1']['classification'] == 'VALID_NEGATIVE_INCREMENTAL_RESULT'
          assert result['accepted_inputs']['q2']['classification'] == 'STRUCTURALLY_INVALID_FROZEN_SUPPORT_CONTRACT'
          assert result['accepted_inputs']['q2']['valid_oof_available'] is False
          assert result['accepted_inputs']['q2']['q2_q3_blend_available'] is False
          assert result['accepted_inputs']['q3']['classification'] == 'NOT_INCREMENTAL_VS_Q3_M2'
          assert result['phase3_classification_performed'] is False
          assert result['new_candidate_fit_or_selection_performed'] is False
          assert result['candidate_rescue_performed'] is False
          assert result['completed_2026_outcomes_used'] == 0
          assert result['production_changed'] is False
          PY
      - name: Verify immutable result-document blobs
        run: |
          test "$(git rev-parse HEAD:research/ats-nextgen/PHASE2_STAGE_D_RESULT_RECEIPT.md)" = "649e67eaaa16353d7f8a91109e1c86483dd2153c"
          test "$(git rev-parse HEAD:research/ats-nextgen/phase2_stage_d_result_registry.json)" = "c4450bbebd78f383b04d51eb85f1129caa684704"
      - name: Prove closeout checks did not modify production surfaces
        run: git diff --exit-code -- $PROTECTED_SURFACES

  closeout:
    name: Stage D immutable closeout
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Phase-2 closeout state
        run: |
          grep -Fq 'Phase 2 is **COMPLETE' research/ats-nextgen/CURRENT_STATE_AND_NEXT_STEPS.md
          grep -Fq 'FINAL_PHASE2_EVIDENCE_SYNTHESIS_COMPLETE' research/ats-nextgen/phase2_stage_d_result_registry.json
          grep -Fq 'PHASE 2 SCIENTIFIC WORK COMPLETE' research/ats-nextgen/FINAL_PHASE2_RECEIPT.md
          grep -Fq 'READY AFTER PHASE-2 CLOSEOUT MERGE' research/ats-nextgen/PHASE3_HANDOFF.md
      - name: Prove no production diff was introduced by closeout
        run: git diff --exit-code -- $PROTECTED_SURFACES
