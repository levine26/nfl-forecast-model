name: LevLine Props 2.0 prop-family market residual

on:
  pull_request:
    branches:
      - research/props-v2-challenger
    paths:
      - "research/props/v2/PROP_FAMILY_MARKET_RESIDUAL_EXPERIMENT_CONTRACT.md"
      - "research/props/v2/evaluate_prop_family_market_residual.py"
      - "research/props/v2/test_prop_family_market_residual.py"
      - ".github/workflows/research_props_v2_market_prior_by_prop.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile and test family residual
        run: |
          python -m py_compile research/props/v2/evaluate_prop_family_market_residual.py
          pytest -q research/props/v2/test_prop_family_market_residual.py

  evaluate:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download exact frozen V1 historical receipts
        run: |
          mkdir -p research_outputs/props_v2/market_by_prop/v1/2023
          mkdir -p research_outputs/props_v2/market_by_prop/v1/2024
          mkdir -p research_outputs/props_v2/market_by_prop/v1/2025
          gh run download 35363701921 -n levline-props-historical-primary-2023 -D research_outputs/props_v2/market_by_prop/v1/2023
          gh run download 35363701921 -n levline-props-historical-primary-2024 -D research_outputs/props_v2/market_by_prop/v1/2024
          gh run download 35363701921 -n levline-props-historical-primary-2025 -D research_outputs/props_v2/market_by_prop/v1/2025
      - name: Verify authoritative receipt hashes
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected={
            2023:"b89835c777fbef531afbdbadda3e07c6ac4da72b6a22178aa8dbc4e9ef29d4bd",
            2024:"cf9e31d0e80cc141e47db3c4f6d167e52f66302e8e0085c16d8e9bfa0bb98e12",
            2025:"6d2d8aaf95a549b1cc6841f23d49b07c3d9f9d38c1e7ee1be6242cced34d085a",
          }
          for season,digest in expected.items():
              p=Path(f"research_outputs/props_v2/market_by_prop/v1/{season}/{season}_forecast_level.csv")
              got=sha256(p.read_bytes()).hexdigest()
              assert got == digest, (season, got, digest)
          PY
      - name: Evaluate prop-family market residual
        run: |
          python research/props/v2/evaluate_prop_family_market_residual.py             --input research_outputs/props_v2/market_by_prop/v1/2023/2023_forecast_level.csv             --input research_outputs/props_v2/market_by_prop/v1/2024/2024_forecast_level.csv             --input research_outputs/props_v2/market_by_prop/v1/2025/2025_forecast_level.csv             --output-dir research_outputs/props_v2/market_by_prop/evaluation
      - name: Enforce experiment boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research_outputs/props_v2/market_by_prop/evaluation/summary.json").read_text())
          assert d["contract_version"] == "levline-props-v2-prop-family-market-residual-v0.1.0"
          assert d["promotion_authorized"] is False
          assert d["selective_betting_threshold_used"] is False
          assert d["completed_2026_outcomes_used_for_tuning"] == 0
          assert d["minimum_training_rows_per_family"] == 50
          print(json.dumps({
              "decision":d["preregistered_development_decision"],
              "fixed":d["fixed_anchor"]["evaluation"],
              "rolling":d["rolling_origin"]["evaluation"],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-market-prior-by-prop
          path: research_outputs/props_v2/market_by_prop/evaluation/
          if-no-files-found: error
