name: LevLine Props 2.0 challengers

on:
  pull_request:
    branches:
      - research/props-accuracy-evaluation
    paths:
      - "src/nfl_forecast/props_market_residual.py"
      - "src/nfl_forecast/props_role_state.py"
      - "tests/test_props_market_residual.py"
      - "tests/test_props_role_state.py"
      - "research/props/v2/**"
      - "research/props/evaluation/run_historical_directional_backtest.py"
      - ".github/workflows/research_props_v2_challengers.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile challenger code
        run: |
          python -m py_compile src/nfl_forecast/props_market_residual.py
          python -m py_compile src/nfl_forecast/props_role_state.py
          python -m py_compile research/props/v2/evaluate_market_prior_challenger.py
          python -m py_compile research/props/evaluation/run_historical_directional_backtest.py
      - name: Run challenger mechanics and leakage tests
        run: |
          pytest -q tests/test_props_market_residual.py tests/test_props_role_state.py

  market_prior_development:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download frozen V1 historical forecast ledgers
        run: |
          mkdir -p research_outputs/props_v2/v1
          gh run download 35363701921 -n levline-props-historical-primary-2023 -D research_outputs/props_v2/v1/2023
          gh run download 35363701921 -n levline-props-historical-primary-2024 -D research_outputs/props_v2/v1/2024
          gh run download 35363701921 -n levline-props-historical-primary-2025 -D research_outputs/props_v2/v1/2025
          find research_outputs/props_v2/v1 -maxdepth 3 -type f -print
      - name: Evaluate chronology-constrained market-prior residual
        run: |
          python research/props/v2/evaluate_market_prior_challenger.py             --input research_outputs/props_v2/v1/2023/2023_forecast_level.csv             --input research_outputs/props_v2/v1/2024/2024_forecast_level.csv             --input research_outputs/props_v2/v1/2025/2025_forecast_level.csv             --output-dir research_outputs/props_v2/market_prior
      - name: Enforce research-only interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_outputs/props_v2/market_prior/summary.json")
          d=json.loads(p.read_text())
          assert d["promotion_authorized"] is False
          assert d["historical_2023_2025_is_pristine_promotion_holdout"] is False
          assert d["selective_betting_threshold_used"] is False
          print(json.dumps({
              "fixed_anchor": d["fixed_anchor"]["evaluation"],
              "rolling_origin": d["rolling_origin"]["evaluation"],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-market-prior-development
          path: research_outputs/props_v2/market_prior/
          if-no-files-found: error

  role_pilot:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyarrow
      - name: Run real-data snap-role engineering pilot
        run: |
          python research/props/evaluation/run_historical_directional_backtest.py             --season 2024             --week-start 10             --week-end 10             --simulations 1500             --book-id 30             --role-state-mode snap_trend             --output-dir research_outputs/props_v2/role_pilot
      - name: Require leakage-safe role execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research_outputs/props_v2/role_pilot/2024_summary.json")
          d=json.loads(p.read_text())
          assert d["role_state_mode"] == "snap_trend"
          assert d["promotion_authorized"] is False
          assert d["role_state_totals"]["games_processed"] > 0
          assert d["role_state_totals"]["adjusted_players"] > 0
          assert d["headline"]["wins"] + d["headline"]["losses"] > 0
          assert not d["game_build_errors"], d["game_build_errors"]
          print(json.dumps({
              "headline": d["headline"],
              "role_state_totals": d["role_state_totals"],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-role-pilot
          path: research_outputs/props_v2/role_pilot/
          if-no-files-found: error

  role_full:
    needs: role_pilot
    strategy:
      fail-fast: false
      matrix:
        season: [2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyarrow
      - name: Run full snap-role challenger
        run: |
          python research/props/evaluation/run_historical_directional_backtest.py             --season ${{ matrix.season }}             --week-start 1             --week-end 18             --simulations 20000             --book-id 30             --role-state-mode snap_trend             --output-dir research_outputs/props_v2/role/${{ matrix.season }}
      - name: Assert challenger contract
        env:
          SEASON: ${{ matrix.season }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          season=int(os.environ["SEASON"])
          p=Path(f"research_outputs/props_v2/role/{season}/{season}_summary.json")
          d=json.loads(p.read_text())
          assert d["role_state_mode"] == "snap_trend"
          assert d["promotion_authorized"] is False
          assert d["simulations_per_game"] == 20000
          assert d["market_pairing"]["book_id"] == 30
          assert d["market_pairing"]["require_genuine_open"] is True
          assert d["headline"]["wins"] + d["headline"]["losses"] > 0
          print(json.dumps(d["headline"], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-role-${{ matrix.season }}
          path: research_outputs/props_v2/role/${{ matrix.season }}/
          if-no-files-found: error

  role_aggregate:
    needs: role_full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install aggregation dependencies
        run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: levline-props-v2-role-20*
          path: research_outputs/props_v2/role_downloads
          merge-multiple: true
      - name: Aggregate snap-role challenger
        run: |
          python research/props/evaluation/aggregate_historical_directional_backtest.py             --input-dir research_outputs/props_v2/role_downloads             --output-dir research_outputs/props_v2/role_aggregate
      - name: Compare with frozen V1 without promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research_outputs/props_v2/role_aggregate")
          d=json.loads((root/"2023_2025_summary.json").read_text())
          h=d["headline"]
          v1={"accuracy":0.5102473498233216,"wins":2888,"losses":2772}
          comparison={
              "research_label":"RETROSPECTIVE CHALLENGER DEVELOPMENT - NOT PROMOTION EVIDENCE",
              "promotion_authorized":False,
              "v1_frozen":v1,
              "snap_role_challenger":h,
              "accuracy_difference":(
                  None if h["accuracy"] is None else float(h["accuracy"])-v1["accuracy"]
              ),
              "interpretation":"2023-2025 outcomes informed the research program; this comparison cannot authorize production."
          }
          (root/"v1_comparison.json").write_text(json.dumps(comparison,indent=2,sort_keys=True)+"\n")
          print(json.dumps(comparison,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: levline-props-v2-role-aggregate
          path: research_outputs/props_v2/role_aggregate/
          if-no-files-found: error
