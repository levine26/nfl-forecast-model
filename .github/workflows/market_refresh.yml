name: Hourly NFL market refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"
permissions:
  contents: write
concurrency:
  group: nfl-market-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "pandas>=2.2" "numpy>=2.0"
      - run: pip install -e . --no-deps
      - name: Refresh and publish market outputs
        run: |
          set -euo pipefail
          git config user.name "nfl-market-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "main advanced during market refresh; regenerating from current main (attempt $attempt/3)"
              git reset --hard origin/main
              git clean -fd outputs/
            fi

            PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
              python scripts/refresh_market.py --season 2026
            git add outputs/

            if git diff --cached --quiet; then
              echo "No market output changes to publish."
              exit 0
            fi

            git commit -m "Refresh NFL market forecast"
            base_sha=$(git rev-parse HEAD^)
            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$base_sha" ]; then
              echo "Push failed even though main did not advance; refusing to mask a non-race publish error."
              exit 1
            fi
          done

          echo "main changed during all three market refresh attempts; leaving existing published outputs untouched."
          exit 1
