name: Hourly NFL market refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"
permissions:
  contents: write
concurrency:
  group: nfl-market-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - run: pip install "pandas==3.0.5" "numpy==2.4.6"
      - run: pip install -e . --no-deps
      - name: Refresh and publish market outputs
        run: |
          set -euo pipefail
          git config user.name "nfl-market-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "main advanced during market refresh; regenerating from current main (attempt $attempt/3)"
              git reset --hard origin/main
              git clean -fd outputs/
            fi

            refresh_ok=false
            for refresh_attempt in 1 2 3; do
              if PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
                python scripts/refresh_market.py --season 2026; then
                refresh_ok=true
                break
              fi
              if [ "$refresh_attempt" -lt 3 ]; then
                echo "Market generation failed; retrying transient upstream/network failure ($refresh_attempt/3)."
                sleep $((refresh_attempt * 15))
              fi
            done
            if [ "$refresh_ok" != "true" ]; then
              echo "Market generation failed on all three attempts; refusing to publish."
              exit 1
            fi
            # Publish refreshed forecasts and dependent deterministic Reads as one commit.
            # Do not re-run Groq/context research: preserve validated human editorial.
            PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
              python scripts/sync_market_reads.py --output-dir outputs --write
            PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}" \
              python scripts/sync_market_reads.py --output-dir outputs --check
            git add outputs/

            if git diff --cached --quiet; then
              echo "No market output changes to publish."
              exit 0
            fi

            git commit -m "Refresh NFL market forecast"
            base_sha=$(git rev-parse HEAD^)
            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$base_sha" ]; then
              echo "Push failed even though main did not advance; refusing to mask a non-race publish error."
              exit 1
            fi
          done

          echo "main changed during all three market refresh attempts; leaving existing published outputs untouched."
          exit 1
