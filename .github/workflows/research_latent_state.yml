name: LevLine F-LS-01 latent-state research

on:
  pull_request:
    paths:
      - "src/nfl_forecast/latent_state_research.py"
      - "src/nfl_forecast/challenger_latent_state.py"
      - "scripts/run_latent_state_research.py"
      - "tests/test_latent_state_research.py"
      - ".github/workflows/research_latent_state.yml"

permissions:
  contents: read

concurrency:
  group: latent-state-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  historical-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install '.[dev]'
      - name: Test chronology, recursion, and production-import contracts
        run: pytest -q tests/test_latent_state_research.py tests/test_challenger_v08.py
      - uses: actions/cache@v4
        with:
          path: .cache/nflreadpy
          key: nfl-f-ls-01-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nfl-f-ls-01-${{ runner.os }}-
            nfl-challenger-${{ runner.os }}-
            nflreadpy-${{ runner.os }}-
      - name: Run pre-registered 2022-25 latent-state ablation
        run: |
          rm -rf challenger_outputs/f_ls_01
          PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" python scripts/run_latent_state_research.py
          test -s challenger_outputs/f_ls_01/report.json
          test -s challenger_outputs/f_ls_01/paired_predictions_2022_2025.csv
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('challenger_outputs/f_ls_01/report.json').read_text())
          assert report['experiment_id'] == 'F-LS-01'
          assert report['paired_target_games'] >= 1000
          assert report['2026_outcomes_used'] == 0
          assert report['same_week_updates_used_for_same_week_features'] == 0
          assert report['hyperparameter_search_performed'] is False
          assert report['promotion_authorized'] is False
          assert report['shadow_authorized'] is False
          PY
      - name: Prove production outputs and site are untouched
        run: git diff --exit-code -- outputs/ site/
      - uses: actions/upload-artifact@v4
        with:
          name: levline-f-ls-01-${{ github.run_id }}
          path: challenger_outputs/f_ls_01/
          retention-days: 30
