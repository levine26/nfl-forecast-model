name: LevLine Props 2.2 transformation validation

on:
  pull_request:
    paths:
      - 'research/props/v22/challengers.py'
      - 'research/props/v22/test_challengers.py'
      - '.github/workflows/research_props22_implementation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-transformations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Validate preregistered transformations
        run: python -m pytest -q research/props/v22/test_preregistration.py research/props/v22/test_challengers.py
      - name: Enforce research firewall
        run: |
          git fetch origin main
          python scripts/check_research_firewall.py --base origin/main --head-ref "${{ github.head_ref || github.ref_name }}"