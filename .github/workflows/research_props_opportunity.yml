name: LevLine Props opportunity validation

on:
  pull_request:
    paths:
      - 'src/nfl_forecast/props_opportunity.py'
      - 'src/nfl_forecast/props_opportunity_adapter.py'
      - 'src/nfl_forecast/props_opportunity_handoff.py'
      - 'tests/test_props_opportunity.py'
      - 'tests/test_props_opportunity_adapter.py'
      - 'tests/test_props_opportunity_handoff.py'
      - 'research/props/OPPORTUNITY_INTERFACE.md'
      - '.github/workflows/research_props_opportunity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levline-props-opportunity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install '.[dev]'
      - name: Compile opportunity modules
        run: |
          python -m py_compile \
            src/nfl_forecast/props_opportunity.py \
            src/nfl_forecast/props_opportunity_adapter.py \
            src/nfl_forecast/props_opportunity_handoff.py
      - name: Run focused opportunity tests
        run: |
          pytest -q \
            tests/test_props_opportunity.py \
            tests/test_props_opportunity_adapter.py \
            tests/test_props_opportunity_handoff.py
      - name: Verify winner-model production surfaces are untouched
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code origin/${{ github.base_ref }}...HEAD -- \
            src/nfl_forecast/pipeline.py \
            src/nfl_forecast/models.py \
            src/nfl_forecast/features.py \
            src/nfl_forecast/fst_production.py
